<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SAO Link Start</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: radial-gradient(circle, #0b3658 0%, #020713 68%); overflow: hidden; color: #bdfcff; font-family: "Segoe UI", sans-serif; }
    .ring { position: fixed; inset: 12%; border: 2px solid rgba(81, 220, 255, .8); border-radius: 50%; box-shadow: 0 0 48px rgba(81, 220, 255, .4), inset 0 0 32px rgba(81, 220, 255, .2); animation: pulse 1.8s ease-in-out infinite; }
    .label { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; letter-spacing: .22em; text-transform: uppercase; color: #f9d86a; text-shadow: 0 0 18px rgba(249, 216, 106, .55); }
    .label small { display: block; margin-top: 10px; color: #bdfcff; letter-spacing: .08em; text-transform: none; }
    @keyframes pulse { 0%, 100% { transform: scale(.96); opacity: .72; } 50% { transform: scale(1.02); opacity: 1; } }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div class="label"><div>Link Start<small>C# standalone fallback</small></div></div>
  <script>
    setTimeout(function () {
      try { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('linkstart_done'); } catch (_) {}
      try { window.dispatchEvent(new CustomEvent('linkstart-done')); } catch (_) {}
    }, 900);
  </script>
</body>
</html>
