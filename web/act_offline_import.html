<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAO ACT Offline Import</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Panel-scoped tokens: LAYOUT/SIZING only. ALL colors come from the shared
   act_panel_theme.css var(--act-*) tokens so light/dark follow the host theme
   and stay 1:1 with the flat Tk Entity reference. The shared theme already
   targets .shell/.header/.main/.side/.metric/.preview/.pill/.empty/.toast with
   !important; this block only sets layout + colors the shared file leaves open.
   The metric TOP accent bar mirrors Tk metric_tile.
   ─────────────────────────────────────────────────────────────────────────── */
:root {
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --r-sm: 4px; --r-md: 6px;
    --fs-kicker: 10px; --fs-meta: 11px; --fs-body: 12px; --fs-title: 14px; --fs-metric: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; user-select: none; }
.shell { opacity: 0; transform: translateY(8px) scale(.99); transition: opacity .22s ease, transform .22s ease; }
.shell.visible { opacity: 1; transform: translateY(0) scale(1); }
.header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.kicker { letter-spacing: .18em; font-size: var(--fs-kicker); color: var(--act-gold); text-transform: uppercase; }
.title { margin-top: 2px; font-size: 19px; font-weight: 700; letter-spacing: .06em; color: var(--act-text); }
.header-actions { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill { min-width: 94px; text-align: center; padding: 5px 9px; font-size: var(--fs-body); }
button, input { padding: 7px 11px; font-size: var(--fs-body); font-weight: 600; }
input { width: 100%; font-weight: 400; }
button { cursor: pointer; white-space: nowrap; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--sp-3); }
.main { min-height: 0; overflow: auto; padding: var(--sp-3); }
.side { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); }
.side-title { color: var(--act-gold); font-size: var(--fs-body); letter-spacing: .16em; }
.path-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp-2); }
.row { display: flex; justify-content: space-between; gap: var(--sp-2); border-bottom: 1px solid var(--act-edge-soft); padding-bottom: 5px; font-size: var(--fs-body); color: var(--act-muted); }
.row strong { color: var(--act-text); text-align: right; }
.preview { padding: var(--sp-3); margin-bottom: var(--sp-3); }
.preview h3 { margin: 0 0 var(--sp-2); font-size: var(--fs-title); color: var(--act-gold); letter-spacing: .08em; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.metric { position: relative; padding: var(--sp-2) var(--sp-2) 9px; overflow: hidden; }
.metric::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--act-cyan); }
.metric span { display: block; color: var(--act-muted); font-size: var(--fs-meta); }
.metric strong { display: block; margin-top: var(--sp-1); color: var(--act-text); font-size: var(--fs-metric); overflow-wrap: anywhere; }
.history-item { padding: 9px; }
.history-item strong { color: var(--act-text); font-size: var(--fs-body); overflow-wrap: anywhere; }
.history-item small { display: block; margin: var(--sp-1) 0 var(--sp-2); color: var(--act-muted); font-size: var(--fs-meta); }
.empty { display: grid; place-items: center; height: 100%; min-height: 260px; text-align: center; line-height: 1.6; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; border-radius: 999px; padding: 8px 14px; font-size: var(--fs-body); transition: opacity .16s ease, transform .16s ease; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<link rel="stylesheet" href="act_panel_theme.css" />
<style>
/* Flat override (ACT panel only): kill shared decorative chrome + flatten per-page accents to a single 3px left rail. */
.shell,.panel,.plugin-shell{border:1px solid var(--act-edge)!important;border-radius:4px!important;background:var(--act-shell-bg)!important;box-shadow:none!important;}
.shell::before,.shell::after,.panel::before,.panel::after,.plugin-shell::before,.plugin-shell::after{display:none!important;content:none!important;}
.header,.plugin-header,header{background:var(--act-shell-bg-2)!important;border-bottom:1px solid var(--act-edge-soft)!important;}
button,input,select,.action-btn{clip-path:none!important;border-radius:3px!important;box-shadow:none!important;}
button:hover,.action-btn:hover{box-shadow:none!important;transform:none!important;background:var(--act-card-bg-2)!important;}
.main,.list,.plugin-list,.side,.side-panel,.section,.summary,.chart-wrap,.preview{box-shadow:none!important;}
.bar{background:var(--act-gold)!important;}.skill-row.heal .bar{background:var(--act-ok)!important;}
.pill,.badge,.status-pill{background:transparent!important;}
.aca-tile::before,.metric::before,.group-card::before{content:none!important;display:none!important;}
.aca-tile{border-left:3px solid var(--acc,var(--act-cyan))!important;}
.metric{border-left:3px solid var(--act-cyan)!important;}
.group-card{border-left:3px solid var(--act-gold)!important;}
.aca-fill{box-shadow:none!important;}
.aca-row.zebra{background:var(--act-card-bg-2)!important;}
.aca-badge,.aca-sec-badge{background:transparent!important;border-radius:3px!important;}
.group-head:hover{background:var(--act-card-bg-2)!important;}
.death td{box-shadow:none!important;background:transparent!important;border-left:3px solid var(--act-danger)!important;}
</style>
<script src="act_panel_theme.js"></script>
<script src="act_panel_util.js"></script>
</head>
<body>
<div class="shell" id="shell">
    <div class="header">
        <div><div class="kicker">ACT OFFLINE PIPELINE</div><div class="title">OFFLINE IMPORT</div></div>
        <div class="header-actions">
            <div class="pill" id="status-pill">READY</div>
            <button class="primary" type="button" onclick="OfflineImport.refresh()">刷新</button>
            <button class="close" type="button" onclick="OfflineImport.close()">×</button>
        </div>
    </div>
    <div class="body">
        <main class="main" id="preview"><div class="empty">选择 normalized replay 或 SAO XML report 后导入。<br/>IMPORT REPLAY / REPORT</div></main>
        <aside class="side">
            <div class="side-title">IMPORT FILE</div>
            <div class="path-row">
                <input id="import-path" type="text" placeholder="replay or XML report path" />
                <button type="button" onclick="OfflineImport.choose()">选择</button>
            </div>
            <button class="primary" type="button" onclick="OfflineImport.importFile()">导入 Import</button>
            <div class="side-title">STATUS</div>
            <div class="row"><span>State</span><strong id="sum-state">idle</strong></div>
            <div class="row"><span>Format</span><strong id="sum-format">--</strong></div>
            <div class="row"><span>Events</span><strong id="sum-events">0</strong></div>
            <div class="row"><span>History</span><strong id="sum-history">0</strong></div>
            <div class="side-title">HISTORY PLAYBACK</div>
            <div id="history-list"><div class="empty">暂无历史报告</div></div>
        </aside>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script>
(function () {
    "use strict";
    var shell = document.getElementById('shell');
    var preview = document.getElementById('preview');
    var toast = document.getElementById('toast');
    var importPath = document.getElementById('import-path');
    var historyList = document.getElementById('history-list');
    var toastTimer = null;
    function esc(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function parseResult(result) { if (typeof result === 'string') { try { return JSON.parse(result); } catch (_) { return { ok: false, message: result }; } } return result || {}; }
    function numericArg(value, fallback) {
        if (value == null || value === '') return fallback;
        var number = Number(value);
        return isFinite(number) ? number : fallback;
    }
    function safeLimit(value, fallback, hi) {
        var number = Math.round(numericArg(value, fallback == null ? 20 : fallback));
        if (!isFinite(number)) number = fallback == null ? 20 : fallback;
        return Math.max(1, Math.min(hi == null ? 200 : hi, number));
    }
    function safeHistoryIndex(value, fallback) {
        var number = Number(value);
        if (!isFinite(number) || number < 0) number = Number(fallback || 0);
        if (!isFinite(number) || number < 0) number = 0;
        return Math.floor(number);
    }
    function offlinePayload(name, args) {
        args = args || [];
        if (name === 'get_offline_import_status') return { history_limit: safeLimit(args[0], 20, 200) };
        if (name === 'choose_offline_import_file') return {};
        if (name === 'import_offline_report') {
            return { path: String(args[0] || ''), persist: args[1] !== false, show: args[2] !== false };
        }
        if (name === 'load_history_report') return { index: safeHistoryIndex(args[0], 0), show: args[1] !== false };
        if (name === 'toggle_offline_import') return { action: 'toggle_offline_import' };
        return { args: args };
    }
    function apiCall(name, args) {
        var api = window.pywebview && window.pywebview.api;
        if (api && typeof api[name] === 'function') return Promise.resolve(api[name].apply(api, args || [])).then(parseResult);
        if (window.bridge && typeof window.bridge.cmd === 'function') {
            var cmdMap = {
                get_offline_import_status: 'act.offline_import.status',
                choose_offline_import_file: 'act.offline_import.choose_file',
                import_offline_report: 'act.offline_import.import',
                load_history_report: 'act.history.load',
                toggle_offline_import: 'ui.menu_action'
            };
            var payload = offlinePayload(name, args || []);
            return window.bridge.cmd(cmdMap[name] || ('act.offline_import.' + name), payload).then(parseResult);
        }
        return Promise.resolve({ ok: false, message: 'Offline import API unavailable', errors: ['Offline import API unavailable'] });
    }
    function showToast(message) { toast.textContent = String(message || ''); toast.classList.add('visible'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove('visible'); }, 1800); }
    function previewHtml(result) {
        result = result || {};
        var pv = result.preview || {};
        if (!Object.keys(result).length) return '<div class="empty">尚未导入文件。<br/>WAITING FOR IMPORT</div>';
        return '<div class="preview"><h3>IMPORT RESULT</h3><div class="grid">'
            + '<div class="metric"><span>Encounter</span><strong>' + esc(pv.encounter_id || (result.report || {}).encounter_id || '-') + '</strong></div>'
            + '<div class="metric"><span>Format</span><strong>' + esc(result.format || '-') + '</strong></div>'
            + '<div class="metric"><span>Importer</span><strong>' + esc(result.importer || '-') + '</strong></div>'
            + '<div class="metric"><span>Total Damage</span><strong>' + esc(pv.total_damage || '-') + '</strong></div>'
            + '<div class="metric"><span>Events</span><strong>' + esc(result.event_count || 0) + '</strong></div>'
            + '<div class="metric"><span>Persisted</span><strong>' + esc(result.persisted ? 'YES' : 'NO') + '</strong></div>'
            + '</div></div>';
    }
    function renderHistory(history) {
        var rows = (history && history.encounters) || [];
        document.getElementById('sum-history').textContent = String(rows.length || 0);
        if (!rows.length) { historyList.innerHTML = '<div class="empty">暂无历史报告</div>'; return; }
        historyList.innerHTML = rows.slice(0, 12).map(function (item, i) {
            var index = item._history_index == null ? i : item._history_index;
            return '<div class="history-item"><strong>' + esc(item.encounter_id || ('#' + i)) + '</strong><small>'
                + esc(item.completed_local_time || item.completed_at || '') + ' · dmg=' + esc(item.total_damage || 0)
                + '</small><button type="button" onclick="OfflineImport.loadHistory(' + safeHistoryIndex(index, i) + ')">加载 Load</button></div>';
        }).join('');
    }
    function render(data) {
        data = data || {};
        var last = data.last_result || {};
        if (data.selected_file && !importPath.value) importPath.value = data.selected_file;
        document.getElementById('status-pill').textContent = data.ok === false ? 'ERROR' : String(data.status || 'READY').toUpperCase();
        document.getElementById('status-pill').style.color = data.ok === false ? 'var(--act-danger)' : 'var(--act-muted)';
        document.getElementById('sum-state').textContent = data.status || 'idle';
        document.getElementById('sum-format').textContent = last.format || '--';
        document.getElementById('sum-events').textContent = String(last.event_count || 0);
        preview.innerHTML = previewHtml(last);
        renderHistory(data.history || {});
        if (data.ok === false) showToast(data.message || 'Offline import status failed');
    }
    window.OfflineImport = {
        refresh: function () { return apiCall('get_offline_import_status', [20]).then(function (data) { render(data); return data; }); },
        choose: function () { return apiCall('choose_offline_import_file', []).then(function (payload) { if (payload.ok && payload.path) { importPath.value = payload.path; showToast('File selected'); } return payload; }); },
        importFile: function () {
            var path = String(importPath.value || '').trim();
            if (!path) { showToast('No import path'); return Promise.resolve({ ok: false, message: 'No import path' }); }
            return apiCall('import_offline_report', [path, true, true]).then(function (result) { showToast(result.message || (result.ok ? 'Imported' : 'Import failed')); return OfflineImport.refresh().then(function () { return result; }); });
        },
        loadHistory: function (index) { return apiCall('load_history_report', [safeHistoryIndex(index, 0), true]).then(function (result) { showToast(result.message || (result.ok ? 'Loaded' : 'Load failed')); return OfflineImport.refresh(); }); },
        close: function () { apiCall('toggle_offline_import'); },
        fadeIn: function () { shell.classList.add('visible'); },
        fadeOut: function () { shell.classList.remove('visible'); }
    };
    setTimeout(function () { shell.classList.add('visible'); OfflineImport.refresh(); }, 40);
})();
</script>
</body>
</html>
