<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAO ACT Action Log</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Panel-scoped tokens: LAYOUT/SIZING only. All COLORS come from the shared
   act_panel_theme.css var(--act-*) tokens so light/dark follow the host theme
   and stay 1:1 with the flat Tk Entity reference. Shell chrome (flat border,
   corner brackets, header, table, side, pill, toast) is owned by the shared
   theme via !important; here we only style custom group-card markup.
   ─────────────────────────────────────────────────────────────────────────── */
:root {
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --r-sm: 4px; --r-md: 6px;
    --fs-kicker: 10px; --fs-meta: 11px; --fs-body: 12px; --fs-title: 13px;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; user-select: none; }
.shell { opacity: 0; transform: translateY(10px) scale(.985); transition: opacity .22s ease, transform .22s ease; }
.shell.visible { opacity: 1; transform: translateY(0) scale(1); }
.header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.kicker { letter-spacing: .18em; font-size: var(--fs-kicker); color: var(--act-gold); }
.title { margin-top: 2px; font-size: 20px; font-weight: 700; letter-spacing: .08em; color: var(--act-text); }
.header-actions { display: flex; gap: var(--sp-2); align-items: center; }
.pill { min-width: 94px; text-align: center; padding: 5px 9px; font-size: var(--fs-body); }
input#query { width: 170px; }
.side input, .side select { width: 100%; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--sp-3); }
.main { min-height: 0; overflow: auto; }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-body); }
.table th, .table td { padding: 8px 9px; text-align: left; vertical-align: top; }
.table th { position: sticky; top: 0; z-index: 1; font-size: var(--fs-meta); letter-spacing: .08em; }
.table td { user-select: text; }
.group-card { position: relative; margin: 9px; border: 1px solid var(--act-edge-soft); border-radius: var(--r-md); overflow: hidden; background: var(--act-card-bg); }
.group-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--act-gold); z-index: 1; }
.group-head { width: 100%; border: 0; border-radius: 0; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; text-align: left; background: var(--act-card-bg-2); box-shadow: none; clip-path: none; }
.group-head:hover { transform: none; box-shadow: none; background: color-mix(in srgb, var(--act-gold) 10%, var(--act-card-bg-2)); }
.group-toggle { color: var(--act-gold); font-size: 16px; }
.group-title { min-width: 0; }
.group-name { color: var(--act-text); font-size: var(--fs-title); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-meta { margin-top: 3px; color: var(--act-muted); font-size: var(--fs-meta); font-weight: 400; }
.group-total { color: var(--act-gold); font-size: var(--fs-body); white-space: nowrap; }
.group-detail { display: none; border-top: 1px solid var(--act-edge-soft); padding: 6px 8px 10px; }
.group-card.open .group-detail { display: block; }
.detail-row { border: 1px solid var(--act-edge-soft); border-radius: var(--r-sm); padding: 7px 8px; margin-top: 6px; background: var(--act-card-bg); }
.detail-top { display: flex; flex-wrap: wrap; gap: 10px; color: var(--act-text); font-size: var(--fs-body); }
.detail-meta { margin-top: 4px; color: var(--act-muted); font-size: var(--fs-meta); line-height: 1.45; user-select: text; }
.topic { color: var(--act-gold); font-size: var(--fs-meta); letter-spacing: .08em; }
.payload { color: var(--act-muted); font-size: var(--fs-meta); line-height: 1.45; }
.side { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); }
.side-title { color: var(--act-gold); font-size: var(--fs-body); letter-spacing: .16em; }
.row { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 5px; font-size: var(--fs-body); }
.row strong { text-align: right; }
.pager { display: flex; gap: var(--sp-2); }
.pager button { flex: 1; }
.empty { display: grid; place-items: center; height: 100%; min-height: 260px; text-align: center; line-height: 1.6; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; border-radius: 999px; padding: 8px 14px; font-size: var(--fs-body); transition: opacity .16s ease, transform .16s ease; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--act-edge); border-radius: 999px; }
</style>
<link rel="stylesheet" href="act_panel_theme.css" />
<style>
/* Flat override (ACT panel only): kill shared decorative chrome + flatten per-page accents to a single 3px left rail. */
.shell,.panel,.plugin-shell{border:1px solid var(--act-edge)!important;border-radius:4px!important;background:var(--act-shell-bg)!important;box-shadow:none!important;}
.shell::before,.shell::after,.panel::before,.panel::after,.plugin-shell::before,.plugin-shell::after{display:none!important;content:none!important;}
.header,.plugin-header,header{background:var(--act-shell-bg-2)!important;border-bottom:1px solid var(--act-edge-soft)!important;}
button,input,select,.action-btn{clip-path:none!important;border-radius:3px!important;box-shadow:none!important;}
button:hover,.action-btn:hover{box-shadow:none!important;transform:none!important;background:var(--act-card-bg-2)!important;}
.main,.list,.plugin-list,.side,.side-panel,.section,.summary,.chart-wrap,.preview{box-shadow:none!important;}
.bar{background:var(--act-gold)!important;}.skill-row.heal .bar{background:var(--act-ok)!important;}
.pill,.badge,.status-pill{background:transparent!important;}
.aca-tile::before,.metric::before,.group-card::before{content:none!important;display:none!important;}
.aca-tile{border-left:3px solid var(--acc,var(--act-cyan))!important;}
.metric{border-left:3px solid var(--act-cyan)!important;}
.group-card{border-left:3px solid var(--act-gold)!important;}
.aca-fill{box-shadow:none!important;}
.aca-row.zebra{background:var(--act-card-bg-2)!important;}
.aca-badge,.aca-sec-badge{background:transparent!important;border-radius:3px!important;}
.group-head:hover{background:var(--act-card-bg-2)!important;}
.death td{box-shadow:none!important;background:transparent!important;border-left:3px solid var(--act-danger)!important;}
</style>
<script src="act_panel_theme.js"></script>
<script src="act_panel_util.js"></script>
</head>
<body>
<div class="shell" id="shell">
    <div class="header">
        <div><div class="kicker">ACT ACTION STREAM</div><div class="title">ACTION LOG</div></div>
        <div class="header-actions">
            <div class="pill" id="status-pill">READY</div>
            <input id="query" type="text" placeholder="搜索 / Search" />
            <select id="topic"><option value="">ALL</option><option value="damage">DAMAGE</option><option value="skill">SKILL</option><option value="boss">BOSS</option><option value="trigger">TRIGGER</option></select>
            <input id="cursor" type="number" min="0" value="0" title="jump to ms" />
            <button class="primary" type="button" onclick="ActionLog.refresh()">刷新</button>
            <button class="close" type="button" onclick="ActionLog.close()">×</button>
        </div>
    </div>
    <div class="body">
        <main class="main" id="rows"><div class="empty">正在读取 ACT 行为日志...<br/>LOADING ACTION LOG</div></main>
        <aside class="side">
            <div class="side-title">LOG CONTROL</div>
            <select id="source"><option value="live">LIVE EVENT BUS</option><option value="history">HISTORY SQLITE</option></select>
            <input id="encounter" type="text" placeholder="encounter id (optional)" />
            <button type="button" onclick="ActionLog.search()">搜索 Search</button>
            <button type="button" onclick="ActionLog.filter()">过滤 Filter</button>
            <button type="button" onclick="ActionLog.jump()">跳转 Jump</button>
            <button type="button" onclick="ActionLog.copy()">复制 Copy JSON</button>
            <div class="pager"><button type="button" onclick="ActionLog.prev()">上一页 Prev</button><button type="button" onclick="ActionLog.next()">下一页 Next</button></div>
            <div class="side-title">STATUS</div>
            <div class="row"><span>Encounter</span><strong id="sum-id">live</strong></div>
            <div class="row"><span>Rows</span><strong id="sum-rows">0</strong></div>
            <div class="row"><span>Total</span><strong id="sum-total">0</strong></div>
            <div class="row"><span>Page</span><strong id="sum-page">0/0</strong></div>
            <div class="row"><span>Top Topic</span><strong id="sum-topic">-</strong></div>
            <div class="row"><span>Cursor</span><strong id="sum-cursor">0ms</strong></div>
            <div class="row"><span>Filter</span><strong id="sum-filter">ALL</strong></div>
            <div class="row"><span>Errors</span><strong id="sum-errors">0</strong></div>
        </aside>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script>
(function () {
    "use strict";
    var shell = document.getElementById('shell');
    var rowsEl = document.getElementById('rows');
    var toast = document.getElementById('toast');
    var query = document.getElementById('query');
    var topic = document.getElementById('topic');
    var cursor = document.getElementById('cursor');
    var source = document.getElementById('source');
    var encounter = document.getElementById('encounter');
    var toastTimer = null;
    var searchTimer = null;
    var pageLimit = 80;
    var pageOffset = 0;
    var lastCursor = {};
    var expandedGroups = {};
    function esc(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function jsq(value) { return esc(String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'")); }
    function parseResult(result) { if (typeof result === 'string') { try { return JSON.parse(result); } catch (_) { return { ok: false, message: result }; } } return result || {}; }
    function finiteNumberArg(value, fallback) {
        var n = Number(value);
        if (!isFinite(n)) n = Number(fallback || 0);
        return isFinite(n) ? n : 0;
    }
    function nonNegIntArg(value, fallback) {
        return Math.max(0, Math.floor(finiteNumberArg(value, fallback || 0)));
    }
    function countText(value) {
        return String(nonNegIntArg(value, 0));
    }
    function valueText(value) {
        return String(finiteNumberArg(value, 0));
    }
    function firstCountText() {
        for (var i = 0; i < arguments.length; i += 1) {
            var value = arguments[i];
            if (value == null || value === '') continue;
            var n = Number(value);
            if (isFinite(n)) return countText(n);
        }
        return '0';
    }
    function positiveIntArg(value, fallback) {
        return Math.max(1, nonNegIntArg(value, fallback || 1));
    }
    function safePageOffset(value) {
        return nonNegIntArg(value, 0);
    }
    function safeCursorMs(value) {
        return nonNegIntArg(value, 0);
    }
    function listItems(value) {
        return Array.isArray(value) ? value : [];
    }
    function objectItems(value) {
        return listItems(value).filter(function (item) { return item && typeof item === 'object'; });
    }
    function actionLogPayload(name, args) {
        args = args || [];
        if (name === 'get_action_log_status') {
            return {
                limit: positiveIntArg(args[0], 80), query: String(args[1] || ''),
                topic: String(args[2] || ''), cursor_ms: safeCursorMs(args[3]),
                source: String(args[4] || 'live'), encounter_id: String(args[5] || ''),
                offset: safePageOffset(args[6])
            };
        }
        if (name === 'search_action_log') {
            return {
                query: String(args[0] || ''), limit: positiveIntArg(args[1], 80),
                source: String(args[2] || 'live'), encounter_id: String(args[3] || ''),
                offset: safePageOffset(args[4])
            };
        }
        if (name === 'filter_action_log') {
            return {
                topic: String(args[0] || ''), query: String(args[1] || ''),
                limit: positiveIntArg(args[2], 80), source: String(args[3] || 'live'),
                encounter_id: String(args[4] || ''), offset: safePageOffset(args[5])
            };
        }
        if (name === 'jump_action_log_time') {
            var jumpPayload = {
                cursor_ms: safeCursorMs(args[0]), limit: positiveIntArg(args[1], 80),
                source: String(args[2] || 'live'), encounter_id: String(args[3] || ''),
                offset: safePageOffset(args[4])
            };
            if (args.length > 5) jumpPayload.topic = String(args[5] || '');
            return jumpPayload;
        }
        if (name === 'copy_action_log') {
            return {
                limit: positiveIntArg(args[0], 80), query: String(args[1] || ''),
                topic: String(args[2] || ''), source: String(args[3] || 'live'),
                encounter_id: String(args[4] || ''), offset: safePageOffset(args[5])
            };
        }
        if (name === 'toggle_action_log') return { action: 'toggle_action_log' };
        return { args: args };
    }
    function apiCall(name, args) {
        var api = window.pywebview && window.pywebview.api;
        if (api && typeof api[name] === 'function') return Promise.resolve(api[name].apply(api, args || [])).then(parseResult);
        if (window.bridge && typeof window.bridge.cmd === 'function') {
            var cmdMap = {
                get_action_log_status: 'act.action_log.status', search_action_log: 'act.action_log.search', filter_action_log: 'act.action_log.filter',
                jump_action_log_time: 'act.action_log.jump_to_time', copy_action_log: 'act.action_log.copy', toggle_action_log: 'ui.menu_action'
            };
            var payload = actionLogPayload(name, args || []);
            return window.bridge.cmd(cmdMap[name] || ('act.action_log.' + name), payload).then(parseResult);
        }
        return Promise.resolve({ ok: false, message: 'Action log API unavailable', rows: [] });
    }
    function showToast(message) { toast.textContent = String(message || ''); toast.classList.add('visible'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove('visible'); }, 1800); }
    function detailRow(row) {
        row = row && typeof row === 'object' ? row : {};
        var payload = row.payload && typeof row.payload === 'object' ? row.payload : {};
        var uid = row.target_uid || payload.target_uuid || payload.target_uid || row.actor_uid || payload.actor_uid || '';
        var dungeon = row.dungeon || payload.dungeon_name || payload.dungeon_id || '';
        return '<div class="detail-row"><div class="detail-top"><strong>' + esc(ActTime.fmtClock(row.time_ms)) + '</strong><span>' + esc(row.topic || '-') + '</span><span>' + esc(row.label || '-') + '</span><span>' + esc(row.value || '') + '</span></div><div class="detail-meta">actor=' + esc(row.actor || '-') + ' · target=' + esc(row.target || '-') + ' · uid=' + esc(uid || '-') + ' · dungeon=' + esc(dungeon || '-') + ' · source=' + esc(row.source || '-') + '</div><div class="detail-meta">' + esc(JSON.stringify(payload)) + '</div></div>';
    }
    function renderGroups(groups) {
        groups = objectItems(groups);
        return groups.map(function (group) {
            var key = String(group.key || '');
            var open = !!expandedGroups[key];
            var rows = objectItems(group.rows);
            var meta = String(group.kind || 'event').toUpperCase() + ' · ' + countText(group.count) + ' rows · UID ' + countText(group.uid_count) + ' · ' + ActTime.fmtClock(group.first_time_ms) + ' · ' + ActTime.fmtDur((group.last_time_ms || 0) - (group.first_time_ms || 0));
            var dungeons = listItems(group.dungeons);
            if (dungeons.length) meta += ' · ' + String(dungeons.join('/'));
            return '<section class="group-card ' + (open ? 'open' : '') + '" data-group="' + esc(key) + '"><button class="group-head" type="button" onclick="ActionLog.toggleGroup(\'' + jsq(key) + '\')"><span class="group-toggle">' + (open ? '▾' : '▸') + '</span><span class="group-title"><div class="group-name">' + esc(group.name || '-') + '</div><div class="group-meta">' + esc(meta) + '</div></span><span class="group-total">' + esc(valueText(group.total_value)) + '</span></button><div class="group-detail">' + rows.map(detailRow).join('') + (group.has_more_rows ? '<div class="detail-meta">还有更多明细，请缩小筛选或翻页查看。</div>' : '') + '</div></section>';
        }).join('');
    }
    function setRowsHtml(html, preserveScroll) {
        var top = rowsEl.scrollTop || 0;
        var left = rowsEl.scrollLeft || 0;
        rowsEl.innerHTML = html;
        if (preserveScroll) {
            rowsEl.scrollTop = top;
            rowsEl.scrollLeft = left;
        }
    }
    function render(data, options) {
        data = data || {};
        options = options || {};
        var preserveScroll = options.preserveScroll !== false;
        var rows = objectItems(data.rows);
        var groups = objectItems(data.grouped_rows);
        var filters = data.filters || {};
        var cursorState = data.cursor || {};
        var analytics = data.analytics || {};
        var page = analytics.page || cursorState || {};
        var topicGroups = objectItems(analytics.groups && analytics.groups.topics);
        var errorCount = listItems(data.errors).length;
        pageOffset = safePageOffset(page.offset || cursorState.offset || pageOffset || 0);
        lastCursor = cursorState || {};
        document.getElementById('status-pill').textContent = data.ok === false ? 'ERROR' : 'READY';
        document.getElementById('status-pill').style.color = data.ok === false ? 'var(--act-danger)' : 'var(--act-muted)';
        document.getElementById('sum-id').textContent = data.encounter_id || data.source || 'live';
        document.getElementById('sum-rows').textContent = countText(rows.length);
        document.getElementById('sum-total').textContent = firstCountText(analytics.total_rows, page.total_rows, cursorState.total_row_count, rows.length);
        document.getElementById('sum-page').textContent = firstCountText(page.page_index, cursorState.page_index) + '/' + firstCountText(page.page_count, cursorState.page_count);
        document.getElementById('sum-topic').textContent = topicGroups.length ? (String(topicGroups[0].key || '-') + ' x' + countText(topicGroups[0].count)) : '-';
        document.getElementById('sum-cursor').textContent = ActTime.fmtClock(cursorState.time_ms);
        document.getElementById('sum-filter').textContent = (filters.source || data.source || 'live').toUpperCase() + ' · ' + (filters.topic || 'ALL') + (filters.query ? (' / ' + filters.query) : '');
        document.getElementById('sum-errors').textContent = String(errorCount);
        if (!rows.length) { setRowsHtml('<div class="empty">暂无 ACT 行为日志。<br/>live 模式等待事件；history 模式需要 SQLite actions。</div>', preserveScroll); return; }
        if (groups.length) { setRowsHtml(renderGroups(groups), preserveScroll); return; }
        setRowsHtml('<table class="table"><thead><tr><th>Time</th><th>Topic</th><th>Action</th><th>Value</th><th>Source</th><th>Payload</th></tr></thead><tbody>' + rows.map(function (row) {
            return '<tr class="' + (row.is_cursor ? 'cursor' : '') + '"><td>' + esc(ActTime.fmtClock(row.time_ms)) + '</td><td><span class="topic">' + esc(row.topic || '-') + '</span></td><td>' + esc(row.label || '-') + '</td><td>' + esc(row.value || '') + '</td><td>' + esc(row.source || '-') + '</td><td><div class="payload">actor=' + esc(row.actor || '-') + ' · target=' + esc(row.target || '-') + '</div></td></tr>';
        }).join('') + '</tbody></table>', preserveScroll);
    }
    window.ActionLog = {
        refresh: function (options) { options = options || {}; return apiCall('get_action_log_status', [pageLimit, query.value || '', topic.value || '', safeCursorMs(cursor.value), source.value || 'live', encounter.value || '', pageOffset]).then(function (data) { render(data, { preserveScroll: options.preserveScroll !== false }); if (data.ok === false) showToast(data.message || 'Action log failed'); return data; }); },
        search: function () { pageOffset = 0; return apiCall('search_action_log', [query.value || '', pageLimit, source.value || 'live', encounter.value || '', pageOffset]).then(function (data) { render(data, { preserveScroll: false }); return data; }); },
        filter: function () { pageOffset = 0; return apiCall('filter_action_log', [topic.value || '', query.value || '', pageLimit, source.value || 'live', encounter.value || '', pageOffset]).then(function (data) { render(data, { preserveScroll: false }); return data; }); },
        jump: function () { return apiCall('jump_action_log_time', [safeCursorMs(cursor.value), pageLimit, source.value || 'live', encounter.value || '', pageOffset, topic.value || '']).then(function (data) { render(data, { preserveScroll: false }); return data; }); },
        copy: function () { return apiCall('copy_action_log', [pageLimit, query.value || '', topic.value || '', source.value || 'live', encounter.value || '', pageOffset]).then(function (data) { if (data.text && navigator.clipboard) navigator.clipboard.writeText(data.text); render(data, { preserveScroll: true }); showToast('Action log copied'); return data; }); },
        prev: function () { pageOffset = safePageOffset(pageOffset - pageLimit); return ActionLog.refresh({ preserveScroll: false }); },
        next: function () { if (lastCursor && lastCursor.has_next === false) { showToast('No next page'); return Promise.resolve(lastCursor); } pageOffset = safePageOffset(pageOffset + pageLimit); return ActionLog.refresh({ preserveScroll: false }); },
        toggleGroup: function (key) { expandedGroups[String(key || '')] = !expandedGroups[String(key || '')]; return ActionLog.refresh(); },
        close: function () { apiCall('toggle_action_log'); },
        fadeIn: function () { shell.classList.add('visible'); },
        fadeOut: function () { shell.classList.remove('visible'); }
    };
    query.addEventListener('input', function () { clearTimeout(searchTimer); searchTimer = setTimeout(function () { ActionLog.search(); }, 220); });
    topic.addEventListener('change', function () { ActionLog.filter(); });
    source.addEventListener('change', function () { pageOffset = 0; ActionLog.refresh(); });
    encounter.addEventListener('change', function () { pageOffset = 0; ActionLog.refresh(); });
    setTimeout(function () { shell.classList.add('visible'); ActionLog.refresh(); }, 40);
})();
</script>
</body>
</html>
