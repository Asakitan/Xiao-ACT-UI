<!DOCTYPE html>
<!--
  linkstart.html — 1:1 WebGL2 port of Python sao_theme.SAOLinkStart
  (the ModernGL "LINK START" boot tunnel). Same GLSL shaders (330 → 300 es),
  same _animate phase dispatch, same _calc_bg ramp, same _gen_tunnel particle
  model, same cubic-bezier camera, same _build_vp_matrix projection.

  Browser-verifiable: open this file directly in Chrome/Edge to preview the
  full 9-second sequence without launching the app. The C# host (and the
  Python entity/webview modes) load this same page so the animation is
  identical across every UI mode.

  Phase timeline (matches sao_theme.py:3615-3626):
    prelude  -0.72 .. 0.0   shutter / scan ring / center bloom (gold)
    P1        0.0  .. 3.5    warm colour tunnel
    P2        3.5  .. 5.5    "WELCOME TO / 咲 ACT UI" text reveal
    P3        5.2  .. 7.5    cool blue tunnel (overlaps P2 fade by 0.3s)
    P4        7.3  .. 9.0    whiteout + SYSTEM>>CONNECTED
-->

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════
//  Constants — 1:1 with sao_theme.py:3604-3626
// ════════════════════════════════════════════════════════════════════
const NUM_PARTICLES = 300;
const TUNNEL_R_MIN  = 10.0;
const TUNNEL_R_MAX  = 38.0;
const STREAK_H      = 420.0;
const TUBE_RADIUS   = 1.8;
const CYL_SEGMENTS  = 10;
const FOCAL         = 720.0;
const CAM_Z_START   = -1200.0;
const CAM_Z_END     = 1500.0;
const CAM_DURATION  = 3.5;
const STARTUP_PRELUDE = 0.72;
const DURATION      = 9.0;
const P1_END        = 3.5;
const P2_START      = 3.5;
const P2_END        = 5.5;
const P3_START      = 5.2;
const P3_END        = 7.5;
const P4_START      = 7.3;

// 8-colour warm palette (P1) / cool palette (P3) — sao_theme.py:3580-3602
const WARM = ['#ff0000','#ffff00','#228b22','#222222','#808080','#00bfff','#9370db','#ff1493'];
const COOL = ['#0044cc','#0088ff','#00ccff','#002288','#88eeff','#0066dd','#aaeeff','#ffffff'];

function hexToRgb(hex) {
  const h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
}
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp(x,lo,hi){ return Math.max(lo, Math.min(hi, x)); }
function easeOut(t){ return 1-Math.pow(1-t,3); }

// _calc_bg — sao_theme.py:4641-4662
function calcBg(t) {
  const ramp = (c0,c1,f)=>{ const a=hexToRgb(c0),b=hexToRgb(c1); return [lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)]; };
  if (t < 0.12) return hexToRgb('#02040a');
  if (t < 0.72) return ramp('#02040a','#16213e',(t-0.12)/0.60);
  if (t < 3.0)  return hexToRgb('#16213e');
  if (t < 3.5)  return ramp('#16213e','#2a2a3a',(t-3.0)/0.5);
  if (t < 5.2)  return hexToRgb('#2a2a3a');
  if (t < 5.7)  return ramp('#2a2a3a','#0a1628',(t-5.2)/0.5);
  if (t < 7.0)  return hexToRgb('#0a1628');
  if (t < 7.5)  return ramp('#0a1628','#1a2a4a',(t-7.0)/0.5);
  return hexToRgb('#1a2a4a');
}

// _cubic_bezier_y — sao_theme.py:3920-3938 (25-iter bisection)
function cubicBezierY(tx, p1x, p1y, p2x, p2y) {
  let lo=0.0, hi=1.0;
  for (let i=0;i<25;i++){
    const mid=(lo+hi)*0.5, inv=1.0-mid;
    const x = 3*inv*inv*mid*p1x + 3*inv*mid*mid*p2x + mid*mid*mid;
    if (x < tx) lo=mid; else hi=mid;
  }
  const s=(lo+hi)*0.5, inv=1.0-s;
  return 3*inv*inv*s*p1y + 3*inv*s*s*p2y + s*s*s;
}
// _cam_z — sao_theme.py:3940-3944
function camZ(phaseElapsed, duration) {
  const t = clamp(phaseElapsed/duration, 0.0, 1.0);
  return CAM_Z_START + (CAM_Z_END - CAM_Z_START) * cubicBezierY(t, 0.8,0.1,0.9,0.8);
}

// _gen_tunnel — sao_theme.py:3889-3915
function genTunnel(palette) {
  const out = [];
  for (let i=0;i<NUM_PARTICLES;i++){
    const thetaDeg = Math.random()*360.0;
    const rad = thetaDeg*Math.PI/180.0;
    const r = lerp(TUNNEL_R_MIN, TUNNEL_R_MAX, Math.random());
    const d = lerp(-800.0, 1400.0, Math.random());
    const rgb = hexToRgb(palette[i % palette.length]);
    out.push({
      r, d, cos: Math.cos(rad), sin: Math.sin(rad), rgb,
      brightness: lerp(0.7,1.0,Math.random()),
      flicker:    lerp(3.0,8.0,Math.random()),
      widthMult:  lerp(0.8,1.4,Math.random()),
    });
  }
  return out;
}

// _build_vp_matrix — sao_theme.py:4156-4211. Returns column-major Float32Array(16).
function buildVP(camZval, sw, sh) {
  const near=1.0, far=10000.0, nf=near-far;
  const fx = FOCAL/(sw*0.5), fy = FOCAL/(sh*0.5);
  // M = proj @ view (mathematical), derived in closed form:
  //   M0=[fx,0,0,0]  M1=[0,fy,0,0]
  //   M2=[0,0, -(f+n)/nf, (f+n)/nf*camZ + 2fn/nf]
  //   M3=[0,0, 1, -camZ]
  const A = -(far+near)/nf;
  const B = (far+near)/nf*camZval + 2*far*near/nf;
  // column-major: data[col*4+row] = M[row][col]
  const m = new Float32Array(16);
  // row0
  m[0]=fx; m[4]=0;  m[8]=0;  m[12]=0;
  // row1
  m[1]=0;  m[5]=fy; m[9]=0;  m[13]=0;
  // row2
  m[2]=0;  m[6]=0;  m[10]=A; m[14]=B;
  // row3
  m[3]=0;  m[7]=0;  m[11]=1; m[15]=-camZval;
  return m;
}

// ════════════════════════════════════════════════════════════════════
//  GLSL — verbatim from sao_theme.py, adapted 330 → 300 es
// ════════════════════════════════════════════════════════════════════
const TUNNEL_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 in_pos;
layout(location=1) in vec3 in_norm;
layout(location=2) in vec3  i_center;
layout(location=3) in float i_len;
layout(location=4) in float i_radius;
layout(location=5) in vec3  i_color;
layout(location=6) in float i_alpha;
layout(location=7) in float i_fog;
uniform mat4  u_vp;
uniform float u_rot;
out vec3  v_world;
out vec3  v_normal;
out vec3  v_color;
out float v_alpha;
out float v_fog;
void main() {
  vec3 pos = in_pos;
  pos.xy *= i_radius;
  pos.z   = pos.z * i_len + i_center.z;
  pos.xy += i_center.xy;
  float cr = cos(u_rot), sr = sin(u_rot);
  vec2 rp  = vec2(pos.x*cr - pos.y*sr, pos.x*sr + pos.y*cr);
  pos.xy = rp;
  vec3 n  = in_norm;
  vec2 rn = vec2(n.x*cr - n.y*sr, n.x*sr + n.y*cr);
  n.xy = rn;
  v_world  = pos;
  v_normal = normalize(n);
  v_color  = i_color;
  v_alpha  = i_alpha;
  v_fog    = i_fog;
  gl_Position = u_vp * vec4(pos, 1.0);
}`;

const TUNNEL_FS = `#version 300 es
precision highp float;
in vec3  v_world;
in vec3  v_normal;
in vec3  v_color;
in float v_alpha;
in float v_fog;
uniform vec3 u_cam_pos;
uniform vec3 u_bg_color;
out vec4 fragColor;
void main() {
  vec3 N = normalize(v_normal);
  vec3 L = normalize(vec3(-v_world.xy, 0.0));
  vec3 V = normalize(u_cam_pos - v_world);
  vec3 H = normalize(L + V);
  float diff = max(dot(N, L), 0.0);
  float spec = pow(max(dot(N, H), 0.0), 48.0);
  float rim = 1.0 - max(dot(N, V), 0.0);
  rim = pow(rim, 2.5) * 0.45;
  vec3 ambient  = v_color * 0.20;
  vec3 diffuse  = v_color * diff * 0.55;
  vec3 specular = vec3(1.0) * spec * 0.65;
  vec3 emissive = v_color * 0.30;
  vec3 rim_c    = v_color * rim;
  vec3 lit = clamp(ambient + diffuse + specular + emissive + rim_c, 0.0, 1.0);
  float total_fade = v_alpha * (1.0 - v_fog);
  vec3 final_c = mix(u_bg_color, lit, total_fade);
  fragColor = vec4(final_c, 1.0);
}`;

const POST_VS = `#version 300 es
precision highp float;
void main() {
  vec2 pos[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
  gl_Position = vec4(pos[gl_VertexID], 0.0, 1.0);
}`;

const BG_FS = `#version 300 es
precision highp float;
uniform float u_time;
uniform float u_energy;
uniform float u_flash;
uniform float u_startburst;
uniform float u_startwave;
uniform float u_aspect;
uniform vec2  u_resolution;
uniform vec3  u_bg_color;
uniform vec3  u_tint;
out vec4 fragColor;
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  vec2 centered = uv - 0.5;
  vec2 lens = vec2(centered.x * u_aspect, centered.y);
  float radius = length(lens);
  float angle = atan(lens.y, lens.x);
  float energy = clamp(u_energy,0.0,1.0);
  float flash = clamp(u_flash,0.0,1.0);
  float startburst = clamp(u_startburst,0.0,1.0);
  float startwave = clamp(u_startwave,0.0,1.0);
  float apertureOpen = pow(smoothstep(0.02,0.42,startwave),0.78);
  float apertureFade = 1.0 - smoothstep(0.56,0.96,startwave);
  float slitX = mix(0.10,1.25,apertureOpen);
  float slitY = mix(0.008,0.56,apertureOpen);
  float ellipse = (lens.x/max(slitX,0.001));
  ellipse = ellipse*ellipse + (centered.y/max(slitY,0.001))*(centered.y/max(slitY,0.001));
  float apertureMask = 1.0 - smoothstep(0.90,1.10,ellipse);
  float shutterMask = (1.0-apertureMask)*apertureFade;
  float valveLine = exp(-abs(centered.y)*mix(300.0,56.0,apertureOpen));
  valveLine *= 1.0 - smoothstep(slitX*0.10, slitX*0.92, abs(lens.x));
  valveLine *= (0.08 + startburst*0.56 + (1.0-apertureFade)*0.10);
  float spokeCount = mix(16.0,28.0,energy);
  float angular = (angle/6.2831853 + 0.5)*spokeCount;
  float cell = floor(angular);
  float ray = abs(fract(angular + u_time*(0.18+energy*0.42)) - 0.5);
  float jitter = hash11(cell + floor(u_time*18.0))*0.22;
  float rayMask = smoothstep(0.22+jitter, 0.03+radius*0.08, ray);
  float rayFade = smoothstep(1.08,0.08,radius)*pow(max(0.0,1.0-radius),1.65);
  float rays = rayMask*rayFade*(0.08+energy*0.22);
  float core = smoothstep(0.16,0.0,radius);
  float halo = smoothstep(0.48,0.05,radius);
  float flare = exp(-abs(centered.y)*(96.0-energy*24.0));
  flare *= smoothstep(0.72,0.02,abs(centered.x));
  flare *= (0.05+flash*0.12+energy*0.08);
  float contract = smoothstep(0.0,0.18,startwave)*(1.0-smoothstep(0.18,0.36,startwave));
  float explode = smoothstep(0.18,0.44,startwave);
  float scan = smoothstep(0.38,0.78,startwave)*(1.0-smoothstep(0.78,1.0,startwave));
  float waveRadius = mix(0.010,0.64,explode);
  float waveWidth = mix(0.018,0.070,startburst);
  float shock = smoothstep(waveWidth,0.0,abs(radius-waveRadius));
  shock *= (1.0-smoothstep(0.70,1.0,startwave));
  float startupCore = smoothstep(0.24-contract*0.08,0.0,radius)*startburst;
  float startupFlare = exp(-abs(centered.y)*128.0)*smoothstep(0.82,0.0,abs(centered.x));
  startupFlare *= (0.10+startburst*0.42);
  float scanRing = smoothstep(0.015,0.0,abs(radius-mix(0.06,0.72,scan)));
  scanRing *= scan*0.65;
  float ripple = smoothstep(0.022,0.0,abs(radius-mix(0.05,0.56,explode)));
  ripple *= (1.0-smoothstep(0.52,0.92,startwave))*(0.18+startburst*0.34);
  vec3 col = u_bg_color;
  vec3 shutterCol = mix(vec3(0.005,0.010,0.018), u_bg_color*0.16, apertureOpen*0.34);
  col += u_tint*(core*(0.08+flash*0.12));
  col += u_tint*(halo*0.08 + rays + flare);
  col += vec3(1.0,0.94,0.82)*startupCore*(0.22+startburst*0.38);
  col += u_tint*shock*(0.16+startburst*0.34);
  col += vec3(0.92,0.98,1.0)*startupFlare;
  col += vec3(0.70,0.95,1.0)*scanRing;
  col += u_tint*ripple;
  col += vec3(1.0,0.97,0.88)*valveLine;
  col = mix(shutterCol, col, max(apertureMask*(0.22+apertureOpen*0.78), 1.0-apertureFade));
  col += vec3(0.86,0.96,1.0)*shutterMask*0.032;
  fragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;

const POST_FS = `#version 300 es
precision highp float;
uniform sampler2D u_cur;
uniform sampler2D u_prv;
uniform float u_ca;
uniform float u_fx_energy;
uniform float u_fx_flash;
uniform float u_aspect;
uniform vec3  u_fx_tint;
out vec4 fragColor;
void main() {
  ivec2 sz = textureSize(u_cur, 0);
  vec2 uv = gl_FragCoord.xy / vec2(sz);
  vec2 centered = uv - 0.5;
  vec2 lens = vec2(centered.x*u_aspect, centered.y);
  float radius = length(lens);
  vec2 dir = radius > 0.0001 ? lens/radius : vec2(0.0);
  float energy = clamp(u_fx_energy,0.0,1.0);
  float flash = clamp(u_fx_flash,0.0,1.0);
  float ca = u_ca*(1.0+energy*0.9+flash*0.8);
  vec2 smear = dir*(0.016*energy + 0.022*flash);
  vec2 squeeze = vec2(1.0+flash*0.015, 1.0-energy*0.010);
  vec2 zoomUv = centered*squeeze + 0.5;
  vec3 scene0 = texture(u_cur, clamp(zoomUv,0.0,1.0)).rgb;
  vec3 scene1 = texture(u_cur, clamp(zoomUv - smear*0.8,0.0,1.0)).rgb;
  vec3 scene2 = texture(u_cur, clamp(zoomUv - smear*1.8,0.0,1.0)).rgb;
  vec3 scene = scene0*0.46 + scene1*0.34 + scene2*0.20;
  float r = texture(u_cur, uv + vec2(ca,0.0)).r;
  float g = scene.g;
  float b = texture(u_cur, uv - vec2(ca,0.0)).b;
  vec3 prev = texture(u_prv, uv).rgb;
  vec3 result = mix(prev, vec3(r,g,b), 0.60);
  float centerGlow = pow(max(0.0,1.0-radius*1.85), 2.6);
  float streak = exp(-abs(centered.y)*(74.0-22.0*energy));
  streak *= smoothstep(0.52,0.0,abs(centered.x));
  float bloom = centerGlow*(0.035+energy*0.05+flash*0.05);
  float flare = streak*(energy*0.08+flash*0.12);
  vec3 fx = u_fx_tint*(bloom+flare);
  float vignette = smoothstep(1.22,0.18,radius);
  result += fx;
  result = mix(result, result + u_fx_tint*0.08, flash*centerGlow);
  result *= mix(0.92,1.04,vignette);
  fragColor = vec4(clamp(result,0.0,1.0), 1.0);
}`;

const COPY_FS = `#version 300 es
precision highp float;
uniform sampler2D u_tex;
uniform vec2 u_resolution;
out vec4 fragColor;
void main(){ fragColor = texture(u_tex, gl_FragCoord.xy/u_resolution); }`;

// ════════════════════════════════════════════════════════════════════
//  WebGL2 boilerplate
// ════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias:false, alpha:false, premultipliedAlpha:false });
if (!gl) { document.body.innerHTML = '<div style="color:#fff;font:20px sans-serif;padding:40px">WebGL2 not available</div>'; }

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error('shader compile:', gl.getShaderInfoLog(s), src);
    throw new Error('shader compile failed');
  }
  return s;
}
function link(vsSrc, fsSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error('program link:', gl.getProgramInfoLog(p));
    throw new Error('link failed');
  }
  return p;
}

const progTunnel = link(TUNNEL_VS, TUNNEL_FS);
const progBg     = link(POST_VS, BG_FS);
const progPost   = link(POST_VS, POST_FS);
const progCopy   = link(POST_VS, COPY_FS);

// uniform locations
const uTun = {
  vp: gl.getUniformLocation(progTunnel,'u_vp'),
  rot: gl.getUniformLocation(progTunnel,'u_rot'),
  cam: gl.getUniformLocation(progTunnel,'u_cam_pos'),
  bg: gl.getUniformLocation(progTunnel,'u_bg_color'),
};
const uBg = {
  time: gl.getUniformLocation(progBg,'u_time'),
  energy: gl.getUniformLocation(progBg,'u_energy'),
  flash: gl.getUniformLocation(progBg,'u_flash'),
  startburst: gl.getUniformLocation(progBg,'u_startburst'),
  startwave: gl.getUniformLocation(progBg,'u_startwave'),
  aspect: gl.getUniformLocation(progBg,'u_aspect'),
  res: gl.getUniformLocation(progBg,'u_resolution'),
  bg: gl.getUniformLocation(progBg,'u_bg_color'),
  tint: gl.getUniformLocation(progBg,'u_tint'),
};
const uPost = {
  cur: gl.getUniformLocation(progPost,'u_cur'),
  prv: gl.getUniformLocation(progPost,'u_prv'),
  ca: gl.getUniformLocation(progPost,'u_ca'),
  energy: gl.getUniformLocation(progPost,'u_fx_energy'),
  flash: gl.getUniformLocation(progPost,'u_fx_flash'),
  aspect: gl.getUniformLocation(progPost,'u_aspect'),
  tint: gl.getUniformLocation(progPost,'u_fx_tint'),
};
const uCopy = {
  tex: gl.getUniformLocation(progCopy,'u_tex'),
  res: gl.getUniformLocation(progCopy,'u_resolution'),
};

// ── unit cylinder mesh: 10 segs × 2 tris × 3 verts; vert = pos(3)+norm(3) ──
function buildCylinder() {
  const v = [];
  for (let i=0;i<CYL_SEGMENTS;i++){
    const a0 = 2*Math.PI*i/CYL_SEGMENTS, a1 = 2*Math.PI*(i+1)/CYL_SEGMENTS;
    const c0=Math.cos(a0), s0=Math.sin(a0), c1=Math.cos(a1), s1=Math.sin(a1);
    // tri 1: (a0,z0)(a1,z0)(a0,z1)  tri 2: (a1,z0)(a1,z1)(a0,z1)
    v.push(c0,s0,0, c0,s0,0,   c1,s1,0, c1,s1,0,   c0,s0,1, c0,s0,0);
    v.push(c1,s1,0, c1,s1,0,   c1,s1,1, c1,s1,0,   c0,s0,1, c0,s0,0);
  }
  return new Float32Array(v);
}
const cylData = buildCylinder();
const CYL_VERTS = cylData.length / 6;

const cylVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, cylVbo);
gl.bufferData(gl.ARRAY_BUFFER, cylData, gl.STATIC_DRAW);

const INST_STRIDE = 10; // center(3)+len(1)+radius(1)+color(3)+alpha(1)+fog(1)
const instScratch = new Float32Array(NUM_PARTICLES * INST_STRIDE);
const instVbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, instVbo);
gl.bufferData(gl.ARRAY_BUFFER, instScratch.byteLength, gl.DYNAMIC_DRAW);

const tunnelVao = gl.createVertexArray();
gl.bindVertexArray(tunnelVao);
gl.bindBuffer(gl.ARRAY_BUFFER, cylVbo);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,24,0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,24,12);
gl.bindBuffer(gl.ARRAY_BUFFER, instVbo);
const FB = 4, ST = INST_STRIDE*FB;
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,ST,0);  gl.vertexAttribDivisor(2,1);
gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,ST,12); gl.vertexAttribDivisor(3,1);
gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4,1,gl.FLOAT,false,ST,16); gl.vertexAttribDivisor(4,1);
gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5,3,gl.FLOAT,false,ST,20); gl.vertexAttribDivisor(5,1);
gl.enableVertexAttribArray(6); gl.vertexAttribPointer(6,1,gl.FLOAT,false,ST,32); gl.vertexAttribDivisor(6,1);
gl.enableVertexAttribArray(7); gl.vertexAttribPointer(7,1,gl.FLOAT,false,ST,36); gl.vertexAttribDivisor(7,1);
gl.bindVertexArray(null);

const emptyVao = gl.createVertexArray();

// ── FBOs: scene (color+depth) + 2 ping-pong (color only) ──
let sceneFbo, sceneTex, sceneDepth, pingFbo=[null,null], pingTex=[null,null], fboW=0, fboH=0;
function makeColorTex(w,h){
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return t;
}
function allocFbos(w,h){
  fboW=w; fboH=h;
  sceneTex=makeColorTex(w,h);
  sceneDepth=gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER,sceneDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
  sceneFbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,sceneFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,sceneTex,0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,sceneDepth);
  for (let i=0;i<2;i++){
    pingTex[i]=makeColorTex(w,h);
    pingFbo[i]=gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER,pingFbo[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,pingTex[i],0);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 1.5);
  const w = Math.max(2, Math.floor(window.innerWidth*dpr));
  const h = Math.max(2, Math.floor(window.innerHeight*dpr));
  canvas.width=w; canvas.height=h;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
  if (w!==fboW || h!==fboH) allocFbos(w,h);
}
window.addEventListener('resize', resize);
resize();

// ════════════════════════════════════════════════════════════════════
//  Per-frame particle instance build — 1:1 with _draw_tunnel_gl:4293-4346
// ════════════════════════════════════════════════════════════════════
function writeInstances(particles, camZval, fade, t) {
  let n=0;
  for (let k=0;k<particles.length;k++){
    const p=particles[k];
    const zNear = p.d - camZval;
    const zFar  = (p.d + STREAK_H) - camZval;
    if (zFar <= 0.5) continue;
    if (zNear > 5000) continue;
    const shimmer = 0.85 + 0.15*Math.sin(t*p.flicker + p.d*0.005);
    let alpha = fade * p.brightness * shimmer;
    if (alpha < 0.02) continue;
    let fog = 0.0;
    if (zNear > 150) fog = Math.min(0.95, (zNear-150)/2200.0);
    const o = n*INST_STRIDE;
    instScratch[o+0]=p.r*p.cos; instScratch[o+1]=p.r*p.sin; instScratch[o+2]=p.d;
    instScratch[o+3]=STREAK_H;
    instScratch[o+4]=TUBE_RADIUS*p.widthMult;
    instScratch[o+5]=p.rgb[0]; instScratch[o+6]=p.rgb[1]; instScratch[o+7]=p.rgb[2];
    instScratch[o+8]=alpha; instScratch[o+9]=fog;
    n++;
  }
  return n;
}

// ════════════════════════════════════════════════════════════════════
//  _animate phase dispatch — 1:1 with sao_theme.py:4516-4636
// ════════════════════════════════════════════════════════════════════
const warmParticles = genTunnel(WARM);
const coolParticles = genTunnel(COOL);
const textLayer = document.getElementById('text-layer');
const connectedLayer = document.getElementById('connected-layer');
let startTime = null;
let pingFrame = 0;

function renderTunnel(particles, camZval, fade, t, bg, fx) {
  const n = writeInstances(particles, camZval, fade, t);

  // scene FBO
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFbo);
  gl.viewport(0,0,fboW,fboH);
  gl.clearColor(bg[0],bg[1],bg[2],1.0);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  // background pass (depth off)
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progBg);
  gl.uniform1f(uBg.time,t); gl.uniform1f(uBg.energy,fx.energy); gl.uniform1f(uBg.flash,fx.flash);
  gl.uniform1f(uBg.startburst,fx.startburst); gl.uniform1f(uBg.startwave,fx.startwave);
  gl.uniform1f(uBg.aspect, fboW/fboH); gl.uniform2f(uBg.res,fboW,fboH);
  gl.uniform3f(uBg.bg,bg[0],bg[1],bg[2]); gl.uniform3f(uBg.tint,fx.tint[0],fx.tint[1],fx.tint[2]);
  gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES,0,3);

  // tunnel pass (depth on, instanced)
  if (n>0) {
    gl.bindBuffer(gl.ARRAY_BUFFER, instVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, instScratch.subarray(0, n*INST_STRIDE));
    gl.enable(gl.DEPTH_TEST);
    gl.useProgram(progTunnel);
    gl.uniformMatrix4fv(uTun.vp, false, buildVP(camZval, fboW, fboH));
    gl.uniform1f(uTun.rot, t*0.06);
    gl.uniform3f(uTun.cam, 0,0,camZval);
    gl.uniform3f(uTun.bg, bg[0],bg[1],bg[2]);
    gl.bindVertexArray(tunnelVao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, CYL_VERTS, n);
  }

  // post-process ping-pong
  const wi = (pingFrame & 1)===0 ? 0 : 1;
  const pi = (pingFrame & 1)===0 ? 1 : 0;
  gl.bindFramebuffer(gl.FRAMEBUFFER, pingFbo[wi]);
  gl.viewport(0,0,fboW,fboH);
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(progPost);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(uPost.cur,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, pingTex[pi]); gl.uniform1i(uPost.prv,1);
  gl.uniform1f(uPost.ca, 2.0/fboW);
  gl.uniform1f(uPost.energy,fx.energy); gl.uniform1f(uPost.flash,fx.flash);
  gl.uniform1f(uPost.aspect, fboW/fboH); gl.uniform3f(uPost.tint,fx.tint[0],fx.tint[1],fx.tint[2]);
  gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES,0,3);
  pingFrame++;

  // blit ping result to canvas
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,fboW,fboH);
  gl.useProgram(progCopy);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pingTex[wi]); gl.uniform1i(uCopy.tex,0);
  gl.uniform2f(uCopy.res, fboW, fboH);
  gl.bindVertexArray(emptyVao); gl.drawArrays(gl.TRIANGLES,0,3);
}

function clearCanvas(bg) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,fboW,fboH);
  gl.clearColor(bg[0],bg[1],bg[2],1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
}

// P2 text-phase state — flyin 3.5-4.2, hold 4.2-4.7, flyout 4.7-5.25, fade→5.5
function updateText(sceneT) {
  let op=0, scale=0.2;
  if (sceneT>=P2_START-0.2 && sceneT<P2_END+0.3) {
    if (sceneT < 4.2) { const f=clamp((sceneT-3.5)/0.7,0,1); op=f; scale=lerp(0.2,1.0,easeOut(f)); }
    else if (sceneT < 4.7) { op=1; scale=1.0; }
    else if (sceneT < 5.25) { const f=clamp((sceneT-4.7)/0.55,0,1); op=1.0-f*0.4; scale=lerp(1.0,1.25,f); }
    else { const f=clamp((sceneT-5.25)/0.25,0,1); op=(1.0-f)*0.6; scale=1.25; }
  }
  textLayer.style.opacity = op.toFixed(3);
  textLayer.style.transform = 'scale('+scale.toFixed(3)+')';
}

// P4 connected overlay 7.3-8.5
function updateConnected(sceneT) {
  let op=0;
  if (sceneT>=P4_START) {
    if (sceneT < 7.7) op=clamp((sceneT-7.3)/0.4,0,1);
    else if (sceneT < 8.3) op=1;
    else op=Math.max(0, 1.0-(sceneT-8.3)/0.5);
  }
  connectedLayer.style.opacity = op.toFixed(3);
}

let finished = false;
function frame(now) {
  if (startTime===null) startTime = now;
  const elapsed = (now - startTime)/1000.0;
  const sceneT = elapsed - STARTUP_PRELUDE;

  if (sceneT > DURATION) {
    if (!finished) { finished=true; onFinish(); }
    return;
  }

  const bg = calcBg(Math.max(0.0, sceneT));

  if (sceneT < 0.0) {
    // ── prelude ──
    const su = Math.max(0.0, elapsed);
    const fx = {
      energy: Math.min(1.0, su/STARTUP_PRELUDE)*0.18,
      flash: Math.max(0,1.0-su/STARTUP_PRELUDE)*0.42 + Math.max(0,1.0-su/0.52)*0.30,
      startburst: Math.max(0,1.0-su/0.52),
      startwave: Math.min(1.0, su/STARTUP_PRELUDE),
      tint: [0.96,0.78,0.24],
    };
    // background-only pass: render with no particles
    renderTunnel([], 0, 0, elapsed, bg, fx);
  } else if (sceneT < P1_END + 0.5) {
    // ── P1 warm tunnel ──
    let pf = 1.0;
    if (sceneT < 0.28) pf = lerp(0.22,0.62, easeOut(sceneT/0.28));
    else if (sceneT < 1.0) pf = lerp(0.62,1.0, easeOut((sceneT-0.28)/0.72));
    if (sceneT > P1_END) pf = Math.max(0, 1.0-(sceneT-P1_END)/0.5);
    const cz = camZ(sceneT, CAM_DURATION);
    const bridge = Math.min(STARTUP_PRELUDE+0.64, elapsed);
    const sb = Math.max(0,1.0-bridge/1.06);
    const sw = Math.min(1.0, bridge/(STARTUP_PRELUDE+0.64));
    const fx = {
      energy: Math.min(1.0, pf*(0.20+0.88*Math.min(1.0,sceneT/CAM_DURATION)) + sb*0.28),
      flash: Math.max(0,1.0-bridge/1.08)*0.30 + sb*0.28,
      startburst: sb, startwave: sw, tint: [0.96,0.78,0.24],
    };
    renderTunnel(warmParticles, cz, pf, sceneT, bg, fx);
  } else if (sceneT >= P3_START && sceneT < P3_END + 0.3) {
    // ── P3 cool tunnel ──
    let p3f = 1.0;
    if (sceneT < P3_START+0.5) p3f = (sceneT-P3_START)/0.5;
    if (sceneT > P3_END) p3f = Math.max(0, 1.0-(sceneT-P3_END)/0.3);
    const p3t = sceneT-P3_START, p3d = P3_END-P3_START;
    const cz = camZ(p3t, p3d);
    const fx = {
      energy: p3f*(0.20+0.80*Math.min(1.0,p3t/p3d)),
      flash: Math.max(0,1.0-p3t/0.70)*0.18,
      startburst: 0.0, startwave: 1.0, tint: [0.45,0.80,1.00],
    };
    renderTunnel(coolParticles, cz, p3f, sceneT, bg, fx);
  } else {
    // gap between phases / P4 base — just paint background
    clearCanvas(bg);
  }

  updateText(sceneT);
  updateConnected(sceneT);
  requestAnimationFrame(frame);
}

// ════════════════════════════════════════════════════════════════════
//  Completion hook — host listens via window.bridge or a custom event
// ════════════════════════════════════════════════════════════════════
function onFinish() {
  document.body.style.transition = 'opacity 0.4s ease';
  document.body.style.opacity = '0';
  // 1) pywebview/WebView2-style bridge if present
  try { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('linkstart_done'); } catch(e){}
  try { if (window.bridge && window.bridge.notify) window.bridge.notify('linkstart_done'); } catch(e){}
  // 2) DOM event for any embedder
  try { window.dispatchEvent(new CustomEvent('linkstart-done')); } catch(e){}
  // 3) standalone preview: log + leave faded
  try { console.log('[LinkStart] sequence complete'); } catch(e){}
}

// Allow click / Esc to skip in standalone preview
window.addEventListener('keydown', e=>{ if (e.key==='Escape' && !finished){ finished=true; onFinish(); } });

requestAnimationFrame(frame);
</script>
</body>
</html>
