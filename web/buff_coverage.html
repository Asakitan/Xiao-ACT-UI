<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SAO Buff Coverage</title>
<style>
  /* dark (默认) — 与 Tk _BuffPanelBase._PALETTES['dark'] 1:1 */
  :root {
    --cyan: #46e0d8;
    --cyan-deep: #2bb7c8;
    --gold: #ffcf5a;
    --ink: #e8f0f4;
    --ink-dim: #9fb3bf;
    --bg: rgba(16, 22, 28, 0.82);
    --row: rgba(34, 46, 56, 0.66);
    --row-urgent: rgba(120, 54, 40, 0.78);
    --edge: rgba(70, 224, 216, 0.30);
    --row-edge: rgba(70, 224, 216, 0.14);
    --urgent-sec: #ff8a6a;
  }
  /* light — 与 Tk _PALETTES['light'] (cream hi-tech) 1:1 */
  html.theme-light {
    --cyan: #16a9d6;
    --cyan-deep: #3282aa;
    --gold: #dea620;
    --ink: #5a5c64;
    --ink-dim: #8c878a;
    --bg: rgba(248, 250, 251, 0.94);
    --row: rgba(248, 247, 244, 0.78);
    --row-urgent: rgba(244, 168, 152, 0.90);
    --edge: rgba(128, 190, 220, 0.85);
    --row-edge: rgba(156, 178, 194, 0.66);
    --urgent-sec: #8c1e14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    user-select: none; cursor: default;
  }
  #panel {
    position: absolute; left: 6px; right: 6px; bottom: 6px;
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 8px 9px 9px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
    opacity: 0; transform: translateY(8px);
    transition: opacity .22s ease, transform .22s ease;
  }
  html.theme-light #panel { box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18); }
  #panel.show { opacity: 1; transform: translateY(0); }
  .hd {
    display: flex; align-items: baseline; gap: 7px;
    margin-bottom: 6px; padding-left: 2px;
  }
  .hd .t { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--cyan); }
  .hd .k { font-size: 10px; color: var(--ink-dim); }
  .hd .e { margin-left: auto; font-size: 10px; color: var(--ink-dim); }
  .row {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    height: 26px; margin-top: 4px; padding: 0 9px;
    background: var(--row);
    border: 1px solid var(--row-edge);
    border-radius: 6px;
    overflow: hidden;
  }
  .row.urgent { background: var(--row-urgent); border-color: rgba(255, 120, 90, 0.5); }
  .row .cov {
    position: absolute; left: 0; bottom: 0; height: 2px;
    background: var(--cyan-deep); border-radius: 0 2px 2px 0;
  }
  .row.full .cov { background: var(--gold); }
  .row .nm {
    flex: 1 1 auto; min-width: 0;
    font-size: 12px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .nm .lyr { color: var(--gold); font-size: 11px; }
  .row .pct { flex: 0 0 auto; font-size: 11px; font-weight: 700; color: var(--cyan); width: 34px; text-align: right; }
  .row .trg { flex: 0 0 auto; font-size: 10px; color: var(--ink-dim); width: 26px; text-align: right; }
  .row .sec { flex: 0 0 auto; font-size: 12px; font-weight: 700; color: var(--gold); width: 42px; text-align: right; }
  .row.urgent .sec { color: var(--urgent-sec); }
  .row .sec.perm { color: var(--ink-dim); font-weight: 400; }
  #empty { font-size: 11px; color: var(--ink-dim); text-align: center; padding: 6px 0; }
</style>
</head>
<body>
  <div id="panel">
    <div class="hd"><span class="t">AURA</span><span class="k">幻想技能覆盖率</span><span class="e" id="elapsed"></span></div>
    <div id="rows"></div>
  </div>
<script>
(function () {
  var panel = document.getElementById('panel');
  var rowsEl = document.getElementById('rows');
  var elapsedEl = document.getElementById('elapsed');

  function finiteNum(v, fallback) {
    if (v == null || v === '') return fallback;
    var n = Number(v);
    if (!isFinite(n)) n = Number(fallback || 0);
    return isFinite(n) ? n : 0;
  }
  function nonNegNum(v, fallback) {
    return Math.max(0, finiteNum(v, fallback));
  }
  function pct01(v) {
    return Math.max(0, Math.min(1, finiteNum(v, 0)));
  }
  function isObjectValue(v) {
    return v && typeof v === 'object' && !Array.isArray(v);
  }
  function objectValue(v) {
    return isObjectValue(v) ? v : {};
  }
  function objectItems(v) {
    return (Array.isArray(v) ? v : []).filter(isObjectValue);
  }
  function fmtSec(s) {
    if (s == null) return '∞';
    s = finiteNum(s, -1);
    if (s == null || s < 0) return '∞';
    if (s >= 60) return Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2);
    return s.toFixed(s < 10 ? 1 : 0) + 's';
  }
  function fmtElapsed(ms) {
    var s = Math.floor(nonNegNum(ms, 0) / 1000);
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  // data = { elapsed_ms, buffs: [{id,name,uptime_pct,apply_count,layer,max_layer,active,rem_s}] }
  window.updateBuffCoverage = function (data) {
    data = objectValue(data);
    var buffs = objectItems(data.buffs);
    if (!buffs.length) { panel.classList.remove('show'); return; }
    panel.classList.add('show');
    elapsedEl.textContent = fmtElapsed(data.elapsed_ms);

    var html = '';
    for (var i = 0; i < buffs.length && i < 10; i++) {
      var b = objectValue(buffs[i]);
      var pct = pct01(b.uptime_pct);
      var pctTxt = Math.round(pct * 100) + '%';
      var rem = (b.rem_s == null) ? -1 : finiteNum(b.rem_s, -1);
      var urgent = rem >= 0 && rem <= 3;
      var full = pct >= 0.85;
      var layer = Math.floor(nonNegNum(b.layer, 0));
      var applyCount = Math.floor(nonNegNum(b.apply_count, 0));
      var lyr = layer > 1 ? '<span class="lyr"> ×' + layer + '</span>' : '';
      var trg = applyCount > 1 ? ('·' + applyCount) : '';
      var nm = (b.name || ('#' + b.id));
      html += '<div class="row' + (urgent ? ' urgent' : '') + (full ? ' full' : '') + '">'
        + '<div class="cov" style="width:' + (pct * 100).toFixed(1) + '%"></div>'
        + '<span class="nm">' + escapeHtml(nm) + lyr + '</span>'
        + '<span class="pct">' + pctTxt + '</span>'
        + '<span class="trg">' + trg + '</span>'
        + '<span class="sec' + (rem < 0 ? ' perm' : '') + '">' + fmtSec(rem) + '</span>'
        + '</div>';
    }
    rowsEl.innerHTML = html;
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 主题: 宿主 set_panel_theme('buffmon') 推送 + 启动时从 api 拉初始值,
  // light/dark 变量与 Tk _BuffPanelBase._PALETTES 1:1。
  window._applyPanelTheme = function (theme) {
    document.documentElement.classList.toggle(
      'theme-light', String(theme || '').toLowerCase() === 'light');
  };
  function initTheme() {
    try {
      var api = window.pywebview && window.pywebview.api;
      if (api && api.get_panel_themes) {
        Promise.resolve(api.get_panel_themes()).then(function (themes) {
          themes = objectValue(typeof themes === 'string' ? JSON.parse(themes) : themes);
          window._applyPanelTheme(themes.buffmon || 'dark');
        }).catch(function () {});
      }
    } catch (_) {}
  }
  window.addEventListener('pywebviewready', initTheme);
  setTimeout(initTheme, 400);
})();
</script>
</body>
</html>
