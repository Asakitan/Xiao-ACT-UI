<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAO ACT Death Recap</title>
<style>
:root {
    --bg: rgba(8, 13, 22, .78);
    --line: rgba(117, 205, 255, .48);
    --gold: rgba(255, 214, 117, .88);
    --text: rgba(232, 246, 255, .96);
    --muted: rgba(176, 204, 226, .76);
    --bad: #ff6b82;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; background: transparent; color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; user-select: none; }
body { padding: 14px; }
.shell { width: 100%; height: calc(100vh - 28px); min-height: 450px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: linear-gradient(180deg, rgba(17, 31, 48, .96), rgba(7, 12, 20, .92)); box-shadow: 0 0 34px rgba(88, 199, 255, .22), inset 0 0 28px rgba(109, 216, 255, .10); opacity: 0; transform: translateY(10px) scale(.985); transition: opacity .22s ease, transform .22s ease; }
.shell.visible { opacity: 1; transform: translateY(0) scale(1); }
.header { height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px 8px 18px; border-bottom: 1px solid rgba(117, 205, 255, .35); background: linear-gradient(90deg, rgba(46, 24, 38, .78), rgba(11, 22, 35, .58)); }
.kicker { letter-spacing: .18em; font-size: 10px; color: var(--gold); }
.title { margin-top: 2px; font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.actions { display: flex; gap: 8px; align-items: center; }
button, input { border: 1px solid rgba(117, 205, 255, .48); background: linear-gradient(180deg, rgba(61, 143, 201, .38), rgba(19, 48, 74, .58)); color: var(--text); border-radius: 8px; padding: 7px 11px; font-size: 12px; font-weight: 600; }
input { width: 116px; background: rgba(4, 8, 14, .58); font-weight: 400; }
button { cursor: pointer; }
button:hover { box-shadow: 0 0 16px rgba(107, 214, 255, .25); transform: translateY(-1px); }
button.primary { border-color: rgba(255, 214, 117, .74); color: #fff8da; }
button.close { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 16px; }
.body { display: grid; grid-template-columns: minmax(0, 1fr) 292px; gap: 12px; height: calc(100% - 62px); padding: 12px; }
.main { min-height: 0; overflow: auto; border: 1px solid rgba(117, 205, 255, .24); border-radius: 10px; background: rgba(8, 14, 22, .42); }
.table { width: 100%; border-collapse: collapse; font-size: 12px; }
.table th, .table td { padding: 8px 9px; border-bottom: 1px solid rgba(117, 205, 255, .14); text-align: left; vertical-align: top; }
.table th { position: sticky; top: 0; z-index: 1; background: rgba(31, 22, 35, .96); color: var(--gold); font-size: 11px; letter-spacing: .08em; }
.death td { background: rgba(255, 107, 130, .12); box-shadow: inset 3px 0 0 var(--bad); }
.kind { color: var(--gold); font-size: 11px; letter-spacing: .08em; }
.payload { color: var(--muted); font-size: 11px; line-height: 1.45; user-select: text; }
.side { min-height: 0; border: 1px solid rgba(117, 205, 255, .30); border-radius: 10px; background: rgba(8, 14, 22, .52); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.side-title { color: var(--gold); font-size: 12px; letter-spacing: .16em; }
.row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(117, 205, 255, .16); padding-bottom: 5px; font-size: 12px; color: var(--muted); }
.row strong { color: var(--text); text-align: right; }
.empty { display: grid; place-items: center; height: 100%; min-height: 260px; color: var(--muted); text-align: center; line-height: 1.6; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; border: 1px solid rgba(255, 214, 117, .58); background: rgba(8, 14, 22, .88); color: #fff7d2; border-radius: 999px; padding: 8px 14px; font-size: 12px; transition: opacity .16s ease, transform .16s ease; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell" id="shell">
    <div class="header">
        <div><div class="kicker">ACT DEATH WINDOW</div><div class="title">DEATH RECAP</div></div>
        <div class="actions">
            <input id="entity" type="text" placeholder="entity id" />
            <input id="window" type="number" min="1" value="8" title="window seconds" />
            <button class="primary" type="button" onclick="DeathRecap.refresh()">刷新</button>
            <button class="close" type="button" onclick="DeathRecap.close()">×</button>
        </div>
    </div>
    <div class="body">
        <main class="main" id="rows"><div class="empty">正在读取死亡回放...<br/>LOADING DEATH RECAP</div></main>
        <aside class="side">
            <div class="side-title">SUMMARY</div>
            <button type="button" onclick="DeathRecap.copy()">复制 Copy JSON</button>
            <div class="row"><span>Death</span><strong id="sum-death">-</strong></div>
            <div class="row"><span>Incoming</span><strong id="sum-damage">0</strong></div>
            <div class="row"><span>Healing</span><strong id="sum-heal">0</strong></div>
            <div class="row"><span>Shield</span><strong id="sum-shield">0</strong></div>
            <div class="row"><span>Rows</span><strong id="sum-rows">0</strong></div>
            <div class="row"><span>Window</span><strong id="sum-window">0ms</strong></div>
            <div class="row"><span>Errors</span><strong id="sum-errors">0</strong></div>
        </aside>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script>
(function () {
    "use strict";
    var shell = document.getElementById('shell');
    var rowsEl = document.getElementById('rows');
    var toast = document.getElementById('toast');
    var entity = document.getElementById('entity');
    var windowInput = document.getElementById('window');
    var toastTimer = null;
    function esc(value) { return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function parseResult(result) { if (typeof result === 'string') { try { return JSON.parse(result); } catch (_) { return { ok: false, message: result }; } } return result || {}; }
    function apiCall(name, args) {
        var api = window.pywebview && window.pywebview.api;
        if (api && typeof api[name] === 'function') return Promise.resolve(api[name].apply(api, args || [])).then(parseResult);
        if (window.bridge && typeof window.bridge.cmd === 'function') {
            var map = { get_death_recap_status: 'act.death_recap.status', copy_death_recap: 'act.death_recap.copy', toggle_death_recap: 'ui.menu_action' };
            var payload = name === 'toggle_death_recap' ? { action: 'toggle_death_recap' } : { args: args || [] };
            return window.bridge.cmd(map[name] || name, payload).then(parseResult);
        }
        return Promise.resolve({ ok: false, message: 'Death recap API unavailable', rows: [], summary: {} });
    }
    function showToast(message) { toast.textContent = String(message || ''); toast.classList.add('visible'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { toast.classList.remove('visible'); }, 1800); }
    function render(data) {
        data = data || {};
        var rows = data.rows || [];
        var summary = data.summary || {};
        var death = data.death || {};
        var win = data.window || {};
        document.getElementById('sum-death').textContent = death.name || death.entity_id || '-';
        document.getElementById('sum-damage').textContent = String(summary.incoming_damage || 0);
        document.getElementById('sum-heal').textContent = String(summary.healing || 0);
        document.getElementById('sum-shield').textContent = String(summary.shield || 0);
        document.getElementById('sum-rows').textContent = String(rows.length || 0);
        document.getElementById('sum-window').textContent = String(win.before_ms || 0) + 'ms';
        document.getElementById('sum-errors').textContent = String((data.errors || []).length);
        if (!rows.length) { rowsEl.innerHTML = '<div class="empty">暂无死亡回放。<br/>等待 death/is_dead/hp=0 事件。</div>'; return; }
        rowsEl.innerHTML = '<table class="table"><thead><tr><th>Delta</th><th>Kind</th><th>Actor</th><th>Target</th><th>Amount</th><th>Detail</th></tr></thead><tbody>' + rows.map(function (row) {
            return '<tr class="' + (row.is_death ? 'death' : '') + '"><td>' + esc((row.relative_ms || 0) + 'ms') + '</td><td><span class="kind">' + esc(row.kind || row.topic || '-') + '</span></td><td>' + esc(row.actor || '-') + '</td><td>' + esc(row.target || '-') + '</td><td>' + esc(row.amount || '') + '</td><td><div class="payload">' + esc(row.label || '') + '</div></td></tr>';
        }).join('') + '</tbody></table>';
    }
    window.DeathRecap = {
        refresh: function () { return apiCall('get_death_recap_status', [80, Number(windowInput.value || 8), entity.value || null]).then(function (data) { render(data); if (data.ok === false) showToast(data.message || 'Death recap failed'); return data; }); },
        copy: function () { return apiCall('copy_death_recap', [80, Number(windowInput.value || 8), entity.value || null]).then(function (data) { if (data.text && navigator.clipboard) navigator.clipboard.writeText(data.text); render(data); showToast('Death recap copied'); return data; }); },
        close: function () { apiCall('toggle_death_recap'); },
        fadeIn: function () { shell.classList.add('visible'); },
        fadeOut: function () { shell.classList.remove('visible'); }
    };
    entity.addEventListener('change', function () { DeathRecap.refresh(); });
    windowInput.addEventListener('change', function () { DeathRecap.refresh(); });
    setTimeout(function () { shell.classList.add('visible'); DeathRecap.refresh(); }, 40);
})();
</script>
</body>
</html>
