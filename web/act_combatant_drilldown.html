<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAO ACT Combatant Drilldown</title>
  <style>
    /* ───────────────────────────────────────────────────────────────────────
       Panel-scoped tokens: LAYOUT/SIZING only. All COLORS come from the shared
       act_panel_theme.css var(--act-*) tokens so light/dark follow the host
       theme and stay 1:1 with the flat Tk Entity reference. The shared theme
       already styles .panel/.section/.card/.skill-row/.bar/.empty etc., so we
       only set layout + sizing here and recolor via var(--act-*) where needed.
       ─────────────────────────────────────────────────────────────────────── */
    :root {
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --r-sm: 4px; --r-md: 6px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; user-select: none; }
    body { opacity: 0; transition: opacity 180ms ease; }
    body.visible { opacity: 1; }
    .panel {
      width: 100%; min-height: 500px; padding: var(--sp-4); position: relative;
    }
    header { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-4); margin-bottom:14px; }
    h1 { margin:0; font-size:18px; letter-spacing:.12em; color:var(--act-text); }
    .sub { color:var(--act-muted); font-size:12px; margin-top:4px; }
    .controls { display:grid; grid-template-columns:120px 1fr 1fr 92px 92px 76px; gap:var(--sp-2); margin-bottom:var(--sp-3); align-items:center; }
    input, button { padding:8px 10px; outline:none; font-size:12px; }
    button { cursor:pointer; text-transform:uppercase; letter-spacing:.06em; }
    .close { font-size:16px; }
    .summary { display:grid; grid-template-columns:repeat(6, 1fr); gap:var(--sp-2); margin-bottom:var(--sp-3); }
    /* Single accent: the shared theme's cyan left rail (consistent across all
       cards/tiles/rows). No added gold top bar — it clashed with that rail. */
    .card { position:relative; padding:var(--sp-2) 10px; min-height:62px; overflow:hidden; }
    .label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
    .value { font-size:17px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:1fr 260px; gap:var(--sp-3); min-height:0; height:max(270px, calc(100vh - 230px)); }
    .section { min-height:0; padding:10px; overflow:auto; }
    .section-title { font-size:12px; letter-spacing:.12em; margin-bottom:var(--sp-2); }
    /* row = full-width track, .bar = ratio-width fill (mirror Tk aggregate_row).
       Fill color (gold / heal=green) is supplied by the shared theme's .bar rule. */
    .skill-row { position:relative; overflow:hidden; margin-bottom:6px; min-height:44px; }
    .bar { position:absolute; left:0; top:0; bottom:0; }
    .skill-main { position:relative; display:flex; justify-content:space-between; gap:var(--sp-3); padding:var(--sp-2) 10px; align-items:center; }
    .skill-name { color:var(--act-text); font-size:13px; }
    .skill-extra { font-size:11px; margin-top:3px; }
    .skill-amount { color:var(--act-text); font-size:14px; font-weight:700; }
    .mini-row { display:grid; grid-template-columns:74px 1fr 82px; gap:var(--sp-2); padding:7px 0; font-size:12px; }
    .empty { text-align:center; padding:60px var(--sp-2); }
    .status { margin-top:10px; font-size:11px; color:var(--act-muted); }
    @media (max-width: 820px) { .controls { grid-template-columns:1fr 1fr; } .summary { grid-template-columns:repeat(2, 1fr); } .layout { grid-template-columns:1fr; height:auto; } .section { max-height:360px; } }
  </style>
  <link rel="stylesheet" href="act_panel_theme.css" />
  <style>
  /* Flat override (ACT panel only): kill shared decorative chrome + flatten per-page accents to a single 3px left rail. */
  .shell,.panel,.plugin-shell{border:1px solid var(--act-edge)!important;border-radius:4px!important;background:var(--act-shell-bg)!important;box-shadow:none!important;}
  .shell::before,.shell::after,.panel::before,.panel::after,.plugin-shell::before,.plugin-shell::after{display:none!important;content:none!important;}
  .header,.plugin-header,header{background:var(--act-shell-bg-2)!important;border-bottom:1px solid var(--act-edge-soft)!important;}
  button,input,select,.action-btn{clip-path:none!important;border-radius:3px!important;box-shadow:none!important;}
  button:hover,.action-btn:hover{box-shadow:none!important;transform:none!important;background:var(--act-card-bg-2)!important;}
  .main,.list,.plugin-list,.side,.side-panel,.section,.summary,.chart-wrap,.preview{box-shadow:none!important;}
  .bar{background:var(--act-gold)!important;}.skill-row.heal .bar{background:var(--act-ok)!important;}
  .pill,.badge,.status-pill{background:transparent!important;}
  .aca-tile::before,.metric::before,.group-card::before{content:none!important;display:none!important;}
  .aca-tile{border-left:3px solid var(--acc,var(--act-cyan))!important;}
  .metric{border-left:3px solid var(--act-cyan)!important;}
  .group-card{border-left:3px solid var(--act-gold)!important;}
  .aca-fill{box-shadow:none!important;}
  .aca-row.zebra{background:var(--act-card-bg-2)!important;}
  .aca-badge,.aca-sec-badge{background:transparent!important;border-radius:3px!important;}
  .group-head:hover{background:var(--act-card-bg-2)!important;}
  .death td{box-shadow:none!important;background:transparent!important;border-left:3px solid var(--act-danger)!important;}
  </style>
  <script src="act_panel_theme.js"></script>
  <script src="act_panel_util.js"></script>
</head>
<body>
  <section class="panel">
    <header>
      <div><h1>ACT COMBATANT DRILLDOWN</h1><div class="sub" id="encounter">encounter: pending</div></div>
      <button class="close" onclick="CombatantDrilldown.close()">×</button>
    </header>
    <div class="controls">
      <input id="combatantId" placeholder="UID" onkeydown="if(event.key==='Enter') CombatantDrilldown.refresh()" />
      <input id="query" placeholder="Skill filter" onkeydown="if(event.key==='Enter') CombatantDrilldown.filter()" />
      <input id="focusTarget" placeholder="Focus target" onkeydown="if(event.key==='Enter') CombatantDrilldown.focus()" />
      <button onclick="CombatantDrilldown.refresh()">Open</button>
      <button onclick="CombatantDrilldown.filter()">Filter</button>
      <button onclick="CombatantDrilldown.back()">Back</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="layout">
      <div class="section"><div class="section-title">SKILLS / OUTGOING</div><div id="skills"></div></div>
      <div class="section"><div class="section-title">INCOMING / TARGET</div><div id="side"></div></div>
    </div>
    <div class="status" id="status">Waiting for combatant id…</div>
  </section>
  <script src="pywebview-shim.js"></script>
  <script>
    function parseMaybeJson(value) { if (typeof value === 'string') { try { return JSON.parse(value); } catch (_) { return {}; } } return value || {}; }
    async function callApi(name, fallbackAction, ...args) {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[name] === 'function') return parseMaybeJson(await window.pywebview.api[name](...args));
      if (window.bridge && typeof window.bridge.cmd === 'function') return parseMaybeJson(await window.bridge.cmd(fallbackAction, fallbackPayload(fallbackAction, args)));
      return {};
    }
    function fallbackPayload(action, args) {
      args = args || [];
      if (action === 'act.combatant.status') return { combatant_id: String(args[0] || ''), query: String(args[1] || ''), focus_target: String(args[2] || '') };
      if (action === 'act.combatant.filter') return { combatant_id: String(args[0] || ''), query: String(args[1] || '') };
      if (action === 'act.combatant.focus_target') return { combatant_id: String(args[0] || ''), target_id: String(args[1] || '') };
      if (action === 'act.combatant.back') return {};
      if (action === 'act.skill.open') return { combatant_id: String(args[0] || ''), skill_id: String(args[1] || '') };
      if (action === 'ui.menu_action') return { action: String(args[0] || '') };
      return { args: args };
    }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function jsArg(v) { return esc(JSON.stringify(String(v == null ? '' : v))); }
    function finiteNum(v) { const n = Number(v || 0); return Number.isFinite(n) ? n : 0; }
    function nonNeg(v) { return Math.max(0, finiteNum(v)); }
    function clamp01(v) { return Math.max(0, Math.min(1, finiteNum(v))); }
    function barPct(value, max) {
      const amount = nonNeg(value);
      if (amount <= 0) return 0;
      return Math.round(Math.max(3, Math.min(100, amount / Math.max(1, nonNeg(max)) * 100)));
    }
    function fmt(v) { const n = finiteNum(v); if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(2)+'m'; if (Math.abs(n) >= 1000) return (n/1000).toFixed(1)+'k'; return String(Math.round(n)); }
    function pct(v) { return (clamp01(v) * 100).toFixed(1) + '%'; }
    window.CombatantDrilldown = {
      last: null,
      fadeIn() { document.body.classList.add('visible'); },
      fadeOut() { document.body.classList.remove('visible'); },
      _id() { return document.getElementById('combatantId').value.trim(); },
      async refresh() { const status = await callApi('get_combatant_drilldown_status', 'act.combatant.status', this._id(), document.getElementById('query').value, document.getElementById('focusTarget').value); this.render(status); },
      async filter() { const status = await callApi('filter_combatant_drilldown', 'act.combatant.filter', this._id(), document.getElementById('query').value); this.render(status); },
      async focus() { const status = await callApi('focus_combatant_target', 'act.combatant.focus_target', this._id(), document.getElementById('focusTarget').value); this.render(status); },
      async back() { const status = await callApi('back_combatant_drilldown', 'act.combatant.back'); document.getElementById('combatantId').value = ''; this.render(status); },
      async close() { this.fadeOut(); await callApi('toggle_combatant_drilldown', 'ui.menu_action', 'toggle_combatant_drilldown'); },
      async openSkill(skillId) {
        const cid = this._id() || (this.last && this.last.combatant_id) || '';
        if (!cid || !skillId) { document.getElementById('status').textContent = 'Need combatant UID + skill id'; return; }
        await callApi('open_skill_drilldown', 'act.skill.open', String(cid), String(skillId));
        document.getElementById('status').textContent = 'Opened skill ' + skillId;
      },
      render(status) {
        status = status || {}; this.last = status;
        const s = status.summary || {}; const skills = status.skills || []; const incoming = status.incoming || []; const outgoing = status.outgoing || [];
        if (status.combatant_id) document.getElementById('combatantId').value = status.combatant_id;
        document.getElementById('encounter').textContent = 'encounter: ' + (status.encounter_id || 'unknown');
        document.getElementById('summary').innerHTML = [
          ['Name', s.name || '-'], ['Damage', fmt(s.damage)], ['DPS', fmt(s.dps)], ['Heal', fmt(s.heal)], ['Crit', pct(s.crit_rate)], ['Share', pct(s.damage_pct)]
        ].map(([k,v]) => '<div class="card"><div class="label">'+esc(k)+'</div><div class="value">'+esc(v)+'</div></div>').join('');
        const max = Math.max(1, ...skills.map(x => nonNeg(x.amount)));
        document.getElementById('skills').innerHTML = skills.length ? skills.map(sk => {
          const w = barPct(sk.amount, max);
          const sid = sk.skill_id || sk.source_skill_id || sk.base_skill_id || '';
          const click = sid ? ' onclick="CombatantDrilldown.openSkill('+jsArg(sid)+')" style="cursor:pointer;" title="打开技能钻取 / open skill drilldown"' : '';
          return '<div class="skill-row '+(sk.kind === 'heal' ? 'heal' : '')+'"'+click+'><div class="bar" style="width:'+w+'%"></div><div class="skill-main"><div><div class="skill-name">'+esc(sk.name)+'</div><div class="skill-extra">'+esc(sk.kind)+' · hits '+esc(sk.hits)+' · crit '+pct(sk.crit_rate)+'</div></div><div class="skill-amount">'+fmt(sk.amount)+'</div></div></div>';
        }).join('') : '<div class="empty">No skill rows</div>';
        const sideRows = [];
        if ((status.filters || {}).focus_target) sideRows.push({ kind: 'focus', name: status.filters.focus_target, amount: '' });
        outgoing.slice(0, 5).forEach(x => sideRows.push({ kind: x.kind || 'out', name: x.name || '-', amount: x.amount || 0 }));
        incoming.slice(0, 5).forEach(x => sideRows.push({ kind: x.kind || 'in', name: x.name || x.topic || '-', amount: x.amount || x.value || 0 }));
        document.getElementById('side').innerHTML = sideRows.length ? sideRows.map(x => '<div class="mini-row"><span>'+esc(x.kind)+'</span><span>'+esc(x.name)+'</span><span>'+esc(fmt(x.amount))+'</span></div>').join('') : '<div class="empty">No incoming/focus data</div>';
        document.getElementById('status').textContent = (status.ok ? 'OK' : 'ERROR') + ' · ' + (status.message || '') + ' · query=' + ((status.filters || {}).query || '-');
      }
    };
    window.addEventListener('load', () => { CombatantDrilldown.fadeIn(); CombatantDrilldown.refresh(); });
  </script>
</body>
</html>
