<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAO ACT Combatant Drilldown</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: transparent; color: #e7fbff; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
    body { padding: 18px; opacity: 0; transition: opacity 180ms ease; }
    body.visible { opacity: 1; }
    .panel {
      width: min(100%, 920px); min-height: 500px; padding: 18px; position: relative;
      border: 1px solid rgba(72,239,255,.58);
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
      background: linear-gradient(135deg, rgba(4,17,30,.94), rgba(7,42,60,.82)), repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px);
      box-shadow: 0 0 28px rgba(0,210,255,.36), inset 0 0 28px rgba(0,210,255,.12);
    }
    .panel::before, .panel::after { content:""; position:absolute; left:22px; right:22px; height:2px; background:linear-gradient(90deg,transparent,#48efff,#f9b44a,transparent); opacity:.82; }
    .panel::before { top:8px; } .panel::after { bottom:8px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:14px; }
    h1 { margin:0; font-size:18px; letter-spacing:.12em; text-shadow:0 0 10px rgba(72,239,255,.86); }
    .sub { color:rgba(223,250,255,.62); font-size:12px; margin-top:4px; }
    .controls { display:grid; grid-template-columns:120px 1fr 1fr 92px 92px 76px; gap:8px; margin-bottom:12px; align-items:center; }
    input, button { border:1px solid rgba(72,239,255,.45); background:rgba(2,18,32,.74); color:#e8fdff; border-radius:4px; padding:8px 10px; outline:none; font-size:12px; }
    input::placeholder { color:rgba(223,250,255,.42); }
    button { cursor:pointer; text-transform:uppercase; letter-spacing:.06em; transition:all 120ms ease; }
    button:hover { border-color:#f9b44a; box-shadow:0 0 14px rgba(249,180,74,.28); }
    .close { width:34px; height:34px; padding:0; border-radius:50%; font-size:16px; }
    .summary { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin-bottom:12px; }
    .card { border:1px solid rgba(72,239,255,.22); background:rgba(0,11,20,.46); padding:10px; min-height:62px; }
    .label { color:rgba(223,250,255,.55); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
    .value { color:#fff7d6; font-size:17px; margin-top:4px; text-shadow:0 0 8px rgba(249,180,74,.28); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:1fr 260px; gap:12px; }
    .section { border:1px solid rgba(72,239,255,.22); background:rgba(0,7,16,.44); min-height:270px; padding:10px; overflow:hidden; }
    .section-title { color:#48efff; font-size:12px; letter-spacing:.12em; margin-bottom:8px; }
    .skill-row { position:relative; overflow:hidden; border:1px solid rgba(72,239,255,.13); margin-bottom:6px; background:rgba(255,255,255,.035); min-height:44px; }
    .bar { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, rgba(249,180,74,.42), rgba(249,180,74,.05)); }
    .skill-row.heal .bar { background:linear-gradient(90deg, rgba(103,255,194,.38), rgba(103,255,194,.05)); }
    .skill-main { position:relative; display:flex; justify-content:space-between; gap:12px; padding:8px 10px; align-items:center; }
    .skill-name { color:#f2fdff; font-size:13px; }
    .skill-extra { color:rgba(223,250,255,.56); font-size:11px; margin-top:3px; }
    .skill-amount { color:#fff7d6; font-size:14px; font-weight:700; }
    .mini-row { display:grid; grid-template-columns:74px 1fr 82px; gap:8px; border-top:1px solid rgba(72,239,255,.12); padding:7px 0; font-size:12px; color:rgba(223,250,255,.74); }
    .empty { color:rgba(223,250,255,.52); text-align:center; padding:60px 8px; }
    .status { margin-top:10px; color:rgba(223,250,255,.52); font-size:11px; }
    @media (max-width: 820px) { .controls { grid-template-columns:1fr 1fr; } .summary { grid-template-columns:repeat(2, 1fr); } .layout { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="act_panel_theme.css" />
  <script src="act_panel_theme.js"></script>
  <script src="act_panel_util.js"></script>
</head>
<body>
  <section class="panel">
    <header>
      <div><h1>ACT COMBATANT DRILLDOWN</h1><div class="sub" id="encounter">encounter: pending</div></div>
      <button class="close" onclick="CombatantDrilldown.close()">×</button>
    </header>
    <div class="controls">
      <input id="combatantId" placeholder="UID" onkeydown="if(event.key==='Enter') CombatantDrilldown.refresh()" />
      <input id="query" placeholder="Skill filter" onkeydown="if(event.key==='Enter') CombatantDrilldown.filter()" />
      <input id="focusTarget" placeholder="Focus target" onkeydown="if(event.key==='Enter') CombatantDrilldown.focus()" />
      <button onclick="CombatantDrilldown.refresh()">Open</button>
      <button onclick="CombatantDrilldown.filter()">Filter</button>
      <button onclick="CombatantDrilldown.back()">Back</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="layout">
      <div class="section"><div class="section-title">SKILLS / OUTGOING</div><div id="skills"></div></div>
      <div class="section"><div class="section-title">INCOMING / TARGET</div><div id="side"></div></div>
    </div>
    <div class="status" id="status">Waiting for combatant id…</div>
  </section>
  <script src="pywebview-shim.js"></script>
  <script>
    function parseMaybeJson(value) { if (typeof value === 'string') { try { return JSON.parse(value); } catch (_) { return {}; } } return value || {}; }
    async function callApi(name, fallbackAction, ...args) {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[name] === 'function') return parseMaybeJson(await window.pywebview.api[name](...args));
      if (window.bridge && typeof window.bridge.cmd === 'function') return parseMaybeJson(await window.bridge.cmd(fallbackAction, args));
      return {};
    }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function fmt(v) { const n = Number(v || 0); if (!Number.isFinite(n)) return esc(v); if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(2)+'m'; if (Math.abs(n) >= 1000) return (n/1000).toFixed(1)+'k'; return String(Math.round(n)); }
    function pct(v) { return (Number(v || 0) * 100).toFixed(1) + '%'; }
    window.CombatantDrilldown = {
      last: null,
      fadeIn() { document.body.classList.add('visible'); },
      fadeOut() { document.body.classList.remove('visible'); },
      _id() { return document.getElementById('combatantId').value.trim(); },
      async refresh() { const status = await callApi('get_combatant_drilldown_status', 'act.combatant.status', this._id(), document.getElementById('query').value, document.getElementById('focusTarget').value); this.render(status); },
      async filter() { const status = await callApi('filter_combatant_drilldown', 'act.combatant.filter', this._id(), document.getElementById('query').value); this.render(status); },
      async focus() { const status = await callApi('focus_combatant_target', 'act.combatant.focus_target', this._id(), document.getElementById('focusTarget').value); this.render(status); },
      async back() { const status = await callApi('back_combatant_drilldown', 'act.combatant.back'); document.getElementById('combatantId').value = ''; this.render(status); },
      async close() { this.fadeOut(); await callApi('toggle_combatant_drilldown', 'ui.menu_action', 'toggle_combatant_drilldown'); },
      async openSkill(skillId) {
        const cid = this._id() || (this.last && this.last.combatant_id) || '';
        if (!cid || !skillId) { document.getElementById('status').textContent = 'Need combatant UID + skill id'; return; }
        await callApi('open_skill_drilldown', 'ui.menu_action', String(cid), String(skillId));
        document.getElementById('status').textContent = 'Opened skill ' + skillId;
      },
      render(status) {
        status = status || {}; this.last = status;
        const s = status.summary || {}; const skills = status.skills || []; const incoming = status.incoming || []; const outgoing = status.outgoing || [];
        if (status.combatant_id) document.getElementById('combatantId').value = status.combatant_id;
        document.getElementById('encounter').textContent = 'encounter: ' + (status.encounter_id || 'unknown');
        document.getElementById('summary').innerHTML = [
          ['Name', s.name || '-'], ['Damage', fmt(s.damage)], ['DPS', fmt(s.dps)], ['Heal', fmt(s.heal)], ['Crit', pct(s.crit_rate)], ['Share', pct(s.damage_pct)]
        ].map(([k,v]) => '<div class="card"><div class="label">'+esc(k)+'</div><div class="value">'+esc(v)+'</div></div>').join('');
        const max = Math.max(1, ...skills.map(x => Number(x.amount || 0)));
        document.getElementById('skills').innerHTML = skills.length ? skills.map(sk => {
          const w = Math.round(Number(sk.amount || 0) / max * 100);
          const sid = sk.skill_id || sk.source_skill_id || sk.base_skill_id || '';
          const click = sid ? ' onclick="CombatantDrilldown.openSkill(\''+esc(String(sid))+'\')" style="cursor:pointer;" title="打开技能钻取 / open skill drilldown"' : '';
          return '<div class="skill-row '+(sk.kind === 'heal' ? 'heal' : '')+'"'+click+'><div class="bar" style="width:'+w+'%"></div><div class="skill-main"><div><div class="skill-name">'+esc(sk.name)+'</div><div class="skill-extra">'+esc(sk.kind)+' · hits '+esc(sk.hits)+' · crit '+pct(sk.crit_rate)+'</div></div><div class="skill-amount">'+fmt(sk.amount)+'</div></div></div>';
        }).join('') : '<div class="empty">No skill rows</div>';
        const sideRows = [];
        if ((status.filters || {}).focus_target) sideRows.push({ kind: 'focus', name: status.filters.focus_target, amount: '' });
        outgoing.slice(0, 5).forEach(x => sideRows.push({ kind: x.kind || 'out', name: x.name || '-', amount: x.amount || 0 }));
        incoming.slice(0, 5).forEach(x => sideRows.push({ kind: x.kind || 'in', name: x.name || x.topic || '-', amount: x.amount || x.value || 0 }));
        document.getElementById('side').innerHTML = sideRows.length ? sideRows.map(x => '<div class="mini-row"><span>'+esc(x.kind)+'</span><span>'+esc(x.name)+'</span><span>'+esc(fmt(x.amount))+'</span></div>').join('') : '<div class="empty">No incoming/focus data</div>';
        document.getElementById('status').textContent = (status.ok ? 'OK' : 'ERROR') + ' · ' + (status.message || '') + ' · query=' + ((status.filters || {}).query || '-');
      }
    };
    window.addEventListener('load', () => { CombatantDrilldown.fadeIn(); CombatantDrilldown.refresh(); });
  </script>
</body>
</html>
