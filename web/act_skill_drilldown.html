<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAO ACT Skill Drilldown</title>
  <style>
    /* ───────────────────────────────────────────────────────────────────────
       Panel-scoped tokens: LAYOUT/SIZING only. All COLORS come from the shared
       act_panel_theme.css var(--act-*) tokens so light/dark follow the host
       theme and stay 1:1 with the flat Tk Entity reference. The shared theme
       already styles .panel/.section/.card/.event-row/.empty etc., so we only
       set layout + sizing here and recolor via var(--act-*) where needed.
       ─────────────────────────────────────────────────────────────────────── */
    :root {
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --r-sm: 4px; --r-md: 6px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; user-select: none; }
    body { opacity: 0; transition: opacity 180ms ease; }
    body.visible { opacity: 1; }
    .panel {
      width: 100%; min-height: 500px; padding: var(--sp-4); position: relative;
    }
    header { display:flex; justify-content:space-between; align-items:center; gap:var(--sp-4); margin-bottom:14px; }
    h1 { margin:0; font-size:18px; letter-spacing:.12em; color:var(--act-text); }
    .sub { color:var(--act-muted); font-size:12px; margin-top:4px; }
    .controls { display:grid; grid-template-columns:110px 110px 1fr 84px 84px 72px 72px; gap:var(--sp-2); margin-bottom:var(--sp-3); align-items:center; }
    input, button { padding:8px 10px; outline:none; font-size:12px; }
    button { cursor:pointer; text-transform:uppercase; letter-spacing:.06em; }
    .close { font-size:16px; }
    .summary { display:grid; grid-template-columns:repeat(6, 1fr); gap:var(--sp-2); margin-bottom:var(--sp-3); }
    /* Single accent: the shared theme's cyan left rail (consistent across all
       cards/tiles/rows). No added gold top bar — it clashed with that rail. */
    .card { position:relative; padding:var(--sp-2) 10px; min-height:62px; overflow:hidden; }
    .label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin-top:4px; }
    .value { font-size:17px; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layout { display:grid; grid-template-columns:1fr 260px; gap:var(--sp-3); min-height:0; height:max(275px, calc(100vh - 230px)); }
    .section { min-height:0; padding:10px; overflow:auto; }
    .section-title { font-size:12px; letter-spacing:.12em; margin-bottom:var(--sp-2); }
    .event-row { margin-bottom:7px; padding:var(--sp-2) 10px; display:grid; grid-template-columns:82px 72px 1fr 96px; gap:var(--sp-2); align-items:center; }
    .event-time { color:var(--act-gold); font-size:12px; }
    .event-topic { color:var(--act-cyan); font-size:12px; text-transform:uppercase; }
    .event-label { color:var(--act-text); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .event-value { color:var(--act-text); font-size:13px; text-align:right; }
    .event-wrap { cursor:pointer; }
    /* Higher specificity than the shared `.event-row` !important border, so
       !important here restores the hover-border affordance. */
    .event-wrap:hover .event-row { border-color:var(--act-cyan) !important; }
    .ref-payload { margin:0 0 7px; color:var(--act-muted); font-size:11px; line-height:1.45; white-space:pre-wrap; word-break:break-all; max-height:160px; overflow:auto; user-select:text; }
    .mini-row { display:grid; grid-template-columns:82px 1fr; gap:var(--sp-2); padding:var(--sp-2) 0; font-size:12px; }
    .empty { text-align:center; padding:60px var(--sp-2); }
    .status { margin-top:10px; font-size:11px; color:var(--act-muted); }
    @media (max-width: 820px) { .controls { grid-template-columns:1fr 1fr; } .summary { grid-template-columns:repeat(2, 1fr); } .layout { grid-template-columns:1fr; height:auto; } .section { max-height:360px; } }
  </style>
  <link rel="stylesheet" href="act_panel_theme.css" />
  <style>
  /* Flat override (ACT panel only): kill shared decorative chrome + flatten per-page accents to a single 3px left rail. */
  .shell,.panel,.plugin-shell{border:1px solid var(--act-edge)!important;border-radius:4px!important;background:var(--act-shell-bg)!important;box-shadow:none!important;}
  .shell::before,.shell::after,.panel::before,.panel::after,.plugin-shell::before,.plugin-shell::after{display:none!important;content:none!important;}
  .header,.plugin-header,header{background:var(--act-shell-bg-2)!important;border-bottom:1px solid var(--act-edge-soft)!important;}
  button,input,select,.action-btn{clip-path:none!important;border-radius:3px!important;box-shadow:none!important;}
  button:hover,.action-btn:hover{box-shadow:none!important;transform:none!important;background:var(--act-card-bg-2)!important;}
  .main,.list,.plugin-list,.side,.side-panel,.section,.summary,.chart-wrap,.preview{box-shadow:none!important;}
  .bar{background:var(--act-gold)!important;}.skill-row.heal .bar{background:var(--act-ok)!important;}
  .pill,.badge,.status-pill{background:transparent!important;}
  .aca-tile::before,.metric::before,.group-card::before{content:none!important;display:none!important;}
  .aca-tile{border-left:3px solid var(--acc,var(--act-cyan))!important;}
  .metric{border-left:3px solid var(--act-cyan)!important;}
  .group-card{border-left:3px solid var(--act-gold)!important;}
  .aca-fill{box-shadow:none!important;}
  .aca-row.zebra{background:var(--act-card-bg-2)!important;}
  .aca-badge,.aca-sec-badge{background:transparent!important;border-radius:3px!important;}
  .group-head:hover{background:var(--act-card-bg-2)!important;}
  .death td{box-shadow:none!important;background:transparent!important;border-left:3px solid var(--act-danger)!important;}
  </style>
  <script src="act_panel_theme.js"></script>
  <script src="act_panel_util.js"></script>
</head>
<body>
  <section class="panel">
    <header>
      <div><h1>ACT SKILL DRILLDOWN</h1><div class="sub" id="encounter">encounter: pending</div></div>
      <button class="close" onclick="SkillDrilldown.close()">×</button>
    </header>
    <div class="controls">
      <input id="combatantId" placeholder="UID" onkeydown="if(event.key==='Enter') SkillDrilldown.refresh()" />
      <input id="skillId" placeholder="Skill ID" onkeydown="if(event.key==='Enter') SkillDrilldown.refresh()" />
      <input id="query" placeholder="Timeline filter" onkeydown="if(event.key==='Enter') SkillDrilldown.filter()" />
      <button onclick="SkillDrilldown.refresh()">Open</button>
      <button onclick="SkillDrilldown.filter()">Filter</button>
      <button onclick="SkillDrilldown.copy()">Copy</button>
      <button onclick="SkillDrilldown.back()">Back</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="layout">
      <div class="section"><div class="section-title">TIMELINE REFS</div><div id="timeline"></div></div>
      <div class="section"><div class="section-title">SKILL FACTS</div><div id="facts"></div></div>
    </div>
    <div class="status" id="status">Waiting for combatant and skill id…</div>
  </section>
  <script src="pywebview-shim.js"></script>
  <script>
    function parseMaybeJson(value) { if (typeof value === 'string') { try { return JSON.parse(value); } catch (_) { return {}; } } return value || {}; }
    async function callApi(name, fallbackAction, ...args) {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[name] === 'function') return parseMaybeJson(await window.pywebview.api[name](...args));
      if (window.bridge && typeof window.bridge.cmd === 'function') return parseMaybeJson(await window.bridge.cmd(fallbackAction, fallbackPayload(fallbackAction, args)));
      return {};
    }
    function fallbackPayload(action, args) {
      args = args || [];
      if (action === 'act.skill.status' || action === 'act.skill.filter' || action === 'act.skill.copy') {
        return { combatant_id: String(args[0] || ''), skill_id: String(args[1] || ''), query: String(args[2] || ''), limit: safeLimit(args[3]) };
      }
      if (action === 'act.skill.back') return {};
      if (action === 'ui.menu_action') return { action: String(args[0] || '') };
      return { args: args };
    }
    function esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
    function finiteNum(v) { const n = Number(v || 0); return Number.isFinite(n) ? n : 0; }
    function safeLimit(v) { const n = Number(v == null || v === '' ? 80 : v); return Math.max(1, Math.min(500, Math.round(Number.isFinite(n) ? n : 80))); }
    function clamp01(v) { return Math.max(0, Math.min(1, finiteNum(v))); }
    function fmt(v) { const n = finiteNum(v); if (Math.abs(n) >= 1000000) return (n/1000000).toFixed(2)+'m'; if (Math.abs(n) >= 1000) return (n/1000).toFixed(1)+'k'; return String(Math.round(n)); }
    function pct(v) { return (clamp01(v) * 100).toFixed(1) + '%'; }
    function objectValue(v) { return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; }
    function objectItems(v) { return Array.isArray(v) ? v.filter(x => x && typeof x === 'object' && !Array.isArray(x)) : []; }
    window.SkillDrilldown = {
      last: null,
      expandedRefs: {},
      fadeIn() { document.body.classList.add('visible'); },
      fadeOut() { document.body.classList.remove('visible'); },
      _cid() { return document.getElementById('combatantId').value.trim(); },
      _sid() { return document.getElementById('skillId').value.trim(); },
      _query() { return document.getElementById('query').value; },
      _refKey(ref, idx) { return String(ref.id || ref.event_id || ref.key || ((ref.time_ms || 0) + '|' + (ref.topic || '') + '|' + (ref.label || '') + '|' + idx)); },
      _setTimelineHtml(html, preserveScroll) {
        const timeline = document.getElementById('timeline');
        const scroller = timeline.parentElement || timeline;
        const top = scroller.scrollTop || 0;
        const left = scroller.scrollLeft || 0;
        timeline.innerHTML = html;
        if (preserveScroll) { scroller.scrollTop = top; scroller.scrollLeft = left; }
      },
      async refresh(options) { options = options || {}; const status = await callApi('get_skill_drilldown_status', 'act.skill.status', this._cid(), this._sid(), this._query(), 80); this.render(status, { preserveScroll: options.preserveScroll !== false }); },
      async filter() { const status = await callApi('filter_skill_drilldown', 'act.skill.filter', this._cid(), this._sid(), this._query(), 80); this.render(status, { preserveScroll: false }); },
      async copy() {
        const copied = await callApi('copy_skill_drilldown', 'act.skill.copy', this._cid(), this._sid(), this._query(), 80);
        this.render(copied, { preserveScroll: true });
        const text = copied.text || JSON.stringify(copied);
        var clipboardOk = false;
        try { await navigator.clipboard.writeText(text); clipboardOk = true; } catch (_) {}
        if (!clipboardOk) document.getElementById('status').textContent = 'Copy payload ready, but clipboard copy failed';
      },
      async back() { const status = await callApi('back_skill_drilldown', 'act.skill.back'); document.getElementById('combatantId').value = ''; document.getElementById('skillId').value = ''; this.render(status, { preserveScroll: false }); },
      async close() { this.fadeOut(); await callApi('toggle_skill_drilldown', 'ui.menu_action', 'toggle_skill_drilldown'); },
      toggleRef(el) {
        var pre = el.querySelector('.ref-payload'); if (!pre) return;
        var key = el.getAttribute('data-key') || '';
        var open = pre.style.display !== 'none';
        pre.style.display = open ? 'none' : '';
        if (key) { if (open) { delete this.expandedRefs[key]; } else { this.expandedRefs[key] = true; } }
      },
      render(status, options) {
        status = objectValue(status); this.last = status;
        options = options || {};
        const preserveScroll = options.preserveScroll !== false;
        const s = objectValue(status.summary);
        const refs = objectItems(status.timeline_refs);
        const filters = objectValue(status.filters);
        if (status.combatant_id) document.getElementById('combatantId').value = status.combatant_id;
        if (status.skill_id) document.getElementById('skillId').value = status.skill_id;
        if (filters.query != null && document.activeElement !== document.getElementById('query')) document.getElementById('query').value = filters.query || '';
        document.getElementById('encounter').textContent = 'encounter: ' + (status.encounter_id || 'unknown');
        document.getElementById('summary').innerHTML = [
          ['Skill', s.name || '-'], ['Kind', s.kind || '-'], ['Amount', fmt(s.amount)], ['Casts', fmt(status.casts)], ['Hits', fmt(status.hits)], ['Crit', pct(status.crit_rate)]
        ].map(([k,v]) => '<div class="card"><div class="label">'+esc(k)+'</div><div class="value">'+esc(v)+'</div></div>').join('');
        let timelineHtml = '<div class="empty">No timeline refs</div>';
        if (refs.length) {
          timelineHtml = refs.map((ref, idx) => {
          const key = this._refKey(ref, idx);
          const open = !!this.expandedRefs[key];
          const payload = objectValue(ref.payload);
          return '<div class="event-wrap" data-key="'+esc(key)+'" onclick="SkillDrilldown.toggleRef(this)"><div class="event-row"><span class="event-time">'+esc(ActTime.fmtClock(ref.time_ms))+'</span><span class="event-topic">'+esc(ref.topic || '-')+'</span><span class="event-label">'+esc(ref.label || '-')+'</span><span class="event-value">'+esc(fmt(ref.value))+'</span></div><pre class="ref-payload" style="'+(open ? '' : 'display:none;')+'">'+esc(JSON.stringify(payload))+'</pre></div>';
          }).join('');
        }
        this._setTimelineHtml(timelineHtml, preserveScroll);
        document.getElementById('facts').innerHTML = [
          ['combatant', status.combatant_id || '-'], ['skill_id', status.skill_id || '-'], ['damage', fmt(s.damage)], ['heal', fmt(s.heal)], ['refs', refs.length], ['query', filters.query || '-']
        ].map(([k,v]) => '<div class="mini-row"><span>'+esc(k)+'</span><span>'+esc(v)+'</span></div>').join('');
        document.getElementById('status').textContent = (status.ok ? 'OK' : 'ERROR') + ' · ' + (status.message || '') + ' · copied=' + (status.text ? 'yes' : 'no');
      }
    };
    window.addEventListener('load', () => { SkillDrilldown.fadeIn(); SkillDrilldown.refresh(); });
  </script>
</body>
</html>
