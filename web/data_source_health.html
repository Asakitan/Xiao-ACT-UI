<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAO ACT Data Source Health</title>
<style>
:root {
    --bg: rgba(8, 13, 22, .76);
    --panel: rgba(18, 33, 52, .90);
    --panel2: rgba(6, 11, 18, .72);
    --line: rgba(117, 205, 255, .48);
    --gold: rgba(255, 214, 117, .86);
    --text: rgba(232, 246, 255, .96);
    --muted: rgba(176, 204, 226, .76);
    --ok: #7df2bf;
    --warn: #ffd46f;
    --bad: #ff6b82;
}
* { box-sizing: border-box; }
html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    user-select: none;
}
body { padding: 14px; }
.shell {
    position: relative;
    width: 100%;
    height: calc(100vh - 28px);
    min-height: 430px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background:
        radial-gradient(circle at 16% 8%, rgba(117, 205, 255, .20), transparent 26%),
        linear-gradient(135deg, rgba(100, 202, 255, .14), transparent 24%, transparent 70%, rgba(255, 215, 125, .12)),
        linear-gradient(180deg, rgba(16, 28, 45, .96), rgba(7, 12, 20, .90));
    box-shadow: 0 0 34px rgba(88, 199, 255, .22), inset 0 0 28px rgba(109, 216, 255, .10);
    opacity: 0;
    transform: translateY(10px) scale(.985);
    transition: opacity .22s ease, transform .22s ease;
}
.shell.visible { opacity: 1; transform: translateY(0) scale(1); }
.shell::before {
    content: "";
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0, rgba(255,255,255,.035) 1px, transparent 1px, transparent 7px);
    mix-blend-mode: screen;
}
.header {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px 8px 18px;
    border-bottom: 1px solid rgba(117, 205, 255, .35);
    background: linear-gradient(90deg, rgba(18, 59, 94, .76), rgba(11, 22, 35, .58));
}
.kicker { letter-spacing: .18em; font-size: 10px; color: var(--gold); text-shadow: 0 0 10px rgba(255, 214, 117, .52); }
.title { margin-top: 2px; font-size: 20px; font-weight: 700; letter-spacing: .08em; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.pill, .badge {
    border: 1px solid rgba(117, 205, 255, .42);
    border-radius: 999px;
    color: var(--muted);
    background: rgba(8, 14, 22, .62);
    font-size: 12px;
}
.pill { min-width: 94px; text-align: center; padding: 5px 9px; }
.badge { display: inline-block; padding: 3px 7px; font-size: 10px; }
.badge.ok { color: var(--ok); border-color: rgba(125,242,191,.62); }
.badge.warn { color: var(--warn); border-color: rgba(255,212,111,.62); }
.badge.bad { color: var(--bad); border-color: rgba(255,107,130,.62); }
button {
    border: 1px solid rgba(117, 205, 255, .48);
    background: linear-gradient(180deg, rgba(61, 143, 201, .42), rgba(19, 48, 74, .58));
    color: var(--text);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}
button:hover { box-shadow: 0 0 16px rgba(107, 214, 255, .25); transform: translateY(-1px); }
button.primary { border-color: rgba(255, 214, 117, .74); color: #fff8da; }
button.close { width: 30px; height: 30px; padding: 0; border-radius: 50%; font-size: 16px; }
.body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 12px;
    height: calc(100% - 58px);
    padding: 12px;
}
.main { min-height: 0; overflow: auto; padding-right: 4px; }
.card {
    margin-bottom: 10px;
    border: 1px solid rgba(117, 205, 255, .34);
    border-left: 3px solid rgba(117, 205, 255, .75);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(27, 46, 68, .86), rgba(9, 16, 26, .82));
    padding: 12px;
}
.card.memory { border-left-color: var(--gold); }
.card.bad { border-left-color: var(--bad); }
.card-top { display: flex; justify-content: space-between; gap: 12px; }
.name { font-size: 16px; font-weight: 700; letter-spacing: .05em; }
.sub { margin-top: 3px; color: var(--muted); font-size: 11px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.grid span { color: var(--text); user-select: text; }
.watchers { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.side { min-height: 0; border: 1px solid rgba(117, 205, 255, .30); border-radius: 10px; background: rgba(8, 14, 22, .52); padding: 12px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.side-title { color: var(--gold); font-size: 12px; letter-spacing: .16em; }
.row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(117, 205, 255, .16); padding-bottom: 5px; font-size: 12px; color: var(--muted); }
.row strong { color: var(--text); text-align: right; }
.diag { flex: 1; min-height: 0; overflow: auto; font-size: 11px; color: var(--muted); line-height: 1.45; }
.diag-item { border: 1px solid rgba(117, 205, 255, .20); border-radius: 8px; padding: 7px; margin-bottom: 6px; background: rgba(7, 12, 20, .42); user-select: text; }
.diag-item.error { border-color: rgba(255,107,130,.44); color: #ffd4dc; }
.diag-item.warn { border-color: rgba(255,212,111,.44); color: #fff0bd; }
.empty { display: grid; place-items: center; height: 100%; min-height: 240px; color: var(--muted); border: 1px dashed rgba(117, 205, 255, .28); border-radius: 10px; text-align: center; line-height: 1.6; }
.toast { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; border: 1px solid rgba(255, 214, 117, .58); background: rgba(8, 14, 22, .88); color: #fff7d2; border-radius: 999px; padding: 8px 14px; font-size: 12px; transition: opacity .16s ease, transform .16s ease; }
.toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; user-select: text; color: rgba(232, 246, 255, .86); font-size: 11px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,.18); }
::-webkit-scrollbar-thumb { background: rgba(117,205,255,.38); border-radius: 999px; }
</style>
<link rel="stylesheet" href="act_panel_theme.css" />
<script src="act_panel_theme.js"></script>
</head>
<body>
<div class="shell" id="shell">
    <div class="header">
        <div>
            <div class="kicker">ACT SOURCE OBSERVABILITY</div>
            <div class="title">DATA SOURCE HEALTH</div>
        </div>
        <div class="header-actions">
            <div class="pill" id="status-pill">LOADING</div>
            <button class="primary" type="button" onclick="DataSourceHealth.refresh()">刷新 Refresh</button>
            <button type="button" onclick="DataSourceHealth.diagnose()">诊断 Diagnose</button>
            <button type="button" onclick="DataSourceHealth.copy()">复制 Copy</button>
            <button class="close" type="button" onclick="DataSourceHealth.close()">×</button>
        </div>
    </div>
    <div class="body">
        <main class="main" id="source-list"><div class="empty">正在读取数据源健康...<br/>LOADING DATA SOURCES</div></main>
        <aside class="side">
            <div class="side-title">RUNTIME SUMMARY</div>
            <div class="row"><span>Status</span><strong id="sum-status">--</strong></div>
            <div class="row"><span>Requested</span><strong id="sum-mode">--</strong></div>
            <div class="row"><span>Source</span><strong id="sum-source">--</strong></div>
            <div class="row"><span>Latency</span><strong id="sum-latency">--</strong></div>
            <div class="row"><span>Last event</span><strong id="sum-event">--</strong></div>
            <div class="row"><span>Errors</span><strong id="sum-errors">0</strong></div>
            <div class="side-title">DIAGNOSTICS</div>
            <div class="diag" id="diag-list">暂无诊断信息</div>
        </aside>
    </div>
    <div class="toast" id="toast"></div>
</div>
<script>
(function () {
    "use strict";

    var shell = document.getElementById('shell');
    var list = document.getElementById('source-list');
    var diagList = document.getElementById('diag-list');
    var statusPill = document.getElementById('status-pill');
    var toast = document.getElementById('toast');
    var toastTimer = null;
    var lastPayload = null;

    function esc(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function parseResult(result) {
        if (typeof result === 'string') {
            try { return JSON.parse(result); } catch (_) { return { ok: false, message: result }; }
        }
        return result || {};
    }

    function apiCall(name, args) {
        var api = window.pywebview && window.pywebview.api;
        if (api && typeof api[name] === 'function') {
            return Promise.resolve(api[name].apply(api, args || [])).then(parseResult);
        }
        if (window.bridge && typeof window.bridge.cmd === 'function') {
            var cmdMap = {
                get_data_source_health: 'act.sources.health',
                diagnose_data_source: 'act.sources.diagnose',
                copy_data_source_health: 'act.sources.copy',
                toggle_data_source_health: 'ui.menu_action'
            };
            var payload = name === 'toggle_data_source_health' ? { action: 'toggle_data_source_health' } : { args: args || [] };
            return window.bridge.cmd(cmdMap[name] || ('act.sources.' + name), payload).then(parseResult);
        }
        return Promise.resolve({ ok: false, status: 'missing', errors: ['Data source API unavailable'] });
    }

    function showToast(message) {
        toast.textContent = String(message || '');
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('visible'); }, 1800);
    }

    function badge(label, cls) {
        return '<span class="badge ' + (cls || '') + '">' + esc(label) + '</span>';
    }

    function statusClass(source) {
        if (!source) return 'bad';
        if (source.running || source.alive || source.active || source.started || source.is_memory_active) return 'ok';
        if (source.error_msg || source.last_error) return 'bad';
        return 'warn';
    }

    function renderSource(key, source) {
        source = source || {};
        var cls = key === 'memory' ? 'card memory' : 'card';
        if (statusClass(source) === 'bad') cls += ' bad';
        var watcherHtml = '';
        var watchers = source.watchers || {};
        Object.keys(watchers).forEach(function (name) {
            watcherHtml += badge(name + ': ' + watchers[name], watchers[name] === 'memory_first' ? 'ok' : 'warn');
        });
        var selection = source.parser_adapter_selection || {};
        var parserId = selection.selected_id || source.parser_adapter_id || '-';
        var requestedParser = selection.requested_id || source.parser_adapter_requested_id || '-';
        var parserMode = selection.mode || source.parser_adapter_mode || '-';
        var parserFallback = selection.fallback_reason || source.parser_adapter_fallback_reason || '-';
        var self = source.self || {};
        var extra = self.uid ? '<pre>self uid=' + esc(self.uid) + ' hp=' + esc(self.hp) + '/' + esc(self.max_hp) + ' name=' + esc(self.name || '') + '</pre>' : '';
        return '<article class="' + cls + '">' +
            '<div class="card-top"><div><div class="name">' + esc(key.toUpperCase()) + '</div><div class="sub">' + esc(source.data_source || source.mode || '-') + '</div></div>' +
            '<div>' + badge(source.running || source.alive ? 'ACTIVE' : 'IDLE', statusClass(source)) + '</div></div>' +
            '<div class="grid">' +
            '<div>Status: <span>' + esc(source.status || source.mode || '-') + '</span></div>' +
            '<div>Running: <span>' + esc(!!source.running) + '</span></div>' +
            '<div>Alive: <span>' + esc(!!source.alive) + '</span></div>' +
            '<div>Error: <span>' + esc(source.error_msg || source.last_error || '-') + '</span></div>' +
            '<div>Requested: <span>' + esc(source.requested_mode || '-') + '</span></div>' +
            '<div>Uptime: <span>' + esc(source.uptime_s || 0) + 's</span></div>' +
            '<div>Parser: <span>' + esc(parserId) + '</span></div>' +
            '<div>Parser mode: <span>' + esc(parserMode) + '</span></div>' +
            '<div>Parser requested: <span>' + esc(requestedParser) + '</span></div>' +
            '<div>Parser fallback: <span>' + esc(parserFallback) + '</span></div>' +
            '</div>' +
            (watcherHtml ? '<div class="watchers">' + watcherHtml + '</div>' : '') + extra +
            '</article>';
    }

    function renderDiagnostics(payload) {
        var items = payload.diagnostics || [];
        var errs = payload.errors || [];
        if (!items.length && errs.length) {
            items = errs.map(function (err) { return { level: 'error', message: err }; });
        }
        if (!items.length) {
            diagList.innerHTML = '<div class="diag-item">No diagnostics. Click Diagnose for details.</div>';
            return;
        }
        diagList.innerHTML = items.map(function (item) {
            var level = String(item.level || 'info').toLowerCase();
            var cls = level === 'error' ? 'error' : (level === 'warn' ? 'warn' : '');
            return '<div class="diag-item ' + cls + '"><strong>' + esc(level.toUpperCase()) + '</strong><br/>' + esc(item.message || '') + '</div>';
        }).join('');
    }

    function render(payload) {
        payload = payload || {};
        lastPayload = payload;
        var sources = payload.sources || {};
        var summary = sources.summary || {};
        var status = payload.status || (payload.ok ? 'running' : 'error');
        statusPill.textContent = String(status || '--').toUpperCase();
        statusPill.style.color = status === 'running' ? 'var(--ok)' : (status === 'error' || status === 'missing' ? 'var(--bad)' : 'var(--warn)');
        document.getElementById('sum-status').textContent = status;
        document.getElementById('sum-mode').textContent = payload.requested_mode || '--';
        document.getElementById('sum-source').textContent = summary.data_source || '--';
        document.getElementById('sum-latency').textContent = (payload.latency_ms || 0) + ' ms';
        document.getElementById('sum-event').textContent = (payload.last_event_ms || 0) + ' ms';
        document.getElementById('sum-errors').textContent = String((payload.errors || []).length);
        var cards = [];
        if (sources.packet) cards.push(renderSource('packet', sources.packet));
        if (sources.memory) cards.push(renderSource('memory', sources.memory));
        if (!cards.length) cards.push('<div class="empty">没有可用的数据源。<br/>Start recognition to initialize PacketBridge.</div>');
        list.innerHTML = cards.join('');
        renderDiagnostics(payload);
    }

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        var area = document.createElement('textarea');
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        document.body.removeChild(area);
        return Promise.resolve();
    }

    window.DataSourceHealth = {
        refresh: function () {
            return apiCall('get_data_source_health').then(function (payload) {
                render(payload);
                return payload;
            }).catch(function (err) {
                render({ ok: false, status: 'error', errors: [String(err)] });
            });
        },
        diagnose: function () {
            return apiCall('diagnose_data_source').then(function (payload) {
                render(payload);
                showToast('诊断完成 Diagnose complete');
                return payload;
            });
        },
        copy: function () {
            var text = JSON.stringify(lastPayload || {}, null, 2);
            return apiCall('copy_data_source_health').then(function (payload) {
                if (payload && payload.text) text = payload.text;
                return copyText(text).then(function () { showToast('已复制健康快照'); });
            }).catch(function () {
                return copyText(text).then(function () { showToast('已复制健康快照'); });
            });
        },
        close: function () { apiCall('toggle_data_source_health'); },
        fadeIn: function () { shell.classList.add('visible'); },
        fadeOut: function () { shell.classList.remove('visible'); }
    };

    setTimeout(function () {
        shell.classList.add('visible');
        window.DataSourceHealth.refresh();
    }, 40);
})();
</script>
</body>
</html>
