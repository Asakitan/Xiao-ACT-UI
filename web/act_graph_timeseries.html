<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAO ACT Graph Timeseries</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      color: #dffaff;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    body { padding: 18px; opacity: 0; transition: opacity 180ms ease; }
    body.visible { opacity: 1; }
    .panel {
      width: min(100%, 980px);
      min-height: 520px;
      border: 1px solid rgba(52, 232, 255, 0.58);
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
      background:
        linear-gradient(135deg, rgba(4, 17, 30, 0.92), rgba(7, 42, 60, 0.80)),
        repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 4px);
      box-shadow: 0 0 28px rgba(0, 210, 255, 0.38), inset 0 0 28px rgba(0, 210, 255, 0.12);
      padding: 18px;
      position: relative;
    }
    .panel::before, .panel::after {
      content: "";
      position: absolute;
      height: 2px;
      left: 22px;
      right: 22px;
      background: linear-gradient(90deg, transparent, #48efff, #f9b44a, transparent);
      opacity: 0.8;
    }
    .panel::before { top: 8px; }
    .panel::after { bottom: 8px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-shadow: 0 0 10px rgba(72, 239, 255, 0.88);
    }
    .sub { color: rgba(223,250,255,0.66); font-size: 12px; margin-top: 4px; }
    .controls {
      display: grid;
      grid-template-columns: 132px 132px 1fr 104px 86px 86px;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }
    select, input, button {
      border: 1px solid rgba(72, 239, 255, 0.45);
      background: rgba(2, 18, 32, 0.74);
      color: #e8fdff;
      border-radius: 4px;
      padding: 8px 10px;
      outline: none;
      font-size: 12px;
    }
    input::placeholder { color: rgba(223,250,255,0.42); }
    button {
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 120ms ease;
    }
    button:hover { border-color: #f9b44a; box-shadow: 0 0 14px rgba(249,180,74,0.28); }
    .layout {
      display: grid;
      grid-template-columns: 1fr 210px;
      gap: 14px;
    }
    .chart-wrap {
      border: 1px solid rgba(72, 239, 255, 0.25);
      background: rgba(0, 7, 16, 0.48);
      min-height: 342px;
      position: relative;
      overflow: hidden;
    }
    canvas { width: 100%; height: 342px; display: block; }
    .chart-title {
      position: absolute;
      top: 10px;
      left: 14px;
      color: rgba(223,250,255,0.82);
      font-size: 12px;
      pointer-events: none;
    }
    .summary {
      border: 1px solid rgba(72, 239, 255, 0.22);
      background: rgba(0, 11, 20, 0.45);
      padding: 12px;
      min-height: 342px;
    }
    .stat { margin-bottom: 12px; }
    .stat .label { color: rgba(223,250,255,0.56); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .stat .value { font-size: 18px; color: #fff7d6; text-shadow: 0 0 8px rgba(249,180,74,0.35); margin-top: 2px; word-break: break-word; }
    .legend { display: grid; gap: 8px; margin-top: 12px; }
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(223,250,255,0.74); }
    .swatch { width: 18px; height: 3px; border-radius: 8px; }
    .table {
      margin-top: 12px;
      max-height: 110px;
      overflow: hidden;
      display: grid;
      gap: 4px;
      font-size: 11px;
      color: rgba(223,250,255,0.72);
    }
    .row { display: grid; grid-template-columns: 72px 1fr 82px; gap: 8px; border-top: 1px solid rgba(72,239,255,0.12); padding-top: 4px; }
    .status { margin-top: 10px; color: rgba(223,250,255,0.52); font-size: 11px; }
    .close { width: 34px; height: 34px; padding: 0; border-radius: 50%; font-size: 16px; }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .layout { grid-template-columns: 1fr; }
      .summary { min-height: auto; }
    }
  </style>
</head>
<body>
  <section class="panel">
    <header>
      <div>
        <h1>ACT GRAPH / TIMESERIES</h1>
        <div class="sub" id="encounter">encounter: pending</div>
      </div>
      <button class="close" onclick="GraphTimeseries.close()">×</button>
    </header>
    <div class="controls">
      <select id="metric" onchange="GraphTimeseries.selectMetric()">
        <option value="damage">Damage</option>
        <option value="heal">Heal</option>
        <option value="event_count">Events</option>
        <option value="boss_hp_pct">Boss HP %</option>
      </select>
      <select id="topic" onchange="GraphTimeseries.filter()">
        <option value="">All topics</option>
        <option value="damage">damage</option>
        <option value="heal">heal</option>
        <option value="boss">boss</option>
        <option value="skill">skill</option>
      </select>
      <input id="query" placeholder="Filter text" onkeydown="if(event.key==='Enter') GraphTimeseries.filter()" />
      <select id="zoom" onchange="GraphTimeseries.zoom()">
        <option value="0">All range</option>
        <option value="5000">5s</option>
        <option value="15000">15s</option>
        <option value="30000">30s</option>
        <option value="60000">60s</option>
      </select>
      <button onclick="GraphTimeseries.refresh()">Refresh</button>
      <button onclick="GraphTimeseries.exportJson()">Export</button>
    </div>
    <div class="layout">
      <div class="chart-wrap">
        <div class="chart-title" id="chartTitle">Damage</div>
        <canvas id="chart" width="720" height="342"></canvas>
      </div>
      <aside class="summary">
        <div class="stat"><div class="label">Metric</div><div class="value" id="metricName">damage</div></div>
        <div class="stat"><div class="label">Latest</div><div class="value" id="latestValue">0</div></div>
        <div class="stat"><div class="label">Points</div><div class="value" id="pointCount">0</div></div>
        <div class="stat"><div class="label">Range</div><div class="value" id="rangeValue">0ms</div></div>
        <div class="legend" id="legend"></div>
      </aside>
    </div>
    <div class="table" id="points"></div>
    <div class="status" id="status">Waiting for ACT data…</div>
  </section>

  <script src="pywebview-shim.js"></script>
  <script>
    const colors = { damage: '#f9b44a', heal: '#67ffc2', event_count: '#48efff', boss_hp_pct: '#ff5f8f' };
    function parseMaybeJson(value) {
      if (typeof value === 'string') {
        try { return JSON.parse(value); } catch (_) { return {}; }
      }
      return value || {};
    }
    async function callApi(name, fallbackAction, ...args) {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[name] === 'function') {
        return parseMaybeJson(await window.pywebview.api[name](...args));
      }
      if (window.bridge && typeof window.bridge.cmd === 'function') {
        return parseMaybeJson(await window.bridge.cmd(fallbackAction, args));
      }
      return {};
    }
    function fmt(value) {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return String(value || '0');
      if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(2) + 'm';
      if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1) + 'k';
      return n.toFixed(n % 1 ? 2 : 0);
    }
    function drawChart(status) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = rect.width, h = rect.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(0, 10, 20, 0.35)';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(72,239,255,0.10)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 6; i++) {
        const y = 34 + (h - 58) * i / 6;
        ctx.beginPath(); ctx.moveTo(42, y); ctx.lineTo(w - 18, y); ctx.stroke();
      }
      const metric = status.selected_metric || 'damage';
      const points = (((status.series || {})[metric] || {}).points || []);
      if (!points.length) {
        ctx.fillStyle = 'rgba(223,250,255,0.55)';
        ctx.font = '14px Microsoft YaHei, sans-serif';
        ctx.fillText('No timeseries data', 48, h / 2);
        return;
      }
      const minT = Math.min(...points.map(p => Number(p.time_ms || 0)));
      const maxT = Math.max(...points.map(p => Number(p.time_ms || 0)));
      const maxV = Math.max(1, ...points.map(p => Number(p.value || 0)));
      const minV = metric === 'boss_hp_pct' ? 0 : Math.min(0, ...points.map(p => Number(p.value || 0)));
      const plot = { l: 42, t: 28, r: w - 18, b: h - 30 };
      const xOf = p => plot.l + ((Number(p.time_ms || 0) - minT) / Math.max(1, maxT - minT)) * (plot.r - plot.l);
      const yOf = p => plot.b - ((Number(p.value || 0) - minV) / Math.max(1, maxV - minV)) * (plot.b - plot.t);
      ctx.strokeStyle = colors[metric] || '#48efff';
      ctx.lineWidth = 2;
      ctx.shadowColor = colors[metric] || '#48efff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      points.forEach((p, idx) => { const x = xOf(p), y = yOf(p); idx ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = colors[metric] || '#48efff';
      points.slice(-18).forEach(p => { ctx.beginPath(); ctx.arc(xOf(p), yOf(p), 2.4, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = 'rgba(223,250,255,0.55)';
      ctx.font = '11px Microsoft YaHei, sans-serif';
      ctx.fillText(fmt(maxV), 8, plot.t + 5);
      ctx.fillText(fmt(minV), 8, plot.b);
    }
    window.GraphTimeseries = {
      last: null,
      fadeIn() { document.body.classList.add('visible'); },
      fadeOut() { document.body.classList.remove('visible'); },
      async refresh() {
        const metric = document.getElementById('metric').value;
        const topic = document.getElementById('topic').value;
        const query = document.getElementById('query').value;
        const zoom = Number(document.getElementById('zoom').value || 0);
        const status = await callApi('get_graph_timeseries_status', 'act.graph.status', metric, 120, query, topic, zoom);
        this.render(status);
      },
      async selectMetric() {
        const metric = document.getElementById('metric').value;
        const status = await callApi('select_graph_metric', 'act.graph.select_metric', metric, 120);
        this.render(status);
      },
      async zoom() {
        const zoom = Number(document.getElementById('zoom').value || 0);
        const status = await callApi('zoom_graph_timeseries', 'act.graph.zoom', zoom, 120);
        this.render(status);
      },
      async filter() {
        const query = document.getElementById('query').value;
        const topic = document.getElementById('topic').value;
        const status = await callApi('filter_graph_timeseries', 'act.graph.filter', query, topic, 120);
        this.render(status);
      },
      async exportJson() {
        const metric = document.getElementById('metric').value;
        const query = document.getElementById('query').value;
        const topic = document.getElementById('topic').value;
        const exported = await callApi('export_graph_timeseries', 'act.graph.export', metric, 120, query, topic);
        const text = exported.text || JSON.stringify(exported, null, 2);
        try { await navigator.clipboard.writeText(text); } catch (_) {}
        document.getElementById('status').textContent = 'Exported graph JSON (' + text.length + ' chars)';
      },
      async close() {
        this.fadeOut();
        await callApi('toggle_graph_timeseries', 'ui.menu_action', 'toggle_graph_timeseries');
      },
      render(status) {
        status = status || {};
        this.last = status;
        const metric = status.selected_metric || document.getElementById('metric').value || 'damage';
        const metricDef = (status.metrics || []).find(m => m.id === metric) || { label: metric };
        const points = (((status.series || {})[metric] || {}).points || []);
        const latest = points.length ? points[points.length - 1].value : 0;
        document.getElementById('metric').value = metric;
        document.getElementById('encounter').textContent = 'encounter: ' + (status.encounter_id || 'unknown');
        document.getElementById('chartTitle').textContent = metricDef.label || metric;
        document.getElementById('metricName').textContent = metric;
        document.getElementById('latestValue').textContent = fmt(latest);
        document.getElementById('pointCount').textContent = String(points.length || 0);
        document.getElementById('rangeValue').textContent = String(status.time_range_ms || 0) + 'ms';
        document.getElementById('status').textContent = status.message || 'OK';
        document.getElementById('legend').innerHTML = (status.metrics || []).map(m => '<div class="legend-row"><span class="swatch" style="background:' + (colors[m.id] || '#48efff') + '"></span><span>' + (m.label || m.id) + '</span></div>').join('');
        document.getElementById('points').innerHTML = points.slice(-6).reverse().map(p => '<div class="row"><span>' + (p.time_ms || 0) + 'ms</span><span>' + (p.topic || '') + '</span><span>' + fmt(p.value) + '</span></div>').join('');
        drawChart(status);
      }
    };
    window.addEventListener('resize', () => GraphTimeseries.last && drawChart(GraphTimeseries.last));
    window.addEventListener('load', () => { GraphTimeseries.fadeIn(); GraphTimeseries.refresh(); });
  </script>
</body>
</html>
