<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAO ACT Graph Timeseries</title>
  <style>
    /* ─────────────────────────────────────────────────────────────────────────
       Panel-scoped tokens: LAYOUT/SIZING only. ALL colors come from the shared
       act_panel_theme.css var(--act-*) tokens (the shared .panel/.header/.summary/
       .chart-wrap/.row/.close rules drive chrome, edges, text, accents) so
       light/dark follow the host theme and stay 1:1 with the flat Tk reference.
       Canvas strokes read the same tokens at draw time via getComputedStyle.
       ───────────────────────────────────────────────────────────────────────── */
    :root {
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
      --r-sm: 4px; --r-md: 6px;
      --fs-meta: 11px; --fs-body: 12px; --fs-title: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; user-select: none; }
    body { opacity: 0; transition: opacity 180ms ease; }
    body.visible { opacity: 1; }
    /* .panel: shared theme paints flat chrome (border, corner brackets, bg). Layout only here. */
    .panel { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
    h1 { margin: 0; font-size: var(--fs-title); letter-spacing: 0.12em; color: var(--act-text); }
    .sub { color: var(--act-muted); font-size: var(--fs-body); margin-top: var(--sp-1); }
    .controls {
      display: grid;
      grid-template-columns: 132px 132px 1fr 104px 86px 86px;
      gap: var(--sp-2);
      align-items: center;
      margin-bottom: var(--sp-3);
    }
    select, input, button { padding: 8px 10px; outline: none; font-size: var(--fs-body); }
    button { cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; }
    .layout { display: grid; grid-template-columns: 1fr 210px; gap: var(--sp-4); }
    /* .chart-wrap / .summary: shared theme paints border + bg. Sizing only here. */
    .chart-wrap { position: relative; min-height: 342px; overflow: hidden; padding: var(--sp-1); }
    canvas { width: 100%; height: 342px; display: block; }
    .chart-title { position: absolute; top: 10px; left: 14px; color: var(--act-muted); font-size: var(--fs-body); pointer-events: none; }
    .summary { padding: var(--sp-3); min-height: 342px; }
    .stat { margin-bottom: var(--sp-3); }
    .stat .label { color: var(--act-muted); font-size: var(--fs-meta); text-transform: uppercase; letter-spacing: 0.08em; }
    .stat .value { font-size: var(--fs-title); color: var(--act-gold); margin-top: 2px; word-break: break-word; }
    .legend { display: grid; gap: var(--sp-2); margin-top: var(--sp-3); }
    .legend-row { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-body); color: var(--act-muted); }
    .swatch { width: 18px; height: 3px; border-radius: 8px; }
    .table {
      margin-top: var(--sp-3);
      max-height: 152px;
      overflow: auto;
      display: grid;
      gap: var(--sp-1);
      font-size: var(--fs-meta);
      color: var(--act-muted);
    }
    .row { display: grid; grid-template-columns: 78px 1fr 82px; gap: var(--sp-2); border-top: 1px solid var(--act-edge-soft); padding-top: var(--sp-1); cursor: pointer; }
    .row:hover { background: color-mix(in srgb, var(--act-cyan) 10%, transparent); }
    .status { margin-top: 10px; color: var(--act-muted); font-size: var(--fs-meta); }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .layout { grid-template-columns: 1fr; }
      .summary { min-height: auto; }
    }
  </style>
  <link rel="stylesheet" href="act_panel_theme.css" />
  <style>
  /* Flat override (ACT panel only): kill shared decorative chrome + flatten per-page accents to a single 3px left rail. */
  .shell,.panel,.plugin-shell{border:1px solid var(--act-edge)!important;border-radius:4px!important;background:var(--act-shell-bg)!important;box-shadow:none!important;}
  .shell::before,.shell::after,.panel::before,.panel::after,.plugin-shell::before,.plugin-shell::after{display:none!important;content:none!important;}
  .header,.plugin-header,header{background:var(--act-shell-bg-2)!important;border-bottom:1px solid var(--act-edge-soft)!important;}
  button,input,select,.action-btn{clip-path:none!important;border-radius:3px!important;box-shadow:none!important;}
  button:hover,.action-btn:hover{box-shadow:none!important;transform:none!important;background:var(--act-card-bg-2)!important;}
  .main,.list,.plugin-list,.side,.side-panel,.section,.summary,.chart-wrap,.preview{box-shadow:none!important;}
  .bar{background:var(--act-gold)!important;}.skill-row.heal .bar{background:var(--act-ok)!important;}
  .pill,.badge,.status-pill{background:transparent!important;}
  .aca-tile::before,.metric::before,.group-card::before{content:none!important;display:none!important;}
  .aca-tile{border-left:3px solid var(--acc,var(--act-cyan))!important;}
  .metric{border-left:3px solid var(--act-cyan)!important;}
  .group-card{border-left:3px solid var(--act-gold)!important;}
  .aca-fill{box-shadow:none!important;}
  .aca-row.zebra{background:var(--act-card-bg-2)!important;}
  .aca-badge,.aca-sec-badge{background:transparent!important;border-radius:3px!important;}
  .group-head:hover{background:var(--act-card-bg-2)!important;}
  .death td{box-shadow:none!important;background:transparent!important;border-left:3px solid var(--act-danger)!important;}
  </style>
  <script src="act_panel_theme.js"></script>
  <script src="act_panel_util.js"></script>
</head>
<body>
  <section class="panel">
    <header>
      <div>
        <h1>ACT GRAPH / TIMESERIES</h1>
        <div class="sub" id="encounter">encounter: pending</div>
      </div>
      <button class="close" onclick="GraphTimeseries.close()">×</button>
    </header>
    <div class="controls">
      <select id="metric" onchange="GraphTimeseries.selectMetric()">
        <option value="damage">Damage</option>
        <option value="heal">Heal</option>
        <option value="event_count">Events</option>
        <option value="boss_hp_pct">Boss HP %</option>
      </select>
      <select id="topic" onchange="GraphTimeseries.filter()">
        <option value="">All topics</option>
        <option value="damage">damage</option>
        <option value="heal">heal</option>
        <option value="boss">boss</option>
        <option value="skill">skill</option>
      </select>
      <input id="query" placeholder="Filter text" onkeydown="if(event.key==='Enter') GraphTimeseries.filter()" />
      <select id="zoom" onchange="GraphTimeseries.zoom()">
        <option value="0">All range</option>
        <option value="5000">5s</option>
        <option value="15000">15s</option>
        <option value="30000">30s</option>
        <option value="60000">60s</option>
      </select>
      <button onclick="GraphTimeseries.refresh()">Refresh</button>
      <button onclick="GraphTimeseries.exportJson()">Export</button>
    </div>
    <div class="layout">
      <div class="chart-wrap">
        <div class="chart-title" id="chartTitle">Damage</div>
        <canvas id="chart" width="720" height="342"></canvas>
      </div>
      <aside class="summary">
        <div class="stat"><div class="label">Metric</div><div class="value" id="metricName">damage</div></div>
        <div class="stat"><div class="label">Latest</div><div class="value" id="latestValue">0</div></div>
        <div class="stat"><div class="label">Points</div><div class="value" id="pointCount">0</div></div>
        <div class="stat"><div class="label">Range</div><div class="value" id="rangeValue">0ms</div></div>
        <div class="legend" id="legend"></div>
      </aside>
    </div>
    <div class="table" id="points"></div>
    <div class="status" id="status">Waiting for ACT data…</div>
  </section>

  <script src="pywebview-shim.js"></script>
  <script>
    // Metric -> shared theme token. Resolved to a concrete color at draw time via
    // getComputedStyle so canvas strokes follow the host light/dark theme (the
    // shared --act-* tokens flip on theme change). gold=damage, ok=heal,
    // cyan=event_count, danger=boss_hp_pct — 1:1 with the Tk accent mapping.
    const metricVars = { damage: '--act-gold', heal: '--act-ok', event_count: '--act-cyan', boss_hp_pct: '--act-danger' };
    function cssVar(name, fallback) {
      try {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return v || fallback;
      } catch (_) { return fallback; }
    }
    function metricColor(metric) { return cssVar(metricVars[metric] || '--act-cyan', '#48efff'); }
    function parseMaybeJson(value) {
      if (typeof value === 'string') {
        try { return JSON.parse(value); } catch (_) { return {}; }
      }
      return value || {};
    }
    async function callApi(name, fallbackAction, ...args) {
      if (window.pywebview && window.pywebview.api && typeof window.pywebview.api[name] === 'function') {
        return parseMaybeJson(await window.pywebview.api[name](...args));
      }
      if (window.bridge && typeof window.bridge.cmd === 'function') {
        return parseMaybeJson(await window.bridge.cmd(fallbackAction, fallbackPayload(fallbackAction, args)));
      }
      return {};
    }
    function fallbackPayload(action, args) {
      args = args || [];
      if (action === 'act.graph.status') return { metric: String(args[0] || ''), limit: args[1] || 120, query: String(args[2] || ''), topic: String(args[3] || ''), time_range_ms: args[4] || 0 };
      if (action === 'act.graph.select_metric') return { metric: String(args[0] || 'damage'), limit: args[1] || 120 };
      if (action === 'act.graph.zoom') return { time_range_ms: args[0] || 0, limit: args[1] || 120 };
      if (action === 'act.graph.filter') return { query: String(args[0] || ''), topic: String(args[1] || ''), limit: args[2] || 120 };
      if (action === 'act.graph.export') return { metric: String(args[0] || ''), limit: args[1] || 120, query: String(args[2] || ''), topic: String(args[3] || '') };
      if (action === 'act.action_log.jump_to_time') return { cursor_ms: args[0] || 0, limit: 80, source: String(args[1] || 'live'), encounter_id: String(args[2] || ''), offset: 0 };
      if (action === 'ui.menu_action') return { action: String(args[0] || '') };
      return { args: args };
    }
    function fmt(value) {
      const n = Number(value || 0);
      if (!Number.isFinite(n)) return String(value || '0');
      if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(2) + 'm';
      if (Math.abs(n) >= 1000) return (n / 1000).toFixed(1) + 'k';
      return n.toFixed(n % 1 ? 2 : 0);
    }
    function drawChart(status) {
      const canvas = document.getElementById('chart');
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const w = rect.width, h = rect.height;
      // Resolve shared theme tokens once per draw (cheap; flips with host theme).
      const edgeSoft = cssVar('--act-edge-soft', 'rgba(72,239,255,0.10)');
      const muted = cssVar('--act-muted', 'rgba(223,250,255,0.55)');
      ctx.clearRect(0, 0, w, h);
      // No opaque chart fill: let the shared flat .chart-wrap background show through.
      ctx.strokeStyle = edgeSoft;
      ctx.lineWidth = 1;
      for (let i = 0; i <= 6; i++) {
        const y = 34 + (h - 58) * i / 6;
        ctx.beginPath(); ctx.moveTo(42, y); ctx.lineTo(w - 18, y); ctx.stroke();
      }
      const metric = status.selected_metric || 'damage';
      const stroke = metricColor(metric);
      const points = (((status.series || {})[metric] || {}).points || []);
      if (!points.length) {
        ctx.fillStyle = muted;
        ctx.font = '14px Microsoft YaHei, sans-serif';
        ctx.fillText('No timeseries data', 48, h / 2);
        return;
      }
      const minT = Math.min(...points.map(p => Number(p.time_ms || 0)));
      const maxT = Math.max(...points.map(p => Number(p.time_ms || 0)));
      const maxV = Math.max(1, ...points.map(p => Number(p.value || 0)));
      const minV = metric === 'boss_hp_pct' ? 0 : Math.min(0, ...points.map(p => Number(p.value || 0)));
      const plot = { l: 42, t: 28, r: w - 18, b: h - 30 };
      const xOf = p => plot.l + ((Number(p.time_ms || 0) - minT) / Math.max(1, maxT - minT)) * (plot.r - plot.l);
      const yOf = p => plot.b - ((Number(p.value || 0) - minV) / Math.max(1, maxV - minV)) * (plot.b - plot.t);
      // Flat line, no neon shadow glow (matches the flat Tk reference).
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.beginPath();
      points.forEach((p, idx) => { const x = xOf(p), y = yOf(p); idx ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
      ctx.fillStyle = stroke;
      points.slice(-18).forEach(p => { ctx.beginPath(); ctx.arc(xOf(p), yOf(p), 2.4, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = muted;
      ctx.font = '11px Microsoft YaHei, sans-serif';
      ctx.fillText(fmt(maxV), 8, plot.t + 5);
      ctx.fillText(fmt(minV), 8, plot.b);
    }
    window.GraphTimeseries = {
      last: null,
      fadeIn() { document.body.classList.add('visible'); },
      fadeOut() { document.body.classList.remove('visible'); },
      async refresh() {
        const metric = document.getElementById('metric').value;
        const topic = document.getElementById('topic').value;
        const query = document.getElementById('query').value;
        const zoom = Number(document.getElementById('zoom').value || 0);
        const status = await callApi('get_graph_timeseries_status', 'act.graph.status', metric, 120, query, topic, zoom);
        this.render(status);
      },
      async selectMetric() {
        const metric = document.getElementById('metric').value;
        const status = await callApi('select_graph_metric', 'act.graph.select_metric', metric, 120);
        this.render(status);
      },
      async zoom() {
        const zoom = Number(document.getElementById('zoom').value || 0);
        const status = await callApi('zoom_graph_timeseries', 'act.graph.zoom', zoom, 120);
        this.render(status);
      },
      async filter() {
        const query = document.getElementById('query').value;
        const topic = document.getElementById('topic').value;
        const status = await callApi('filter_graph_timeseries', 'act.graph.filter', query, topic, 120);
        this.render(status);
      },
      async exportJson() {
        const metric = document.getElementById('metric').value;
        const query = document.getElementById('query').value;
        const topic = document.getElementById('topic').value;
        const exported = await callApi('export_graph_timeseries', 'act.graph.export', metric, 120, query, topic);
        const text = exported.text || JSON.stringify(exported, null, 2);
        try { await navigator.clipboard.writeText(text); } catch (_) {}
        document.getElementById('status').textContent = 'Exported graph JSON (' + text.length + ' chars)';
      },
      async close() {
        this.fadeOut();
        await callApi('toggle_graph_timeseries', 'ui.menu_action', 'toggle_graph_timeseries');
      },
      async openLog(ms, topic) {
        await callApi('show_action_log_at', 'act.action_log.jump_to_time', Number(ms) || 0, 'live', '');
        document.getElementById('status').textContent = 'Action Log @ ' + ActTime.fmtClock(ms);
      },
      render(status) {
        status = status || {};
        this.last = status;
        const metric = status.selected_metric || document.getElementById('metric').value || 'damage';
        const metricDef = (status.metrics || []).find(m => m.id === metric) || { label: metric };
        const points = (((status.series || {})[metric] || {}).points || []);
        const latest = points.length ? points[points.length - 1].value : 0;
        document.getElementById('metric').value = metric;
        document.getElementById('encounter').textContent = 'encounter: ' + (status.encounter_id || 'unknown');
        document.getElementById('chartTitle').textContent = metricDef.label || metric;
        document.getElementById('metricName').textContent = metric;
        document.getElementById('latestValue').textContent = fmt(latest);
        document.getElementById('pointCount').textContent = String(points.length || 0);
        document.getElementById('rangeValue').textContent = ActTime.fmtDur(status.time_range_ms);
        document.getElementById('status').textContent = status.message || 'OK';
        document.getElementById('legend').innerHTML = (status.metrics || []).map(m => '<div class="legend-row"><span class="swatch" style="background:var(' + (metricVars[m.id] || '--act-cyan') + ')"></span><span>' + (m.label || m.id) + '</span></div>').join('');
        const t0 = points.length ? Math.min.apply(null, points.map(p => Number(p.time_ms || 0))) : 0;
        document.getElementById('points').innerHTML = points.slice(-6).reverse().map(p => {
          const ms = Number(p.time_ms || 0);
          return '<div class="row" title="' + ActTime.fmtRel(ms, t0) + '" onclick="GraphTimeseries.openLog(' + ms + ",'" + (p.topic || '') + "')\"><span>" + ActTime.fmtClock(ms) + '</span><span>' + (p.topic || '') + '</span><span>' + fmt(p.value) + '</span></div>';
        }).join('');
        drawChart(status);
      }
    };
    window.addEventListener('resize', () => GraphTimeseries.last && drawChart(GraphTimeseries.last));
    // Redraw canvas when the host pushes a theme change: act_panel_theme.js flips
    // data-act-theme / theme-* classes on <html>, which re-resolves the --act-*
    // tokens our strokes read. Observe that attribute and re-stroke the chart.
    try {
      new MutationObserver(() => { if (GraphTimeseries.last) drawChart(GraphTimeseries.last); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ['data-act-theme', 'class', 'style'] });
    } catch (_) {}
    window.addEventListener('load', () => { GraphTimeseries.fadeIn(); GraphTimeseries.refresh(); });
  </script>
</body>
</html>
