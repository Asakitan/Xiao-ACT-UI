<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
    font-family: 'sao';
    src: url('fonts/SAOUI.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
}

@font-face {
    font-family: 'saoLatin';
    src: url('fonts/SAOUI.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
    unicode-range: U+0000-00FF, U+0100-024F, U+1E00-1EFF, U+2000-206F, U+20A0-20CF;
}

@font-face {
    font-family: 'yuanJWDCJK';
    src: url('fonts/ZhuZiAYuanJWD.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
    unicode-range: U+2E80-2EFF, U+3000-303F, U+31C0-31EF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
}

:root {
    --font-ui: 'saoLatin', 'sao', 'yuanJWDCJK', 'Segoe UI', sans-serif;
    --row-bg: rgba(10, 14, 22, 0.66);
    --row-topline: rgba(104, 228, 255, 0.51);
    --row-fg: rgb(244, 248, 255);
    --sec-gold: rgb(243, 175, 18);
    --sec-warn: rgb(255, 92, 74);
    --bar-bg: rgba(255, 255, 255, 0.16);
    --bar-warn: rgb(239, 84, 62);
}

html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

body {
    /* 纯覆盖层: 永不拦截游戏点击 */
    pointer-events: none;
}

#stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding-top: 2px;
}

.mech-row {
    pointer-events: none;
    position: relative;
    width: 560px;
    height: 64px;
    background: var(--row-bg);
    border-top: 2px solid var(--row-topline);
    overflow: hidden;
    opacity: 0;
    transform: translateY(-10px);
    animation: mech-in 0.22s ease-out forwards;
    will-change: opacity, transform;
}

.mech-row.out {
    animation: mech-out 0.30s ease-in forwards;
}

@keyframes mech-in {
    to { opacity: 1; transform: translateY(0); }
}
@keyframes mech-out {
    from { opacity: 1; }
    to { opacity: 0; transform: translateY(-8px); }
}

.mech-colorbar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
}

.mech-label {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-58%);
    max-width: 410px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-family: var(--font-ui);
    font-size: 20px;
    letter-spacing: 1.5px;
    color: var(--row-fg);
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
}

.mech-sec {
    position: absolute;
    right: 18px;
    top: 9px;
    font-family: var(--font-ui);
    font-size: 21px;
    letter-spacing: 0.5px;
    color: var(--sec-gold);
    text-shadow: 0 1px 6px rgba(0,0,0,0.7);
}

.mech-bar {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 7px;
    height: 5px;
    background: var(--bar-bg);
}

.mech-bar-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, rgb(104, 228, 255), rgb(243, 175, 18));
}

.mech-row.warn .mech-sec { color: var(--sec-warn); }
.mech-row.warn .mech-bar-fill { background: var(--bar-warn); }
.mech-row.warn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(220, 40, 30, 0.18);
    animation: mech-pulse 0.66s ease-in-out infinite alternate;
}
@keyframes mech-pulse {
    from { opacity: 0.55; }
    to { opacity: 1; }
}
</style>
</head>
<body>
    <div id="stack"></div>

<script>
(function () {
    var MAX_ROWS = 3;
    var STATIC_HOLD_MS = 2600;
    var stack = document.getElementById('stack');
    var rows = {};   // id -> {el, fill, sec, endsAt, totalMs, preWarnMs, showBar, raf}

    function esc(t) { return (t == null ? '' : String(t)); }

    function removeRow(id, animate) {
        var r = rows[id];
        if (!r) return;
        delete rows[id];
        if (r.raf) cancelAnimationFrame(r.raf);
        if (animate) {
            r.el.classList.add('out');
            setTimeout(function () {
                if (r.el.parentNode) r.el.parentNode.removeChild(r.el);
            }, 320);
        } else if (r.el.parentNode) {
            r.el.parentNode.removeChild(r.el);
        }
    }

    function tickRow(id) {
        var r = rows[id];
        if (!r) return;
        var remaining = r.endsAt - performance.now();
        if (remaining <= 0) {
            removeRow(id, true);
            return;
        }
        if (r.showBar) {
            var frac = Math.max(0, Math.min(1, remaining / r.totalMs));
            r.fill.style.width = (frac * 100).toFixed(1) + '%';
            r.sec.textContent = (remaining / 1000).toFixed(1) + 's';
            if (r.preWarnMs > 0 && remaining <= r.preWarnMs) {
                r.el.classList.add('warn');
            }
        }
        r.raf = requestAnimationFrame(function () { tickRow(id); });
    }

    function push(entryJson) {
        var e = entryJson;
        if (typeof entryJson === 'string') {
            try { e = JSON.parse(entryJson); } catch (err) { return; }
        }
        if (!e) return;
        var id = esc(e.id || e.mechanic_id) || ('r' + Date.now());
        var countdownMs = Number(e.countdown_ms != null ? e.countdown_ms
                                 : (e.countdown_s || 0) * 1000) || 0;
        var remainingMs = Number(e.remaining_ms != null ? e.remaining_ms
                                 : countdownMs) || 0;
        var preWarnMs = Number(e.pre_warn_ms != null ? e.pre_warn_ms
                               : (e.pre_warn_s || 0) * 1000) || 0;
        var showBar = countdownMs > 0;
        var totalMs = showBar ? countdownMs : STATIC_HOLD_MS;
        var holdMs = showBar ? remainingMs : STATIC_HOLD_MS;

        removeRow(id, false);   // 同机制重复点名: 原行重置
        var ids = Object.keys(rows);
        while (ids.length >= MAX_ROWS) {
            var oldest = ids.reduce(function (a, b) {
                return rows[a].createdAt <= rows[b].createdAt ? a : b;
            });
            removeRow(oldest, false);
            ids = Object.keys(rows);
        }

        var el = document.createElement('div');
        el.className = 'mech-row';
        var color = esc(e.color) || '#68e4ff';
        var label = esc(e.text || e.banner_text) || esc(e.name) || '机制';
        el.innerHTML =
            '<div class="mech-colorbar"></div>' +
            '<div class="mech-label"></div>' +
            '<div class="mech-sec"></div>' +
            (showBar ? '<div class="mech-bar"><div class="mech-bar-fill"></div></div>' : '');
        el.querySelector('.mech-colorbar').style.background = color;
        el.querySelector('.mech-label').textContent = label;
        stack.insertBefore(el, stack.firstChild);

        var r = {
            el: el,
            fill: el.querySelector('.mech-bar-fill'),
            sec: el.querySelector('.mech-sec'),
            endsAt: performance.now() + holdMs,
            totalMs: totalMs,
            preWarnMs: preWarnMs,
            showBar: showBar,
            createdAt: performance.now(),
            raf: 0
        };
        rows[id] = r;
        tickRow(id);
    }

    function dismiss(id) { removeRow(esc(id), true); }

    function clearAll() {
        Object.keys(rows).forEach(function (id) { removeRow(id, true); });
    }

    window.MechBanner = { push: push, dismiss: dismiss, clearAll: clearAll };
})();
</script>
<script>
// Theme initialization (与其它面板一致; 缺省 fallback=dark)
(function(){
    var panel='mech_banner', darkCls='theme-dark', fallback='dark';
    function apply(t){document.documentElement.classList.toggle(darkCls,t==='dark')}
    apply(fallback);
    try{
        if(window.pywebview&&window.pywebview.api){
            window.pywebview.api.get_panel_themes().then(function(themes){
                apply((themes&&themes[panel])||fallback);
            }).catch(function(){apply(fallback)});
        }
    }catch(e){}
    window._applyPanelTheme=function(t){apply(t)};
})();
</script>
</body>
</html>
