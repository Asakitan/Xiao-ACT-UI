<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@font-face {
    font-family: 'sao';
    src: url('fonts/SAOUI.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
}

@font-face {
    font-family: 'saoLatin';
    src: url('fonts/SAOUI.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
    unicode-range: U+0000-00FF, U+0100-024F, U+1E00-1EFF, U+2000-206F, U+20A0-20CF;
}

@font-face {
    font-family: 'yuanJWDCJK';
    src: url('fonts/ZhuZiAYuanJWD.ttf') format('truetype');
    font-style: normal;
    font-weight: 400;
    font-display: block;
    unicode-range: U+2E80-2EFF, U+3000-303F, U+31C0-31EF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF;
}

:root {
    --font-ui: 'saoLatin', 'sao', 'yuanJWDCJK', 'Segoe UI', sans-serif;
    --banner-fg: rgb(244, 248, 255);
    --banner-glow: rgba(104, 228, 255, 0.55);
    --banner-shadow: rgba(0, 0, 0, 0.72);
    --line-cyan: rgba(104, 228, 255, 0.95);
    --line-gold: rgba(243, 175, 18, 0.92);
}
.theme-dark {
    --banner-fg: rgb(238, 245, 255);
    --banner-glow: rgba(104, 228, 255, 0.50);
    --banner-shadow: rgba(0, 0, 0, 0.80);
}

html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    /* 纯覆盖层: 永不拦截游戏点击 */
    pointer-events: none;
}

.banner-shell {
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transform: scale(0.86) translateY(16px);
    will-change: opacity, transform;
}

body.show .banner-shell {
    animation: mapbanner-open 0.58s cubic-bezier(0.16, 0.84, 0.32, 1) forwards;
}

body.closing .banner-shell {
    animation: mapbanner-close 0.46s ease-in forwards;
}

.banner-text {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 52px;
    letter-spacing: 6px;
    line-height: 1.2;
    white-space: nowrap;
    color: var(--banner-fg);
    text-shadow:
        0 2px 10px var(--banner-shadow),
        0 0 22px var(--banner-glow),
        0 0 4px var(--banner-shadow);
}

/* 青→金→青 装饰下划线, 跟随文字宽度 */
.banner-rule {
    width: 0;
    height: 2px;
    background: linear-gradient(
        90deg,
        rgba(104, 228, 255, 0),
        var(--line-cyan) 18%,
        var(--line-gold) 50%,
        var(--line-cyan) 82%,
        rgba(104, 228, 255, 0)
    );
    box-shadow: 0 0 8px rgba(104, 228, 255, 0.45);
}

body.show .banner-rule {
    animation: mapbanner-rule 0.62s ease-out 0.10s forwards;
}

@keyframes mapbanner-open {
    0%   { opacity: 0; transform: scale(0.86) translateY(16px); }
    60%  { opacity: 1; transform: scale(1.03) translateY(0); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes mapbanner-close {
    0%   { opacity: 1; transform: scale(1) translateY(0); }
    100% { opacity: 0; transform: scale(1.04) translateY(-14px); }
}

@keyframes mapbanner-rule {
    0%   { width: 0; }
    100% { width: 116%; }
}
</style>
</head>
<body>
    <div class="banner-shell">
        <div class="banner-text" id="banner-text">地图名称</div>
        <div class="banner-rule"></div>
    </div>

<script>
let _bannerShowing = false;
let _bannerLastText = '';

function showBanner(text) {
    var t = (text == null ? '' : String(text)).trim();
    if (!t) return;
    document.getElementById('banner-text').textContent = t;
    // 同名横幅仍在屏幕上时不重播动画, 防止抓包重复推送导致闪烁
    if (_bannerShowing && t === _bannerLastText
            && !document.body.classList.contains('closing')) {
        return;
    }
    _bannerLastText = t;
    _bannerShowing = true;
    document.body.classList.remove('closing');
    document.body.classList.remove('show');
    void document.body.offsetWidth;  // 强制重排, 重播淡入
    document.body.classList.add('show');
}

function beginClose() {
    if (!document.body.classList.contains('show')) return;
    _bannerShowing = false;
    _bannerLastText = '';
    document.body.classList.add('closing');
}

window.MapBanner = {
    showBanner: showBanner,
    beginClose: beginClose
};
</script>
<script>
// Theme initialization (与其它面板一致; 缺省 fallback=dark)
(function(){
    var panel='mapbanner', darkCls='theme-dark', fallback='dark';
    function apply(t){document.documentElement.classList.toggle(darkCls,t==='dark')}
    apply(fallback);
    try{
        if(window.pywebview&&window.pywebview.api){
            window.pywebview.api.get_panel_themes().then(function(themes){
                apply((themes&&themes[panel])||fallback);
            }).catch(function(){apply(fallback)});
        }
    }catch(e){}
    window._applyPanelTheme=function(t){apply(t)};
})();
</script>
</body>
</html>
