<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SAO Creative Workshop</title>
<style>
:root {
  --bg: #1a1c22;
  --panel: #22252c;
  --card: #282b33;
  --card-hover: #2e323b;
  --header: #1e2028;
  --text: #e8e8ec;
  --muted: #8a8d96;
  --cyan: #68e4ff;
  --gold: #dea620;
  --green: #4ae68a;
  --red: #ff707a;
  --border: #383c46;
  --sidebar-w: 210px;
  --header-h: 42px;
  --status-h: 32px;
  --radius: 6px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:13px; color:var(--text); background:var(--bg); user-select:none; }
a { color:var(--cyan); text-decoration:none; }

/* ── Header (title bar, drag area) ── */
.ws-header {
  height:var(--header-h); background:var(--header); display:flex; align-items:center;
  padding:0 12px; gap:10px; border-bottom:1px solid var(--border);
  -webkit-app-region:drag;
}
.ws-header .logo { color:var(--cyan); font-size:15px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
.ws-header .logo span { color:var(--gold); margin-right:6px; }
.ws-search {
  flex:1; max-width:360px; margin-left:auto; -webkit-app-region:no-drag;
}
.ws-search input {
  width:100%; padding:5px 12px; border-radius:14px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:12px; outline:none;
  transition:border-color .2s;
}
.ws-search input:focus { border-color:var(--cyan); }
.ws-close {
  width:30px; height:30px; border:none; background:transparent; color:var(--muted);
  font-size:18px; cursor:pointer; border-radius:4px; display:flex; align-items:center;
  justify-content:center; -webkit-app-region:no-drag; transition:all .15s;
}
.ws-close:hover { background:var(--red); color:#fff; }

/* ── Layout ── */
.ws-body { display:flex; height:calc(100vh - var(--header-h) - var(--status-h)); }

/* ── Sidebar ── */
.ws-sidebar {
  width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--panel);
  border-right:1px solid var(--border); overflow-y:auto; padding:12px 0;
  display:flex; flex-direction:column; gap:2px;
}
.ws-sidebar .section-title {
  font-size:10px; text-transform:uppercase; color:var(--muted); letter-spacing:1.5px;
  padding:10px 16px 4px; font-weight:600;
}
.ws-sidebar .game-item {
  padding:7px 16px; cursor:pointer; display:flex; align-items:center; gap:8px;
  transition:background .15s; font-size:12px; color:var(--text);
}
.ws-sidebar .game-item:hover { background:var(--card); }
.ws-sidebar .game-item.active { background:var(--card); color:var(--cyan); border-left:3px solid var(--cyan); padding-left:13px; }
.ws-sidebar .game-item .count { color:var(--muted); font-size:11px; margin-left:auto; }
.ws-sidebar .tag-cloud { padding:8px 16px; display:flex; flex-wrap:wrap; gap:4px; }
.ws-sidebar .tag-pill {
  padding:2px 8px; border-radius:10px; font-size:10px; background:var(--card);
  color:var(--muted); cursor:pointer; transition:all .15s; border:1px solid transparent;
}
.ws-sidebar .tag-pill:hover { border-color:var(--cyan); color:var(--cyan); }
.ws-sidebar .tag-pill.active { background:var(--cyan); color:var(--bg); border-color:var(--cyan); }

/* ── Main content ── */
.ws-main { flex:1; overflow-y:auto; padding:16px; }

/* ── Plugin grid ── */
.plugin-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:12px;
}
.plugin-card {
  background:var(--card); border-radius:var(--radius); border-left:3px solid var(--cyan);
  padding:14px 16px; cursor:pointer; transition:all .2s; position:relative;
}
.plugin-card:hover { background:var(--card-hover); transform:translateY(-1px); box-shadow:0 4px 16px rgba(104,228,255,.08); }
.plugin-card .card-head { display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; }
.plugin-card .card-icon {
  width:40px; height:40px; border-radius:6px; background:var(--panel);
  display:flex; align-items:center; justify-content:center; font-size:20px;
  color:var(--cyan); flex-shrink:0; overflow:hidden;
}
.plugin-card .card-icon img { width:100%; height:100%; object-fit:cover; border-radius:6px; }
.plugin-card .card-title { font-size:14px; font-weight:600; color:var(--text); line-height:1.3; }
.plugin-card .card-author { font-size:11px; color:var(--muted); margin-top:2px; }
.plugin-card .card-desc { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:10px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.plugin-card .card-footer { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.plugin-card .badge {
  padding:2px 7px; border-radius:8px; font-size:10px; font-weight:500;
}
.badge-game { background:#2a3040; color:var(--cyan); }
.badge-lang { background:#2a3530; color:var(--green); }
.badge-installed { background:#1a3525; color:var(--green); border:1px solid var(--green); }
.badge-tag { background:var(--panel); color:var(--muted); }
.plugin-card .card-stats { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; }
.plugin-card .install-btn {
  position:absolute; top:12px; right:12px; padding:4px 12px; border-radius:12px;
  border:1px solid var(--cyan); background:transparent; color:var(--cyan);
  font-size:11px; cursor:pointer; transition:all .15s; opacity:0;
}
.plugin-card:hover .install-btn { opacity:1; }
.plugin-card .install-btn:hover { background:var(--cyan); color:var(--bg); }
.plugin-card .install-btn.installed { border-color:var(--green); color:var(--green); opacity:1; pointer-events:none; }

/* ── Detail view ── */
.ws-detail { display:none; }
.ws-detail.active { display:block; }
.ws-detail .back-btn {
  display:inline-flex; align-items:center; gap:6px; color:var(--cyan); cursor:pointer;
  font-size:12px; margin-bottom:16px; padding:4px 0;
}
.ws-detail .back-btn:hover { text-decoration:underline; }
.ws-detail .detail-header { display:flex; align-items:flex-start; gap:16px; margin-bottom:20px; }
.ws-detail .detail-icon {
  width:64px; height:64px; border-radius:10px; background:var(--panel);
  display:flex; align-items:center; justify-content:center; font-size:32px;
  color:var(--cyan); flex-shrink:0; overflow:hidden;
}
.ws-detail .detail-icon img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
.ws-detail .detail-title { font-size:22px; font-weight:700; }
.ws-detail .detail-author { color:var(--muted); font-size:13px; margin-top:4px; }
.ws-detail .detail-version { color:var(--muted); font-size:12px; }
.ws-detail .detail-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
.ws-detail .btn-install {
  padding:8px 24px; border-radius:16px; border:none; background:var(--cyan);
  color:var(--bg); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s;
}
.ws-detail .btn-install:hover { filter:brightness(1.1); transform:scale(1.02); }
.ws-detail .btn-install.installed { background:var(--green); }
.ws-detail .btn-editor {
  padding:8px 16px; border-radius:16px; border:1px solid var(--gold); background:transparent;
  color:var(--gold); font-size:12px; cursor:pointer; transition:all .15s;
}
.ws-detail .btn-editor:hover { background:var(--gold); color:var(--bg); }
.ws-detail .meta-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:8px; margin-bottom:20px; background:var(--card); border-radius:var(--radius); padding:14px;
}
.ws-detail .meta-item { font-size:12px; }
.ws-detail .meta-item label { color:var(--muted); display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
.ws-detail .long-desc {
  background:var(--card); border-radius:var(--radius); padding:16px 20px;
  font-size:13px; line-height:1.7; color:var(--text); white-space:pre-wrap;
  max-height:60vh; overflow-y:auto;
}

/* ── Pagination ── */
.ws-pagination { display:flex; justify-content:center; gap:6px; margin-top:20px; }
.ws-pagination button {
  padding:4px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:12px; cursor:pointer;
}
.ws-pagination button.active { background:var(--cyan); color:var(--bg); border-color:var(--cyan); }
.ws-pagination button:hover:not(.active) { border-color:var(--cyan); }

/* ── Status bar ── */
.ws-status {
  height:var(--status-h); background:var(--header); border-top:1px solid var(--border);
  display:flex; align-items:center; padding:0 16px; font-size:11px; color:var(--muted);
}
.ws-status .status-dot { width:6px; height:6px; border-radius:50%; background:var(--green); margin-right:6px; }
.ws-status .status-dot.offline { background:var(--red); }

/* ── Empty state ── */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:200px; color:var(--muted); font-size:14px; gap:8px;
}
.empty-state .icon { font-size:48px; opacity:.3; }

/* ── Loading ── */
.loading { text-align:center; padding:40px; color:var(--muted); }

/* ── Toast ── */
.toast {
  position:fixed; bottom:60px; left:50%; transform:translateX(-50%);
  background:var(--card); color:var(--text); padding:10px 24px; border-radius:20px;
  border:1px solid var(--cyan); font-size:12px; z-index:9999;
  opacity:0; transition:opacity .3s; pointer-events:none;
}
.toast.show { opacity:1; }

/* scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }
</style>
</head>
<body>

<div class="ws-header">
  <div class="logo"><span>&#9670;</span>CREATIVE WORKSHOP</div>
  <div class="ws-search">
    <input type="text" id="search-input" placeholder="Search plugins..." autocomplete="off"/>
  </div>
  <button class="ws-close" onclick="Workshop.close()" title="Close">&times;</button>
</div>

<div class="ws-body">
  <div class="ws-sidebar" id="sidebar">
    <div class="section-title">GAMES</div>
    <div id="game-list">
      <div class="game-item active" data-game="" onclick="Workshop.filterGame('')">
        All Games <span class="count" id="count-all">0</span>
      </div>
    </div>
    <div class="section-title" style="margin-top:12px">TAGS</div>
    <div class="tag-cloud" id="tag-cloud"></div>
  </div>

  <div class="ws-main" id="main-content">
    <div id="grid-view">
      <div class="plugin-grid" id="plugin-grid"></div>
      <div class="ws-pagination" id="pagination"></div>
    </div>
    <div class="ws-detail" id="detail-view"></div>
  </div>
</div>

<div class="ws-status">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Connecting...</span>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var state = {
  page: 1,
  perPage: 40,
  total: 0,
  gameFilter: '',
  tagFilter: '',
  searchQuery: '',
  plugins: [],
  installed: [],
  gameIds: {},
  tags: {},
  loading: false,
  connected: false,
  detailPlugin: null,
};

var searchTimer = null;
var api = null;

function ready() {
  if (window.pywebview && window.pywebview.api) {
    api = window.pywebview.api;
    init();
  } else {
    setTimeout(ready, 100);
  }
}

function init() {
  api.load_config().then(function(cfg) {
    state.connected = true;
    document.getElementById('status-dot').className = 'status-dot';
    document.getElementById('status-text').textContent = 'Connected to ' + (cfg.server || 'server');
  }).catch(function() {
    state.connected = false;
    document.getElementById('status-dot').className = 'status-dot offline';
    document.getElementById('status-text').textContent = 'Offline';
  });

  api.get_installed().then(function(ids) {
    state.installed = ids || [];
    loadCatalog();
  }).catch(function() { loadCatalog(); });

  document.getElementById('search-input').addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      state.searchQuery = e.target.value.trim();
      state.page = 1;
      loadCatalog();
    }, 350);
  });
}

function loadCatalog() {
  state.loading = true;
  renderLoading();
  api.browse(state.gameFilter, state.tagFilter, state.searchQuery, state.page, state.perPage)
    .then(function(resp) {
      state.loading = false;
      if (!resp || !resp.ok) {
        renderError(resp ? resp.error : 'Failed to connect');
        return;
      }
      state.plugins = resp.plugins || [];
      state.total = resp.total || 0;
      state.gameIds = resp.game_ids || {};
      state.tags = resp.tags || {};
      state.connected = true;
      document.getElementById('status-dot').className = 'status-dot';
      document.getElementById('status-text').textContent = state.total + ' plugins available';
      document.getElementById('count-all').textContent = state.total;
      renderSidebar();
      renderGrid();
      renderPagination();
    })
    .catch(function(err) {
      state.loading = false;
      renderError(String(err));
    });
}

function renderLoading() {
  document.getElementById('plugin-grid').innerHTML = '<div class="loading">Loading...</div>';
}

function renderError(msg) {
  document.getElementById('plugin-grid').innerHTML =
    '<div class="empty-state"><div class="icon">&#9888;</div><div>' + escHtml(msg) + '</div></div>';
  document.getElementById('status-dot').className = 'status-dot offline';
  document.getElementById('status-text').textContent = msg;
}

function renderSidebar() {
  var gl = document.getElementById('game-list');
  var html = '<div class="game-item' + (!state.gameFilter ? ' active' : '') + '" data-game="" onclick="Workshop.filterGame(\'\')">' +
    'All Games <span class="count">' + state.total + '</span></div>';
  var ids = Object.keys(state.gameIds).sort();
  for (var i = 0; i < ids.length; i++) {
    var gid = ids[i];
    var active = state.gameFilter === gid ? ' active' : '';
    html += '<div class="game-item' + active + '" data-game="' + escAttr(gid) + '" onclick="Workshop.filterGame(\'' + escAttr(gid) + '\')">' +
      escHtml(gid) + ' <span class="count">' + state.gameIds[gid] + '</span></div>';
  }
  gl.innerHTML = html;

  var tc = document.getElementById('tag-cloud');
  var thtml = '';
  var tkeys = Object.keys(state.tags).sort();
  for (var j = 0; j < tkeys.length; j++) {
    var tag = tkeys[j];
    var tactive = state.tagFilter === tag ? ' active' : '';
    thtml += '<span class="tag-pill' + tactive + '" onclick="Workshop.filterTag(\'' + escAttr(tag) + '\')">' + escHtml(tag) + '</span>';
  }
  tc.innerHTML = thtml;
}

function renderGrid() {
  var grid = document.getElementById('plugin-grid');
  if (!state.plugins.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">&#128270;</div><div>No plugins found</div></div>';
    return;
  }
  var html = '';
  for (var i = 0; i < state.plugins.length; i++) {
    var p = state.plugins[i];
    var isInstalled = state.installed.indexOf(p.plugin_id) >= 0;
    var iconHtml = p.icon_url
      ? '<img src="' + escAttr(p.icon_url) + '" onerror="this.parentElement.textContent=\'&#9670;\'" />'
      : '&#9670;';
    var badges = '';
    var gids = p.game_ids || [];
    for (var g = 0; g < gids.length && g < 2; g++) {
      badges += '<span class="badge badge-game">' + escHtml(gids[g]) + '</span>';
    }
    badges += '<span class="badge badge-lang">' + escHtml(p.language || 'python') + '</span>';
    if (isInstalled) badges += '<span class="badge badge-installed">INSTALLED</span>';

    html += '<div class="plugin-card" onclick="Workshop.showDetail(\'' + escAttr(p.plugin_id) + '\')">' +
      '<button class="install-btn' + (isInstalled ? ' installed' : '') + '" onclick="event.stopPropagation();Workshop.install(\'' + escAttr(p.plugin_id) + '\')">' +
        (isInstalled ? 'Installed' : 'Install') + '</button>' +
      '<div class="card-head"><div class="card-icon">' + iconHtml + '</div><div>' +
        '<div class="card-title">' + escHtml(p.name) + '</div>' +
        '<div class="card-author">by ' + escHtml(p.author || 'Unknown') + '</div>' +
      '</div></div>' +
      '<div class="card-desc">' + escHtml(p.description || '') + '</div>' +
      '<div class="card-footer">' + badges +
        '<span class="card-stats">' + (p.download_count || 0) + ' downloads</span>' +
      '</div></div>';
  }
  grid.innerHTML = html;
}

function renderPagination() {
  var pag = document.getElementById('pagination');
  var totalPages = Math.ceil(state.total / state.perPage);
  if (totalPages <= 1) { pag.innerHTML = ''; return; }
  var html = '';
  if (state.page > 1) html += '<button onclick="Workshop.goPage(' + (state.page - 1) + ')">&lt;</button>';
  for (var i = 1; i <= totalPages && i <= 10; i++) {
    html += '<button class="' + (i === state.page ? 'active' : '') + '" onclick="Workshop.goPage(' + i + ')">' + i + '</button>';
  }
  if (state.page < totalPages) html += '<button onclick="Workshop.goPage(' + (state.page + 1) + ')">&gt;</button>';
  pag.innerHTML = html;
}

function showDetailView(pluginId) {
  api.detail(pluginId).then(function(resp) {
    if (!resp || !resp.ok) { showToast('Failed to load plugin details'); return; }
    var p = resp.plugin;
    state.detailPlugin = p;
    var isInstalled = state.installed.indexOf(p.plugin_id) >= 0;
    var iconHtml = p.icon_url
      ? '<img src="' + escAttr(p.icon_url) + '" onerror="this.parentElement.textContent=\'&#9670;\'" />'
      : '&#9670;';

    var metaHtml = '';
    var metaItems = [
      ['Game', (p.game_ids || []).join(', ') || '-'],
      ['Tags', (p.tags || []).join(', ') || '-'],
      ['Downloads', String(p.download_count || 0)],
      ['Size', formatSize(p.size || 0)],
      ['Language', p.language || 'python'],
      ['Permissions', (p.permissions || []).join(', ') || 'none'],
      ['Updated', (p.updated_at || '').split('T')[0] || '-'],
      ['Min App Version', p.minimum_app_version || '-'],
    ];
    for (var i = 0; i < metaItems.length; i++) {
      metaHtml += '<div class="meta-item"><label>' + metaItems[i][0] + '</label>' + escHtml(metaItems[i][1]) + '</div>';
    }

    var html = '<div class="back-btn" onclick="Workshop.backToGrid()">&larr; Back to list</div>' +
      '<div class="detail-header">' +
        '<div class="detail-icon">' + iconHtml + '</div>' +
        '<div><div class="detail-title">' + escHtml(p.name || p.plugin_id) + '</div>' +
          '<div class="detail-author">by ' + escHtml(p.author || 'Unknown') + '</div>' +
          '<div class="detail-version">v' + escHtml(p.version || '?') + '</div>' +
        '</div>' +
        '<div class="detail-actions">' +
          (isInstalled ? '<button class="btn-editor" onclick="Workshop.openEditor(\'' + escAttr(p.plugin_id) + '\')">Edit in AI Editor</button>' : '') +
          '<button class="btn-install' + (isInstalled ? ' installed' : '') + '" onclick="Workshop.install(\'' + escAttr(p.plugin_id) + '\')">' +
            (isInstalled ? 'Installed' : 'Install') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="meta-grid">' + metaHtml + '</div>' +
      '<div class="long-desc">' + escHtml(p.long_description || p.description || 'No description available.') + '</div>';

    document.getElementById('detail-view').innerHTML = html;
    document.getElementById('detail-view').className = 'ws-detail active';
    document.getElementById('grid-view').style.display = 'none';
  }).catch(function(err) { showToast('Error: ' + err); });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

function escHtml(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function escAttr(s) { return (s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }
function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

window.Workshop = {
  filterGame: function(gid) {
    state.gameFilter = gid;
    state.page = 1;
    loadCatalog();
  },
  filterTag: function(tag) {
    state.tagFilter = state.tagFilter === tag ? '' : tag;
    state.page = 1;
    loadCatalog();
  },
  goPage: function(p) {
    state.page = p;
    loadCatalog();
    document.getElementById('main-content').scrollTop = 0;
  },
  showDetail: function(pluginId) { showDetailView(pluginId); },
  backToGrid: function() {
    document.getElementById('detail-view').className = 'ws-detail';
    document.getElementById('grid-view').style.display = '';
    state.detailPlugin = null;
  },
  install: function(pluginId) {
    showToast('Installing ' + pluginId + '...');
    api.install(pluginId).then(function(result) {
      if (result && (result.ok !== false)) {
        showToast('Installed ' + (result.name || pluginId) + ' successfully!');
        if (state.installed.indexOf(pluginId) < 0) state.installed.push(pluginId);
        renderGrid();
        if (state.detailPlugin && state.detailPlugin.plugin_id === pluginId) {
          showDetailView(pluginId);
        }
      } else {
        showToast('Install failed: ' + (result.error || result.message || 'unknown error'));
      }
    }).catch(function(err) { showToast('Install error: ' + err); });
  },
  openEditor: function(pluginId) {
    api.open_in_editor(pluginId).then(function(r) {
      if (r && r.ok) showToast('Opening in AI Editor...');
      else showToast('Failed: ' + (r.error || ''));
    }).catch(function(e) { showToast('Error: ' + e); });
  },
  close: function() {
    if (api) api.close_window();
  },
};

document.addEventListener('DOMContentLoaded', ready);
if (document.readyState !== 'loading') ready();
})();
</script>
</body>
</html>
