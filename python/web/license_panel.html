<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAO — 授权验证</title>
<style>
:root {
    --bg: rgba(11, 18, 28, 0.72);
    --panel: rgba(22, 35, 54, 0.88);
    --panel2: rgba(8, 14, 22, 0.72);
    --line: rgba(117, 205, 255, 0.52);
    --line2: rgba(255, 214, 117, 0.72);
    --text: rgba(232, 246, 255, 0.96);
    --muted: rgba(177, 203, 223, 0.78);
    --danger: #ff6b82;
    --ok: #7df2bf;
    --gold: #f3af12;
    --blue: #73d7ff;
    --cyan: rgba(104, 228, 255, 0.86);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
    width: 100%; height: 100%;
    background: transparent;
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
}
body { padding: 14px; }

.shell {
    position: relative;
    width: 100%;
    height: calc(100vh - 28px);
    border: 1px solid var(--line);
    background:
        linear-gradient(135deg, rgba(102, 204, 255, 0.16), transparent 18%, transparent 74%, rgba(255, 219, 120, 0.12)),
        linear-gradient(180deg, rgba(18, 31, 47, 0.94), rgba(9, 14, 22, 0.88));
    box-shadow:
        0 0 32px rgba(88, 199, 255, 0.22),
        inset 0 0 28px rgba(109, 216, 255, 0.10);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(10px) scale(0.985);
    transition: opacity .35s ease, transform .35s ease;
}
.shell.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
}
/* 扫描线 */
.shell::before {
    content: "";
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
        180deg,
        rgba(255,255,255,0.035) 0,
        rgba(255,255,255,0.035) 1px,
        transparent 1px,
        transparent 7px
    );
    mix-blend-mode: screen;
}
/* 角标 cyan TL + gold BR */
.shell::after {
    content: "";
    pointer-events: none;
    position: absolute;
    top: 0; left: 0;
    width: 32px; height: 32px;
    border-top: 2px solid var(--cyan);
    border-left: 2px solid var(--cyan);
    border-radius: 12px 0 0 0;
    opacity: 0.78;
}

/* ── 标题栏 ── */
.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 56px;
    padding: 10px 14px 8px 18px;
    border-bottom: 1px solid rgba(117, 205, 255, 0.35);
    background: linear-gradient(90deg, rgba(18, 59, 94, 0.76), rgba(11, 22, 35, 0.58));
}
.title-block { display: flex; flex-direction: column; gap: 1px; }
.kicker {
    letter-spacing: 0.22em;
    font-size: 9px;
    color: var(--line2);
    text-shadow: 0 0 10px rgba(255, 214, 117, 0.52);
}
.title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.10em;
}
.header-actions { display: flex; gap: 8px; align-items: center; }
button {
    border: 1px solid rgba(117, 205, 255, 0.48);
    background: linear-gradient(180deg, rgba(61, 143, 201, 0.42), rgba(19, 48, 74, 0.58));
    color: var(--text);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
}
button:hover { transform: translateY(-1px); box-shadow: 0 0 16px rgba(107, 214, 255, 0.25); }
button:active { transform: translateY(0); }
button.gold {
    border-color: rgba(255, 214, 117, 0.74);
    background: linear-gradient(180deg, rgba(243, 175, 18, 0.52), rgba(180, 120, 10, 0.58));
    color: #fff8da;
}
button.close {
    width: 30px; height: 30px; padding: 0;
    border-radius: 50%;
    font-size: 16px;
}

/* ── 内容区 ── */
.body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 22px;
    overflow: auto;
}

/* 状态卡片 */
.status-card {
    border: 1px solid rgba(117, 205, 255, 0.34);
    border-left: 3px solid var(--cyan);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(27, 46, 68, 0.86), rgba(9, 16, 26, 0.82));
    padding: 14px 16px;
}
.status-card.paid { border-left-color: var(--ok); }
.status-card.free { border-left-color: var(--gold); }

.status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
}
.status-label { font-size: 12px; color: var(--muted); }
.status-value { font-size: 13px; font-weight: 600; }
.status-value.paid { color: var(--ok); }
.status-value.free { color: var(--gold); }

.divider {
    width: 100%;
    height: 1px;
    background: rgba(117, 205, 255, 0.18);
    margin: 4px 0;
}

/* 激活区 */
.activate-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.activate-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
}
.input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
}
.key-input {
    flex: 1;
    background: rgba(8, 14, 22, 0.72);
    border: 1px solid rgba(117, 205, 255, 0.38);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-family: "Consolas", "Segoe UI", monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
}
.key-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 12px rgba(243, 175, 18, 0.22);
}
.key-input.error {
    border-color: var(--danger);
    box-shadow: 0 0 8px rgba(255, 107, 130, 0.28);
}

.msg {
    font-size: 11px;
    min-height: 16px;
    transition: color .15s ease;
}
.msg.ok { color: var(--ok); }
.msg.err { color: var(--danger); }
.msg.wait { color: var(--muted); }

/* ── 底栏 ── */
.footer {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 10px 22px 14px;
    border-top: 1px solid rgba(117, 205, 255, 0.18);
}
</style>
</head>
<body>

<div class="shell" id="shell">
    <div class="header">
        <div class="title-block">
            <span class="kicker">LICENSE</span>
            <span class="title">授 权 验 证</span>
        </div>
        <div class="header-actions">
            <button class="close" onclick="skip()" title="跳过">✕</button>
        </div>
    </div>

    <div class="body">
        <div class="status-card" id="statusCard">
            <div class="status-row">
                <span class="status-label">授权等级</span>
                <span class="status-value" id="tierValue">—</span>
            </div>
            <div class="divider"></div>
            <div class="status-row">
                <span class="status-label">可用引擎</span>
                <span class="status-value" id="engineValue">—</span>
            </div>
            <div class="divider"></div>
            <div class="status-row">
                <span class="status-label">设备指纹</span>
                <span class="status-value" id="hwidValue" style="font-size:11px;color:var(--muted);font-weight:400">—</span>
            </div>
        </div>

        <div class="activate-section">
            <span class="activate-label">输入激活码</span>
            <div class="input-row">
                <input type="text" class="key-input" id="keyInput"
                       placeholder="SAO-XXXX-XXXX-XXXX"
                       spellcheck="false" autocomplete="off" />
                <button class="gold" onclick="activate()" id="activateBtn">激活</button>
            </div>
            <div class="msg" id="msg"></div>
        </div>
    </div>

    <div class="footer">
        <button onclick="skip()" style="min-width:100px">跳过 (免费版)</button>
        <button class="gold" onclick="activate()" style="min-width:100px">激活</button>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

function refreshStatus(status) {
    const card = $('statusCard');
    const tier = $('tierValue');
    const engine = $('engineValue');
    const hwid = $('hwidValue');

    if (status.is_paid) {
        card.className = 'status-card paid';
        tier.textContent = '付费版';
        tier.className = 'status-value paid';
        engine.textContent = 'A · B · C · D';
        engine.className = 'status-value paid';
    } else {
        card.className = 'status-card free';
        tier.textContent = '免费版';
        tier.className = 'status-value free';
        engine.textContent = 'A';
        engine.className = 'status-value free';
    }
    hwid.textContent = status.hwid || '—';
}

function showMsg(text, type) {
    const el = $('msg');
    el.textContent = text;
    el.className = 'msg ' + (type || '');
}

async function activate() {
    const key = $('keyInput').value.trim();
    if (!key) {
        showMsg('请输入激活码', 'err');
        $('keyInput').classList.add('error');
        setTimeout(() => $('keyInput').classList.remove('error'), 1200);
        return;
    }

    showMsg('验证中...', 'wait');
    $('activateBtn').disabled = true;

    try {
        const result = JSON.parse(await pywebview.api.license_activate(key));
        if (result.ok) {
            showMsg('激活成功！', 'ok');
            const status = JSON.parse(await pywebview.api.license_status());
            refreshStatus(status);
            setTimeout(() => pywebview.api.license_done(), 800);
        } else {
            showMsg(result.error || '激活失败', 'err');
            $('keyInput').classList.add('error');
            setTimeout(() => $('keyInput').classList.remove('error'), 1200);
        }
    } catch (e) {
        showMsg('网络错误: ' + e.message, 'err');
    }
    $('activateBtn').disabled = false;
}

function skip() {
    pywebview.api.license_done(true);
}

// Enter 触发
$('keyInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') activate();
});

// 初始化
(async function init() {
    setTimeout(() => $('shell').classList.add('visible'), 60);
    try {
        const status = JSON.parse(await pywebview.api.license_status());
        refreshStatus(status);
        if (status.is_paid) {
            showMsg('许可证有效', 'ok');
            setTimeout(() => pywebview.api.license_done(), 1200);
        }
    } catch (e) {
        showMsg('无法获取状态', 'err');
    }
})();
</script>
</body>
</html>
