<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plugin Surface Placeholder</title>
<link rel="stylesheet" href="panel_theme.css" />
<script src="panel_theme.js"></script>
<style>
html, body { margin: 0; width: 100%; min-height: 100%; }
body { display: grid; place-items: center; padding: 24px; }
.placeholder { max-width: 520px; border: 1px solid var(--panel-edge); background: var(--panel-card-bg); color: var(--panel-text); padding: 20px; border-radius: 6px; line-height: 1.6; }
.placeholder h1 { margin: 0 0 10px; color: var(--panel-gold); font-size: 18px; }
.placeholder p { margin: 0; color: var(--panel-muted); }
</style>
</head>
<body>
<div class="placeholder">
    <h1>Plugin-owned surface</h1>
    <p>This platform placeholder intentionally contains no plugin implementation. Plugins provide their own WebView pages dynamically.</p>
</div>
</body>
</html>
